function Dashboard({clients, orders, appointments, goTo, config}){
  const now = new Date();
  const monthOrders = orders.filter(o=>{
    const d = new Date(o.dataISO+'T00:00:00');
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  // Só soma como "faturamento confiável" as OS que já têm peças/mão de obra separadas.
  // OS antigas (sem separação) ficam de fora da conta principal, porque o valor delas pode incluir
  // peça de fornecedor externo que não é seu lucro — juntar tudo ia mentir sobre quanto você realmente ganhou.
  const monthOrdersSeparadas = monthOrders.filter(o=>orderUsaItens(o));
  const monthOrdersLegado = monthOrders.filter(o=>!orderUsaItens(o));
  // Faturamento = tudo que já é seu de verdade: OS concluídas (valor cheio) + qualquer valor já
  // recebido registrado em OS ainda abertas/arquivadas (ex: sinal pago adiantado).
  const monthTotal = monthOrdersSeparadas.reduce((s,o)=>s+orderValorJaRecebido(o),0);
  const monthTotalLegado = monthOrdersLegado.reduce((s,o)=>s+orderValorJaRecebido(o),0);
  // Lucro previsto = só o que AINDA FALTA receber das OS em aberto (não conta de novo o que já entrou).
  const abertasSeparadas = orders.filter(o=>orderUsaItens(o) && orderEhAberto(o));
  const abertasLegado = orders.filter(o=>!orderUsaItens(o) && orderEhAberto(o) && parseFloat(o.valor)>0);
  const lucroPrevisto = abertasSeparadas.reduce((s,o)=>s+orderValorPendente(o),0);
  const upcoming = appointments
    .filter(a=>a.status==='agendado' && a.data >= todayISO())
    .sort((a,b)=> (a.data+a.hora).localeCompare(b.data+b.hora))
    .slice(0,5);
  const shortcutIds = (config.dashboardAtalhos && config.dashboardAtalhos.length) ? config.dashboardAtalhos : DEFAULT_SHORTCUTS;
  const shortcuts = shortcutIds.map(id=>SHORTCUT_DEFS.find(s=>s.id===id)).filter(Boolean);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Início</h1>
          <div className="page-sub">Visão geral da LontraHelp</div>
        </div>
        <div style={{display:'flex', gap:10, flexWrap:'wrap', alignItems:'center'}}>
          {shortcuts.map((s,i)=>(
            <button key={s.id} className={i===0 ? 'btn btn-gold' : 'btn btn-outline'} onClick={()=>goTo(s.tab, s.mode)}>{s.ic} {s.label}</button>
          ))}
          <button className="btn btn-outline btn-sm" onClick={()=>goTo('configuracoes')} title="Configurar atalhos">⚙️</button>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>goTo('clientes')}><div className="ic">👥</div><div className="num">{clients.length}</div><div className="lbl">Clientes cadastrados</div></div>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>goTo('ordens')}><div className="ic">🧾</div><div className="num">{monthOrders.length}</div><div className="lbl">OS este mês</div></div>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>goTo('despesas')}><div className="ic">💰</div><div className="num">R$ {formatMoney(monthTotal)}</div><div className="lbl">Faturado no mês (já concluído e pago)</div></div>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>goTo('ordens')}><div className="ic">🔮</div><div className="num">R$ {formatMoney(lucroPrevisto)}</div><div className="lbl">Lucro previsto ({abertasSeparadas.length} OS em aberto)</div></div>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>goTo('agendamento')}><div className="ic">📅</div><div className="num">{upcoming.length}</div><div className="lbl">Próximos agendamentos</div></div>
      </div>
      {(monthOrdersLegado.filter(orderEhFaturado).length>0 || abertasLegado.length>0) && (
        <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'10px 14px', borderRadius:8, marginBottom:16}}>
          ⚠️ Existem OS não separadas (valor bruto, pode incluir peça de fornecedor) que ficam de fora desses números: {monthOrdersLegado.filter(orderEhFaturado).length} concluída(s) este mês e {abertasLegado.length} ainda em aberto. <span style={{textDecoration:'underline', cursor:'pointer', fontWeight:700}} onClick={()=>goTo('ordens')}>Ver e corrigir essas OS</span>.
        </div>
      )}

      <div className="card">
        <h3 style={{marginTop:0, color:'var(--navy)', fontSize:15}}>Próximos agendamentos</h3>
        {upcoming.length===0 && <div className="empty-state"><div className="ic">📅</div>Nenhum agendamento próximo.</div>}
        {upcoming.map(a=>{
          const c = clients.find(c=>c.id===a.clientId);
          return (
            <div className="appt-item" key={a.id} style={{cursor:'pointer'}} onClick={()=>goTo('agendamento', null, null, null, a.data)}>
              <div className="t">{formatDateBR(a.data)} às {a.hora}</div>
              <div className="n">{a.titulo}</div>
              {c && <div className="d">Cliente: {c.nome}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- CONFIGURAÇÕES ---------------- */
function ConfiguracoesTab({config, setConfig}){
  const atalhosAtuais = (config.dashboardAtalhos && config.dashboardAtalhos.length) ? config.dashboardAtalhos : DEFAULT_SHORTCUTS;
  const [authCfg, setAuthCfg] = useState(()=>getAuthConfig());
  const [acessoDesbloqueado, setAcessoDesbloqueado] = useState(false);
  const [novoUsuario, setNovoUsuario] = useState('');
  const [novaSenha, setNovaSenha] = useState('');
  const [novaAdminPass, setNovaAdminPass] = useState('');

  const removerAtalho = (id)=>{
    setConfig(prev=>{
      const atuais = (prev.dashboardAtalhos && prev.dashboardAtalhos.length) ? prev.dashboardAtalhos : DEFAULT_SHORTCUTS;
      return {...prev, dashboardAtalhos: atuais.filter(x=>x!==id)};
    });
  };
  const adicionarAtalho = (id)=>{
    setConfig(prev=>{
      const atuais = (prev.dashboardAtalhos && prev.dashboardAtalhos.length) ? prev.dashboardAtalhos : DEFAULT_SHORTCUTS;
      return {...prev, dashboardAtalhos: [...atuais, id]};
    });
  };
  const moverAtalho = (id, direcao)=>{
    setConfig(prev=>{
      const atuais = [...((prev.dashboardAtalhos && prev.dashboardAtalhos.length) ? prev.dashboardAtalhos : DEFAULT_SHORTCUTS)];
      const idx = atuais.indexOf(id);
      const novoIdx = idx+direcao;
      if(idx<0 || novoIdx<0 || novoIdx>=atuais.length) return prev;
      [atuais[idx], atuais[novoIdx]] = [atuais[novoIdx], atuais[idx]];
      return {...prev, dashboardAtalhos: atuais};
    });
  };

  const disponiveis = SHORTCUT_DEFS.filter(s=>!atalhosAtuais.includes(s.id));

  const desbloquearAcesso = async ()=>{
    const senha = prompt('Senha de administrador:');
    if(senha===null) return;
    if(await checkAdminPass(senha)) setAcessoDesbloqueado(true);
    else alert('Senha incorreta.');
  };
  const adicionarUsuario = async ()=>{
    if(!novoUsuario.trim() || !novaSenha){ alert('Preencha usuário e senha.'); return; }
    const hash = await sha256Hex(novaSenha);
    const atualizado = {...authCfg, usuarios:[...authCfg.usuarios, {usuario:novoUsuario.trim(), senhaHash:hash}]};
    setAuthCfg(atualizado);
    saveAuthConfig(atualizado);
    setNovoUsuario(''); setNovaSenha('');
  };
  const removerUsuario = (usuario)=>{
    if(authCfg.usuarios.length<=1){ alert('Tem que ter pelo menos um usuário.'); return; }
    if(!confirm(`Remover o acesso de "${usuario}"?`)) return;
    const atualizado = {...authCfg, usuarios: authCfg.usuarios.filter(u=>u.usuario!==usuario)};
    setAuthCfg(atualizado);
    saveAuthConfig(atualizado);
  };
  const trocarSenhaUsuario = async (usuario)=>{
    const nova = prompt(`Nova senha pra "${usuario}":`);
    if(!nova) return;
    const hash = await sha256Hex(nova);
    const atualizado = {...authCfg, usuarios: authCfg.usuarios.map(u=> u.usuario===usuario ? {...u, senhaHash:hash} : u)};
    setAuthCfg(atualizado);
    saveAuthConfig(atualizado);
  };
  const salvarNovaAdminPass = async ()=>{
    if(!novaAdminPass.trim()){ alert('Digite a nova senha de administrador.'); return; }
    const hash = await sha256Hex(novaAdminPass.trim().replace(',','.'));
    const atualizado = {...authCfg, adminPassHash: hash};
    setAuthCfg(atualizado);
    saveAuthConfig(atualizado);
    setNovaAdminPass('');
    alert('Senha de administrador atualizada.');
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Configurações</h1>
          <div className="page-sub">Escolha quais atalhos aparecem no Início, na ordem que quiser</div>
        </div>
      </div>

      <div className="section-bar">Atalhos ativos</div>
      {atalhosAtuais.length===0 && <div className="empty-state"><div className="ic">⚙️</div>Nenhum atalho ativo — adicione abaixo.</div>}
      {atalhosAtuais.map((id,i)=>{
        const def = SHORTCUT_DEFS.find(s=>s.id===id);
        if(!def) return null;
        return (
          <div className="list-item" key={id}>
            <div className="li-main"><strong>{def.ic} {def.label}</strong></div>
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-outline btn-sm" disabled={i===0} onClick={()=>moverAtalho(id,-1)}>↑</button>
              <button className="btn btn-outline btn-sm" disabled={i===atalhosAtuais.length-1} onClick={()=>moverAtalho(id,1)}>↓</button>
              <button className="btn btn-danger btn-sm" onClick={()=>removerAtalho(id)}>Remover</button>
            </div>
          </div>
        );
      })}

      {disponiveis.length>0 && (
        <React.Fragment>
          <div className="section-bar">Adicionar atalho</div>
          {disponiveis.map(s=>(
            <div className="list-item" key={s.id} onClick={()=>adicionarAtalho(s.id)} style={{cursor:'pointer'}}>
              <div className="li-main"><strong>{s.ic} {s.label}</strong></div>
              <span className="btn btn-gold btn-sm">+ Adicionar</span>
            </div>
          ))}
        </React.Fragment>
      )}

      <div className="section-bar">🔒 Dados da empresa</div>
      <div className="field-row">
        <div className="field">
          <label>CNPJ (opcional — aparece nos recibos quando preenchido)</label>
          <input value={config.empresaCnpj||''} onChange={e=>setConfig(prev=>({...prev, empresaCnpj:e.target.value}))} placeholder="Deixe em branco por enquanto" />
        </div>
      </div>

      <div className="section-bar">💬 Mensagens do WhatsApp</div>
      <div className="card" style={{marginBottom:16}}>
        <p style={{fontSize:13, color:'var(--ink-soft)', marginTop:0, lineHeight:1.6}}>
          Textos usados no botão <strong>💬 WhatsApp</strong> dos agendamentos. Dá pra usar: <code>{'{nome}'}</code> (primeiro nome), <code>{'{data}'}</code>, <code>{'{dia}'}</code> (dia da semana), <code>{'{hora}'}</code>, <code>{'{titulo}'}</code> e <code>{'{local}'}</code>.
        </p>
        <div className="field-row"><div className="field">
          <label>Confirmação do agendamento</label>
          <textarea rows={4} value={config.msgWhatsConfirmacao ?? MSG_CONFIRMACAO_PADRAO} onChange={e=>setConfig(prev=>({...prev, msgWhatsConfirmacao:e.target.value}))} />
        </div></div>
        <div className="field-row"><div className="field">
          <label>Lembrete (dia anterior)</label>
          <textarea rows={4} value={config.msgWhatsLembrete ?? MSG_LEMBRETE_PADRAO} onChange={e=>setConfig(prev=>({...prev, msgWhatsLembrete:e.target.value}))} />
        </div></div>
        <button className="btn btn-outline btn-sm" onClick={()=>setConfig(prev=>({...prev, msgWhatsConfirmacao:undefined, msgWhatsLembrete:undefined}))}>↩️ Voltar aos textos padrão</button>
      </div>

      <div className="section-bar">🔒 Acesso ao sistema</div>
      {!acessoDesbloqueado ? (
        <div className="card" style={{marginBottom:16}}>
          <p style={{fontSize:13, color:'var(--ink-soft)', marginTop:0}}>Editar login, senha ou adicionar outros usuários exige a senha de administrador.</p>
          <button className="btn btn-outline" onClick={desbloquearAcesso}>🔓 Desbloquear</button>
        </div>
      ) : (
        <React.Fragment>
          <div className="card" style={{marginBottom:16}}>
            <h3 style={{marginTop:0, color:'var(--navy)', fontSize:15}}>Usuários com acesso</h3>
            {authCfg.usuarios.map(u=>(
              <div className="list-item" key={u.usuario}>
                <div className="li-main"><strong>{u.usuario}</strong></div>
                <div style={{display:'flex', gap:6}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>trocarSenhaUsuario(u.usuario)}>Trocar senha</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>removerUsuario(u.usuario)}>Remover</button>
                </div>
              </div>
            ))}
            <div className="field-row" style={{marginTop:12}}>
              <div className="field">
                <label>Novo usuário</label>
                <input value={novoUsuario} onChange={e=>setNovoUsuario(e.target.value)} placeholder="Ex: Kemily" />
              </div>
              <div className="field">
                <label>Senha</label>
                <input value={novaSenha} onChange={e=>setNovaSenha(e.target.value)} />
              </div>
            </div>
            <button className="btn btn-gold btn-sm" onClick={adicionarUsuario}>+ Adicionar usuário</button>
          </div>

          <div className="card" style={{marginBottom:16}}>
            <h3 style={{marginTop:0, color:'var(--navy)', fontSize:15}}>Senha de administrador</h3>
            <p style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:0}}>Essa é a senha que protege essa área e a URL do backup na nuvem. Por segurança, ela não fica visível em lugar nenhum — só dá pra trocar (não dá pra "ver" a atual de novo).</p>
            <div className="field-row">
              <div className="field">
                <label>Nova senha de administrador</label>
                <input value={novaAdminPass} onChange={e=>setNovaAdminPass(e.target.value)} />
              </div>
            </div>
            <button className="btn btn-gold btn-sm" onClick={salvarNovaAdminPass}>Salvar nova senha</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- CLIENTES TAB ---------------- */
function AtualizarTodosLinksModal({clients, orders, orcamentos, diagnosticos, appointments, config, onClose, setClients}){
  const [rodando, setRodando] = useState(false);
  const [progresso, setProgresso] = useState(null); // {clienteAtual, totalClientes, nomeCliente, osAtual, osTotal}
  const [concluido, setConcluido] = useState(false);
  const [resultados, setResultados] = useState([]); // [{nome, ok, erro}]
  const [limpeza, setLimpeza] = useState(null); // {estado:'rodando'|'ok'|'erro', msg}
  const [apagarHistorico, setApagarHistorico] = useState(true);

  const jaConfigurado = !!(config && config.githubOwner && config.githubRepo && config.githubToken && config.portalBaseUrl);
  const clientesComHistorico = clients.filter(c => orders.some(o=>o.clientId===c.id));

  if(!jaConfigurado){
    return (
      <Modal title="🔄 Atualizar todos os links de acompanhamento" onClose={onClose}>
        <p style={{fontSize:13, color:'var(--ink-soft)', lineHeight:1.6}}>
          Ainda não tem o GitHub do portal configurado. Gera o link de acompanhamento de <strong>um</strong> cliente primeiro (abre a ficha dele, clica em "Gerar link de acompanhamento", e preenche os campos) — depois que estiver configurado uma vez, essa opção de atualizar todos de uma vez passa a funcionar.
        </p>
        <button className="btn btn-outline" style={{width:'100%'}} onClick={onClose}>Entendi</button>
      </Modal>
    );
  }

  const rodarAtualizacaoTodos = async ()=>{
    setRodando(true);
    setConcluido(false);
    const listaResultados = [];
    for(let i=0; i<clientesComHistorico.length; i++){
      const cliente = clientesComHistorico[i];
      const historyDoCliente = orders.filter(o=>o.clientId===cliente.id);
      const orcamentosDoCliente = (orcamentos||[]).filter(o=>o.clientId===cliente.id);
      const diagnosticosDoCliente = (diagnosticos||[]).filter(d=>d.clientId===cliente.id);
      const appointmentsDoCliente = (appointments||[]).filter(a=>a.clientId===cliente.id);
      setProgresso({clienteAtual: i+1, totalClientes: clientesComHistorico.length, nomeCliente: cliente.nome, osAtual:0, osTotal: historyDoCliente.length});
      try{
        const res = await atualizarLinkAcompanhamentoAoVivo(cliente, historyDoCliente, orcamentosDoCliente, diagnosticosDoCliente, appointmentsDoCliente, config, (osAtual, osTotal)=>{
          setProgresso(prev=>({...prev, osAtual, osTotal}));
        });
        listaResultados.push({id: cliente.id, nome: cliente.nome, telefone: cliente.telefone, email: cliente.email, ok:true, link: res.link, portalId: res.portalId, portalKey: res.portalKey, portalK2: res.portalK2, linkNovo: cliente.portalK2!==res.portalK2});
      }catch(e){
        listaResultados.push({nome: cliente.nome, ok:false, erro: e && e.message ? e.message : 'erro desconhecido'});
      }
    }
    const porId = new Map(listaResultados.filter(r=>r.ok).map(r=>[r.id, r]));
    if(setClients && porId.size>0) setClients(prev=>prev.map(c=>{
      const r = porId.get(c.id);
      return r ? {...c, portalAtivo:true, portalId:r.portalId, portalKey:r.portalKey, portalK2:r.portalK2} : c;
    }));
    setResultados(listaResultados);
    setRodando(false);
    setConcluido(true);
    setProgresso(null);
  };

  // Limpeza do repositório: só os portalIds que existem nas fichas (mais os que acabaram de ser gerados).
  const limparAntigos = async ()=>{
    const ids = new Set(clients.map(c=>c.portalId).filter(Boolean));
    resultados.forEach(r=>{ if(r.ok && r.portalId) ids.add(r.portalId); });
    const semLinkNovo = clientesComHistorico.filter(c=>!ids.has(c.portalId) && !resultados.some(r=>r.ok && r.id===c.id)).length;
    const aviso = (apagarHistorico
      ? 'Isso vai apagar a pasta "dados" (sem criptografia) e RECOMEÇAR o histórico do repositório do portal num commit só, pra que os arquivos antigos não fiquem acessíveis pelos commits passados.'
      : 'Isso vai apagar a pasta "dados" (sem criptografia) do repositório do portal.')
      + '\n\nOs links ANTIGOS dos clientes param de funcionar (os novos continuam).'
      + (semLinkNovo>0 ? `\n\n⚠️ ${semLinkNovo} cliente(s) com OS ainda não têm link novo.` : '')
      + '\n\nContinuar?';
    if(!confirm(aviso)) return;
    setLimpeza({estado:'rodando', msg:'⏳ Limpando o repositório...'});
    try{
      const r = await limparPortalAntigoGithub(config.githubOwner.trim(), config.githubRepo.trim(), config.githubToken.trim(), [...ids], apagarHistorico);
      try{ await portalApagarAcessosOrfaos(ids); }catch(e){ console.warn('Não limpou acessos órfãos no Supabase:', e); }
      setLimpeza({estado:'ok', msg:`✔ Pronto! ${r.removidos} arquivo(s) antigo(s) removido(s)${r.historico ? ' e histórico recomeçado' : ''}. O GitHub pode levar uns minutos pra parar de mostrar o que estava em cache.`});
    }catch(e){
      setLimpeza({estado:'erro', msg:'✕ ' + (e && e.message ? e.message : 'Erro ao limpar.')});
    }
  };

  const totalOk = resultados.filter(r=>r.ok).length;
  const totalFalhou = resultados.filter(r=>!r.ok).length;
  const linksNovos = resultados.filter(r=>r.ok && r.linkNovo);
  const msgLink = (r)=>`Olá, ${(r.nome||'').split(' ')[0]}! 🦦\n\nAtualizamos o seu portal de acompanhamento da LontraHelp — agora ele é protegido. Seu novo link (guarde ele, o antigo não funciona mais):\n\n${r.link}\n\n${r.email ? `Ao entrar, você vai receber um código de 4 números no seu e-mail (${r.email}).` : 'Ao entrar, confirme com os 4 últimos números do seu telefone.'}`;

  return (
    <Modal title="🔄 Atualizar todos os links de acompanhamento" onClose={onClose}>
      {!rodando && !concluido && (
        <React.Fragment>
          <p style={{fontSize:13, color:'var(--ink-soft)', lineHeight:1.6}}>
            Isso regenera o link e os documentos (recibos, orçamentos, diagnósticos) de <strong>todos os {clientesComHistorico.length} cliente(s)</strong> que já têm alguma ordem de serviço — útil depois de trocar o tema do portal, ou pra garantir que todo mundo está com os PDFs mais recentes.
          </p>
          {clientesComHistorico.some(c=>!c.portalK2) && (
            <p style={{fontSize:12.5, color:'var(--navy)', background:'#FFF6DC', padding:10, borderRadius:8, lineHeight:1.5}}>
              🔒 <strong>{clientesComHistorico.filter(c=>!c.portalK2).length} cliente(s) ainda não têm o link novo</strong> (com código de acesso). Eles vão ganhar um link novo e protegido — no final aparece a lista pra você mandar pelo WhatsApp.
            </p>
          )}
          <p style={{fontSize:12, color:'var(--ink-soft)', background:'var(--blue-bg)', padding:10, borderRadius:8}}>
            ⏳ Pode demorar um tempo (depende de quantos clientes e ordens de serviço você tem) — não fecha essa tela enquanto estiver rodando.
          </p>
          <button className="btn btn-gold" style={{width:'100%'}} disabled={clientesComHistorico.length===0} onClick={rodarAtualizacaoTodos}>
            {clientesComHistorico.length===0 ? 'Nenhum cliente com OS ainda' : `▶ Atualizar os ${clientesComHistorico.length} clientes`}
          </button>
        </React.Fragment>
      )}
      {rodando && progresso && (
        <div style={{textAlign:'center', padding:'20px 0'}}>
          <div style={{fontSize:13, color:'var(--navy)', fontWeight:700, marginBottom:8}}>
            Cliente {progresso.clienteAtual} de {progresso.totalClientes} — {progresso.nomeCliente}
          </div>
          {progresso.osTotal>0 && (
            <div style={{fontSize:12, color:'var(--ink-soft)'}}>OS {progresso.osAtual} de {progresso.osTotal}</div>
          )}
          <div style={{background:'#EDEFF2', height:8, borderRadius:4, marginTop:14, overflow:'hidden'}}>
            <div style={{background:'var(--gold)', height:'100%', width:`${(progresso.clienteAtual/progresso.totalClientes)*100}%`, transition:'width 0.3s'}}></div>
          </div>
        </div>
      )}
      {concluido && (
        <div>
          <div style={{fontSize:14, fontWeight:700, color:'var(--green-ok)', marginBottom:10}}>
            ✔ Concluído! {totalOk} atualizado(s) com sucesso{totalFalhou>0 ? `, ⚠️ ${totalFalhou} com problema` : ''}.
          </div>
          {totalFalhou>0 && (
            <div style={{fontSize:12.5, color:'var(--red-no)', background:'#FDEEEC', padding:10, borderRadius:8, marginBottom:10}}>
              {resultados.filter(r=>!r.ok).map((r,i)=>(
                <div key={i}>• {r.nome}: {r.erro}</div>
              ))}
            </div>
          )}
          {linksNovos.length>0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12, fontWeight:800, color:'var(--ink-soft)', textTransform:'uppercase', margin:'4px 0 8px'}}>📨 Mandar o link novo ({linksNovos.length})</div>
              <div style={{fontSize:12, color:'var(--ink-soft)', marginBottom:8, lineHeight:1.5}}>Esses clientes ganharam um link novo. O antigo deixa de funcionar — manda o novo pra cada um:</div>
              <div style={{display:'flex', flexDirection:'column', gap:6, maxHeight:280, overflowY:'auto'}}>
                {linksNovos.map(r=>(
                  <div key={r.id} style={{display:'flex', alignItems:'center', gap:8, padding:'8px 10px', border:'1px solid var(--border)', borderRadius:10, background:'#fff'}}>
                    <div style={{flex:1, minWidth:0, fontSize:13, fontWeight:600, color:'var(--navy)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{r.nome}</div>
                    <button type="button" className="btn btn-outline btn-sm" onClick={()=>{ try{ navigator.clipboard.writeText(msgLink(r)); }catch(e){} }} title="Copiar mensagem com o link">📋</button>
                    {r.telefone && <button type="button" className="btn btn-sm" style={{background:'#25D366', color:'#fff'}} onClick={()=>window.open(linkWhatsApp(r.telefone, msgLink(r)), '_blank')}>💬 Enviar</button>}
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{marginBottom:14, padding:12, borderRadius:10, background:'var(--blue-bg)'}}>
            <div style={{fontSize:12.5, fontWeight:800, color:'var(--navy)', marginBottom:4}}>🧹 Apagar os dados antigos sem criptografia</div>
            <div style={{fontSize:12, color:'var(--ink-soft)', lineHeight:1.5, marginBottom:8}}>
              A pasta <code>dados/</code> do sistema antigo continua pública no GitHub até ser apagada. Faz isso <strong>depois</strong> de todos os clientes terem link novo.
            </div>
            <label style={{display:'flex', gap:8, alignItems:'flex-start', fontSize:12, color:'var(--ink)', marginBottom:10, cursor:'pointer'}}>
              <input type="checkbox" checked={apagarHistorico} onChange={e=>setApagarHistorico(e.target.checked)} style={{marginTop:2}} />
              <span>Recomeçar o histórico do repositório (recomendado — senão os arquivos antigos continuam nos commits passados)</span>
            </label>
            <button type="button" className="btn btn-outline" style={{width:'100%'}} disabled={limpeza && limpeza.estado==='rodando'} onClick={limparAntigos}>
              {limpeza && limpeza.estado==='rodando' ? '⏳ Limpando...' : '🧹 Apagar dados antigos'}
            </button>
            {limpeza && limpeza.estado!=='rodando' && (
              <div style={{marginTop:8, fontSize:12, lineHeight:1.5, color: limpeza.estado==='ok' ? 'var(--green-ok)' : 'var(--red-no)'}}>{limpeza.msg}</div>
            )}
          </div>
          <button className="btn btn-outline" style={{width:'100%'}} onClick={onClose}>Fechar</button>
        </div>
      )}
    </Modal>
  );
}

function ClientesTab({clients, orders, appointments, orcamentos, diagnosticos, setClients, autoOpenNew, goTo, config, setConfig, onSalvarTemaManual, syncStatusTema}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState('');
  const [noteText, setNoteText] = useState('');
  const [showCalendarioVisitas, setShowCalendarioVisitas] = useState(false);
  const [showCalendarioPDF, setShowCalendarioPDF] = useState(false);
  const [showLinkAcompanhamento, setShowLinkAcompanhamento] = useState(false);
  const [showAtualizarTodos, setShowAtualizarTodos] = useState(false);

  useEffect(()=>{ if(autoOpenNew){ setShowForm(true); setEditing(null); } }, [autoOpenNew]);

  const filtered = clients.filter(c => c.nome.toLowerCase().includes(search.toLowerCase()) || (c.telefone||'').includes(search));
  const selected = clients.find(c=>c.id===selectedId);
  useDocumentTitle((selected && showCalendarioPDF) ? `Calendario de Visitas - ${selected.nome}` : null);

  const saveClient = (data)=>{
    if(editing){
      setClients(prev=>prev.map(c=>c.id===editing.id ? {...c, ...data} : c));
      // Mudou e-mail/telefone/nome de quem já tem portal → atualiza pra onde vai o código de acesso.
      const atualizado = {...editing, ...data};
      if(atualizado.portalId && atualizado.portalK2 && (atualizado.email!==editing.email || atualizado.telefone!==editing.telefone || atualizado.nome!==editing.nome)){
        portalRegistrarAcesso(atualizado, atualizado.portalId, atualizado.portalK2).catch(e=>console.warn('Portal: não atualizou o contato de acesso agora:', e));
      }
    } else {
      const novo = {...data, id:uid(), createdAt:new Date().toISOString(), interacoes:[]};
      setClients(prev=>[novo, ...prev]);
      setSelectedId(novo.id);
    }
    setShowForm(false); setEditing(null);
  };
  const deleteClient = (id)=>{
    if(confirm('Remover este cliente? Esta ação não pode ser desfeita.')){
      setClients(prev=>prev.filter(c=>c.id!==id));
      if(selectedId===id) setSelectedId(null);
    }
  };
  const addNote = ()=>{
    if(!noteText.trim()) return;
    setClients(prev=>prev.map(c=>c.id===selectedId ? {...c, interacoes:[{id:uid(), data:new Date().toISOString(), texto:noteText}, ...(c.interacoes||[])]} : c));
    setNoteText('');
  };

  if(selected){
    const history = orders.filter(o=>o.clientId===selected.id).sort((a,b)=>b.dataISO.localeCompare(a.dataISO));
    const apps = appointments.filter(a=>a.clientId===selected.id).sort((a,b)=>b.data.localeCompare(a.data));

    if(showCalendarioPDF){
      const agendados = apps.filter(a=>a.status==='agendado');
      return (
        <div>
          <div className="receipt-toolbar no-print">
            <button className="btn btn-outline btn-sm" onClick={()=>setShowCalendarioPDF(false)}>← Voltar pro perfil</button>
            <button className="btn btn-gold" onClick={imprimirDocumento}>📄 Salvar / Compartilhar PDF</button>
          </div>
          <CalendarioVisitasView client={selected} appts={agendados} />
        </div>
      );
    }

    return (
      <div>
        <button className="btn btn-outline btn-sm" style={{marginBottom:14}} onClick={()=>setSelectedId(null)}>← Voltar para clientes</button>
        <div className="card">
          <div className="profile-header">
            <div>
              <div className="profile-name">{selected.nome}</div>
              <div className="page-sub">Cliente desde {new Date(selected.createdAt).toLocaleDateString('pt-BR')}</div>
            </div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(selected); setShowForm(true);}}>Editar</button>
              <button className="btn btn-gold btn-sm" onClick={()=>goTo('ordens','new',selected.id)}>+ Nova OS</button>
              <button className="btn btn-danger btn-sm" onClick={()=>deleteClient(selected.id)}>Remover</button>
            </div>
          </div>
          <div className="info-grid">
            <div className="info-item"><div className="k">Telefone</div><div className="v">{selected.telefone || '—'}</div></div>
            <div className="info-item"><div className="k">CPF/CNPJ</div><div className="v">{selected.cpfCnpj || '—'}</div></div>
            <div className="info-item"><div className="k">E-mail</div><div className="v">{selected.email || '—'}</div></div>
            <div className="info-item"><div className="k">Endereço</div><div className="v">{[selected.rua, selected.numero, selected.bairro].filter(Boolean).join(', ') || '—'}</div></div>
            <div className="info-item"><div className="k">Cidade/UF</div><div className="v">{[selected.cidade, selected.uf].filter(Boolean).join(' — ') || '—'}</div></div>
            <div className="info-item"><div className="k">CEP</div><div className="v">{selected.cep || '—'}</div></div>
          </div>
          {selected.observacoes && <div style={{marginTop:12, fontSize:13, color:'var(--ink-soft)'}}><strong>Observações:</strong> {selected.observacoes}</div>}
        </div>

        <div className="section-bar" style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:6}}>
          <span>Histórico de serviços ({history.length})</span>
          {history.length>0 && (
            <button className="btn btn-gold btn-sm" style={{padding:'3px 10px', fontSize:11}} onClick={()=>setShowLinkAcompanhamento(true)}>🔗 Gerar link de acompanhamento</button>
          )}
        </div>
        {showLinkAcompanhamento && (
          <LinkAcompanhamentoModal client={selected} history={history} orcamentos={orcamentos} diagnosticos={diagnosticos} appointments={appointments} config={config} onClose={()=>setShowLinkAcompanhamento(false)} onSalvarConfig={setConfig} onSalvarTemaManual={onSalvarTemaManual} syncStatusTema={syncStatusTema} onLinkGerado={(chaves)=>setClients(prev=>prev.map(c=>c.id===selected.id ? {...c, ...chaves, portalAtivo:true} : c))} />
        )}
        {history.length===0 && <div className="empty-state"><div className="ic">🧾</div>Nenhuma OS registrada para este cliente ainda.</div>}
        {history.map(o=>(
          <div className="list-item" key={o.id} onClick={()=>goTo('recibos', null, null, o.id)}>
            <div className="li-main">
              <strong>OS #{o.osNumber}</strong>
              <div className="meta">{formatDateBR(o.dataISO)} · {o.equipamento || 'Serviço'} · R$ {formatMoney(o.valor)}</div>
            </div>
            <span className="pill pill-blue">Ver recibo</span>
          </div>
        ))}

        <div className="section-bar">Atendimento ao cliente</div>
        <div className="card" style={{marginBottom:14}}>
          <div className="field-row" style={{marginBottom:8}}>
            <div className="field" style={{flex:3}}>
              <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Registrar contato, dúvida ou observação de atendimento..." style={{minHeight:44}} />
            </div>
            <div style={{alignSelf:'flex-end'}}>
              <button className="btn btn-navy btn-sm" onClick={addNote}>Registrar</button>
            </div>
          </div>
          {(selected.interacoes||[]).length===0 && <div style={{fontSize:12.5, color:'var(--ink-soft)'}}>Nenhum registro de atendimento ainda.</div>}
          {(selected.interacoes||[]).map(n=>(
            <div key={n.id} style={{borderTop:'1px solid var(--border)', paddingTop:8, marginTop:8, fontSize:13}}>
              <div style={{fontSize:11, color:'var(--ink-soft)', fontWeight:700}}>{new Date(n.data).toLocaleString('pt-BR')}</div>
              {n.texto}
            </div>
          ))}
        </div>

        <div className="section-bar" style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:6}}>
          <span>Agendamentos ({apps.length})</span>
          {apps.filter(a=>a.status==='agendado').length>0 && (
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-navy btn-sm" style={{padding:'3px 10px', fontSize:11}} onClick={()=>setShowCalendarioVisitas(true)}>📋 Texto p/ copiar</button>
              <button className="btn btn-gold btn-sm" style={{padding:'3px 10px', fontSize:11}} onClick={()=>setShowCalendarioPDF(true)}>🖨 Calendário em PDF</button>
            </div>
          )}
        </div>
        {apps.length===0 && <div className="empty-state"><div className="ic">📅</div>Nenhum agendamento registrado.</div>}
        {apps.map(a=>(
          <div className="appt-item" key={a.id}>
            <div className="t">{formatDateBR(a.data)} às {a.hora} — <span className="pill pill-blue">{a.status}</span></div>
            <div className="n">{a.titulo}</div>
          </div>
        ))}

        {showCalendarioVisitas && (
          <CopyTextModal
            title={`Calendário de visitas — ${selected.nome}`}
            text={buildCalendarioVisitasText(selected, apps.filter(a=>a.status==='agendado'))}
            onClose={()=>setShowCalendarioVisitas(false)}
          />
        )}

        {showForm && (
          <Modal title="Editar cliente" onClose={()=>{setShowForm(false); setEditing(null);}}>
            <ClientForm initial={editing} onSave={saveClient} onCancel={()=>{setShowForm(false); setEditing(null);}} clients={clients} />
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Clientes</h1>
          <div className="page-sub">{clients.length} cliente(s) cadastrado(s)</div>
        </div>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          <button className="btn btn-outline" onClick={()=>setShowAtualizarTodos(true)}>🔄 Atualizar todos os links</button>
          <button className="btn btn-gold" onClick={()=>{setShowForm(true); setEditing(null);}}>+ Novo cliente</button>
        </div>
      </div>
      {showAtualizarTodos && (
        <AtualizarTodosLinksModal clients={clients} orders={orders} orcamentos={orcamentos} diagnosticos={diagnosticos} appointments={appointments} config={config} onClose={()=>setShowAtualizarTodos(false)} setClients={setClients} />
      )}
      <div className="search-bar">
        <input placeholder="Buscar por nome ou telefone..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {filtered.length===0 && <div className="empty-state"><div className="ic">👥</div>Nenhum cliente encontrado.</div>}
      {filtered.map(c=>(
        <div className="list-item" key={c.id} onClick={()=>setSelectedId(c.id)}>
          <div className="li-main">
            <strong>{c.nome}</strong>
            <div className="meta">{c.telefone || 'Sem telefone'} {c.cidade ? `· ${c.cidade}` : ''}</div>
          </div>
          <span className="pill pill-blue">{orders.filter(o=>o.clientId===c.id).length} OS</span>
        </div>
      ))}
      {showForm && (
        <Modal title="Novo cliente" onClose={()=>setShowForm(false)}>
          <ClientForm onSave={saveClient} onCancel={()=>setShowForm(false)} clients={clients} />
        </Modal>
      )}
    </div>
  );
}

/* ---------------- AGENDAMENTO TAB ---------------- */
function AgendamentoTab({appointments, setAppointments, clients, setClients, products, orders, setOrders, config, setConfig, goTo, focusDate, autoOpenNew}){
  const [cursor, setCursor] = useState(()=> focusDate ? new Date(focusDate+'T00:00:00') : new Date());
  const [selectedDate, setSelectedDate] = useState(focusDate || todayISO());
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [comprovanteAppt, setComprovanteAppt] = useState(null);
  const [detalheAppt, setDetalheAppt] = useState(null);
  const [finalizingAppt, setFinalizingAppt] = useState(null);
  const [showClientQuick, setShowClientQuick] = useState(false);

  const horarioInicio = config.horarioInicio || '08:00';
  const horarioFim = config.horarioFim || '18:00';

  useEffect(()=>{
    if(focusDate){
      setSelectedDate(focusDate);
      setCursor(new Date(focusDate+'T00:00:00'));
    }
  }, [focusDate]);

  useEffect(()=>{ if(autoOpenNew){ setEditing(null); setShowForm(true); } }, [autoOpenNew]);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=startWeekday-1;i>=0;i--) cells.push({d: daysInPrevMonth-i, muted:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, muted:false});
  while(cells.length % 7 !== 0) cells.push({d: cells.length, muted:true, isNext:true});

  const isoFor = (d)=> `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const enviarWhats = (a, tipo)=>{
    const c = clients.find(x=>x.id===a.clientId);
    if(!c || !(c.telefone||'').replace(/\D/g,'')){ alert('Esse cliente não tem telefone cadastrado.'); return; }
    const modelo = tipo==='lembrete' ? (config.msgWhatsLembrete || MSG_LEMBRETE_PADRAO) : (config.msgWhatsConfirmacao || MSG_CONFIRMACAO_PADRAO);
    window.open(linkWhatsApp(c.telefone, montarMensagemAgendamento(modelo, a, c)), '_blank');
  };
  const dataAmanha = amanhaISO();
  const lembretesAmanha = appointments
    .filter(a=>a.data===dataAmanha && a.status!=='cancelado' && a.status!=='concluido')
    .sort((x,y)=>(x.hora||'').localeCompare(y.hora||''));
  const apptsForDate = (iso) => appointments.filter(a=>a.data===iso);
  const countFor = (d) => apptsForDate(isoFor(d)).length;
  const isFullFor = (d) => computeDayAvailability(apptsForDate(isoFor(d)), horarioInicio, horarioFim).isFull;

  const dayAppts = appointments.filter(a=>a.data===selectedDate).sort((a,b)=>a.hora.localeCompare(b.hora));
  const dayAvail = computeDayAvailability(dayAppts, horarioInicio, horarioFim);
  const freeH = Math.floor(dayAvail.free/60), freeM = dayAvail.free%60;

  const saveAppt = (data)=>{
    if(editing){
      const atualizado = {...editing, ...data};
      setAppointments(prev=>prev.map(a=>a.id===editing.id ? atualizado : a));
      setShowForm(false); setEditing(null);
      const cliente = clients.find(c=>c.id===atualizado.clientId);
      agendarNotificacoesAppt(atualizado, cliente ? cliente.nome : null);
    } else {
      const novo = {...data, id:uid(), createdAt:new Date().toISOString()};
      setAppointments(prev=>[...prev, novo]);
      setShowForm(false); setEditing(null);
      setComprovanteAppt(novo);
      const cliente = clients.find(c=>c.id===novo.clientId);
      agendarNotificacoesAppt(novo, cliente ? cliente.nome : null);
    }
  };
  const deleteAppt = (id)=>{
    if(confirm('Remover este agendamento?')){
      setAppointments(prev=>prev.filter(a=>a.id!==id));
      cancelarNotificacoesAppt(id);
    }
  };
  const setStatus = (id, status)=>{
    setAppointments(prev=>{
      const proximo = prev.map(a=>a.id===id?{...a,status}:a);
      const atualizado = proximo.find(a=>a.id===id);
      if(atualizado){
        const cliente = clients.find(c=>c.id===atualizado.clientId);
        agendarNotificacoesAppt(atualizado, cliente ? cliente.nome : null); // reagenda (ou cancela, se saiu de "agendado")
      }
      return proximo;
    });
  };

  const finalizarComOS = (data)=>{
    const novoId = uid();
    setConfig(prevConfig=>{
      const counter = (prevConfig.osCounter||1000000)+1;
      const novaOrdem = {...data, id:novoId, osNumber: generateOsNumber(counter), status:'em_andamento', statusHistorico:[], createdAt:new Date().toISOString()};
      setOrders(prevOrders=>[novaOrdem, ...prevOrders]);
      setAppointments(prev=>prev.map(a=>a.id===finalizingAppt.id ? {...a, status:'concluido'} : a));
      cancelarNotificacoesAppt(finalizingAppt.id);
      goTo('recibos', null, null, novoId);
      return {...prevConfig, osCounter:counter};
    });
    setFinalizingAppt(null);
  };
  const quickAddClient = (data)=>{
    const novo = {...data, id:uid(), createdAt:new Date().toISOString(), interacoes:[]};
    setClients(prev=>[novo, ...prev]);
    setShowClientQuick(false);
  };

  const sugestaoHora = (()=>{
    const slot = nextAvailableSlot(dayAppts, horarioInicio, horarioFim, 120);
    return slot!==null ? minutesToTime(slot) : null;
  })();

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Agendamento</h1>
          <div className="page-sub">Calendário de visitas e compromissos</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Novo agendamento</button>
      </div>

      <div className="hours-config-row">
        <span>Horário de trabalho:</span>
        <input type="time" value={horarioInicio} onChange={e=>setConfig(prev=>({...prev, horarioInicio:e.target.value}))} />
        <span>até</span>
        <input type="time" value={horarioFim} onChange={e=>setConfig(prev=>({...prev, horarioFim:e.target.value}))} />
        <span>— usado pra calcular os dias e horários disponíveis</span>
      </div>

      {lembretesAmanha.length>0 && (
        <div className="card" style={{marginBottom:16, background:'#E9F8F1', border:'1.5px solid #25D366'}}>
          <h3 style={{marginTop:0, color:'var(--navy)', fontSize:15}}>💬 Lembretes de amanhã ({formatDateBR(dataAmanha)})</h3>
          <p style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:0}}>Toque em cada um pra abrir o WhatsApp com o lembrete pronto — é só enviar.</p>
          {lembretesAmanha.map(a=>{
            const c = clients.find(x=>x.id===a.clientId);
            return (
              <div key={a.id} style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, flexWrap:'wrap', padding:'8px 0', borderTop:'1px dashed #BFE8D3'}}>
                <div style={{fontSize:13.5}}><strong>{a.hora}</strong> · {c ? c.nome : 'Sem cliente'} <span style={{color:'var(--ink-soft)'}}>— {a.titulo}</span></div>
                <button className="btn btn-sm" style={{background:'#25D366', color:'#fff', border:'none'}} onClick={()=>enviarWhats(a,'lembrete')}>💬 Lembrar</button>
              </div>
            );
          })}
        </div>
      )}

      <div className="calendar-wrap">
        <div className="card">
          <div className="cal-nav">
            <button className="btn btn-outline btn-sm" onClick={()=>setCursor(new Date(year, month-1, 1))}>‹</button>
            <div className="month-label">{MONTHS_PT[month]} {year}</div>
            <button className="btn btn-outline btn-sm" onClick={()=>setCursor(new Date(year, month+1, 1))}>›</button>
          </div>
          <div className="cal-grid">
            {DOW_PT.map(d=><div className="cal-dow" key={d}>{d}</div>)}
            {cells.map((c,i)=>{
              const iso = c.muted ? null : isoFor(c.d);
              const isToday = iso === todayISO();
              const isSel = iso === selectedDate;
              const cnt = c.muted ? 0 : countFor(c.d);
              const full = c.muted ? false : isFullFor(c.d);
              return (
                <div key={i}
                  className={`cal-day ${c.muted?'muted':''} ${isToday?'today':''} ${isSel?'selected':''} ${full?'full':''}`}
                  onClick={()=>{ if(!c.muted) setSelectedDate(iso); }}>
                  {c.d}
                  {cnt>0 && <span className="cal-dot"></span>}
                </div>
              );
            })}
          </div>
          <div className="cal-legend">
            <span><span className="lg-dot" style={{background:'var(--blue-mid)'}}></span>Tem agendamento</span>
            <span><span className="lg-dot" style={{background:'var(--red-no)'}}></span>Sem horário disponível</span>
          </div>
        </div>

        <div className="card">
          <h3 style={{marginTop:0, fontSize:14.5, color:'var(--navy)'}}>{formatDateBR(selectedDate)}</h3>

          <div className={`avail-bar ${dayAvail.isFull?'full':''}`}>
            {dayAvail.isFull
              ? '🔴 Sem horário disponível nesse dia.'
              : `🟢 Restam ${freeH}h${freeM>0?freeM+'min':''} livres nesse dia (${horarioInicio}–${horarioFim}).`}
          </div>

          {dayAvail.merged.length>0 && (
            <div style={{marginBottom:14}}>
              {dayAvail.merged.map((r,i)=>(
                <div className="occupied-row" key={i}><span>Ocupado</span><span>{minutesToTime(r[0])} – {minutesToTime(r[1])}</span></div>
              ))}
            </div>
          )}

          {dayAppts.length===0 && <div className="empty-state" style={{padding:'24px 10px'}}><div className="ic">📅</div>Nenhum compromisso.</div>}
          {dayAppts.map(a=>{
            const c = clients.find(c=>c.id===a.clientId);
            return (
              <div className="appt-item" key={a.id} style={{cursor:'pointer'}} onClick={(e)=>{ if(e.target.closest('button')) return; setDetalheAppt(a); }}>
                <div className="t">{a.hora} ({a.duracaoHoras||2}h) · <span className={`pill ${a.status==='concluido'?'pill-green':a.status==='cancelado'?'pill-red':'pill-blue'}`}>{a.status}</span></div>
                <div className="n">{a.titulo}</div>
                {c && <div className="d">Cliente: {c.nome}</div>}
                {a.local && <div className="d">📍 {a.local}</div>}
                {a.notas && <div className="d">{a.notas}</div>}
                <div className="d" style={{color:'var(--blue-mid)', fontWeight:600, fontSize:12}}>👆 Toque pra ver os dados do cliente</div>
                <div className="appt-actions">
                  <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(a); setShowForm(true);}}>Editar</button>
                  <button className="btn btn-sm" style={{background:'#25D366', color:'#fff', border:'none'}} onClick={()=>enviarWhats(a,'confirmacao')}>💬 WhatsApp</button>
                  <button className="btn btn-navy btn-sm" onClick={()=>setComprovanteAppt(a)}>📋 Comprovante</button>
                  {a.status!=='concluido' && <button className="btn btn-gold btn-sm" onClick={()=>setFinalizingAppt(a)}>✔ Concluir e gerar OS</button>}
                  {a.status!=='cancelado' && <button className="btn btn-outline btn-sm" onClick={()=>setStatus(a.id,'cancelado')}>Cancelar</button>}
                  <button className="btn btn-danger btn-sm" onClick={()=>deleteAppt(a.id)}>Excluir</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {showForm && (
        <Modal title={editing?'Editar agendamento':'Novo agendamento'} onClose={()=>{setShowForm(false); setEditing(null);}}>
          {!editing && dayAvail.isFull && (
            <div style={{fontSize:12.5, color:'var(--red-no)', background:'#FDEEEC', padding:'8px 12px', borderRadius:8, marginBottom:12, fontWeight:600}}>
              ⚠️ Esse dia já está sem horário disponível dentro do expediente ({horarioInicio}–{horarioFim}). Você ainda pode agendar fora do horário se precisar.
            </div>
          )}
          <AppointmentForm initial={editing} clients={clients} defaultDate={selectedDate} defaultHora={sugestaoHora || undefined} onSave={saveAppt} onCancel={()=>{setShowForm(false); setEditing(null);}} />
        </Modal>
      )}
      {detalheAppt && (()=>{
        const a = appointments.find(x=>x.id===detalheAppt.id) || detalheAppt;
        const c = clients.find(x=>x.id===a.clientId);
        const tel = c ? String(c.telefone||'').replace(/\D/g,'') : '';
        const endereco = c ? [[c.rua, c.numero].filter(Boolean).join(', '), c.bairro, [c.cidade, c.uf].filter(Boolean).join('/'), c.cep].filter(Boolean).join(' · ') : '';
        const outros = c ? appointments.filter(x=>x.clientId===c.id && x.id!==a.id && x.status!=='cancelado').length : 0;
        const linha = (rot, val)=> val ? <div style={{display:'flex', gap:8, padding:'6px 0', borderBottom:'1px dashed var(--border)', fontSize:13.5}}><span style={{minWidth:104, color:'var(--ink-soft)'}}>{rot}</span><span style={{flex:1, wordBreak:'break-word'}}>{val}</span></div> : null;
        return (
          <Modal title={a.titulo || 'Agendamento'} onClose={()=>setDetalheAppt(null)}>
            <div style={{fontSize:12, fontWeight:800, color:'var(--navy)', letterSpacing:0.3, marginBottom:4}}>👤 CLIENTE</div>
            {!c && <div style={{fontSize:13, color:'var(--ink-soft)', marginBottom:10}}>Esse agendamento não tem cliente vinculado.</div>}
            {c && (
              <div style={{marginBottom:14}}>
                {linha('Nome', <strong>{c.nome}</strong>)}
                {linha('Telefone', c.telefone)}
                {linha('CPF/CNPJ', c.cpfCnpj)}
                {linha('E-mail', c.email)}
                {linha('Endereço', endereco)}
                {linha('Observações', c.observacoes)}
                {outros>0 && linha('Outros', `${outros} outro(s) agendamento(s) ativo(s)`)}
              </div>
            )}
            <div style={{fontSize:12, fontWeight:800, color:'var(--navy)', letterSpacing:0.3, marginBottom:4}}>📅 AGENDAMENTO</div>
            <div style={{marginBottom:14}}>
              {linha('Data', `${formatDateBR(a.data)} às ${a.hora||''} (${a.duracaoHoras||2}h)`)}
              {linha('Situação', a.status)}
              {linha('Local', a.local)}
              {linha('Anotações', a.notas)}
            </div>
            <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
              {c && tel && <button className="btn btn-sm" style={{background:'#25D366', color:'#fff', border:'none'}} onClick={()=>enviarWhats(a,'confirmacao')}>💬 WhatsApp</button>}
              {c && tel && <a className="btn btn-outline btn-sm" href={`tel:+${tel.length<=11 ? '55'+tel : tel}`} style={{textDecoration:'none'}}>📞 Ligar</a>}
              <button className="btn btn-outline btn-sm" onClick={()=>{ setEditing(a); setShowForm(true); setDetalheAppt(null); }}>✏️ Editar</button>
              <button className="btn btn-outline btn-sm" onClick={()=>setDetalheAppt(null)}>Fechar</button>
            </div>
          </Modal>
        );
      })()}
      {comprovanteAppt && (
        <ComprovanteModal appt={comprovanteAppt} client={clients.find(c=>c.id===comprovanteAppt.clientId)} onClose={()=>setComprovanteAppt(null)} />
      )}
      {finalizingAppt && (
        <Modal title={`Finalizar: ${finalizingAppt.titulo}`} onClose={()=>setFinalizingAppt(null)} wide>
          <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:14, background:'var(--blue-bg)', padding:'10px 12px', borderRadius:8}}>
            Preencha os detalhes do serviço realizado nesta visita. Ao salvar, uma Ordem de Serviço é gerada automaticamente e o agendamento é marcado como concluído — o recibo abre em seguida, pronto pra imprimir ou enviar ao cliente.
          </div>
          <OrderForm
            initial={{
              dataISO: finalizingAppt.data, tecnico:'Gabriel', clientId: finalizingAppt.clientId || '',
              equipamento:'', numeroSerie:'', observacoes: finalizingAppt.titulo || '',
              valor:'', formaPagamento:'', garantiaFisicaDias:90, garantiaSoftwareDias:7
            }}
            clients={clients}
            products={products}
            onSave={finalizarComOS}
            onCancel={()=>setFinalizingAppt(null)}
            onQuickAddClient={()=>setShowClientQuick(true)}
          />
        </Modal>
      )}
      {showClientQuick && (
        <Modal title="Novo cliente" onClose={()=>setShowClientQuick(false)}>
          <ClientForm onSave={quickAddClient} onCancel={()=>setShowClientQuick(false)} clients={clients} />
        </Modal>
      )}
    </div>
  );
}

/* ---------------- OS STATUS MODAL ---------------- */
function OSStatusModal({order, onSave, onCancel}){
  const statusAtual = order.status==='pendente_pagamento' ? 'concluido' : (order.status || 'em_andamento');
  const [status, setStatus] = useState(statusAtual);
  const [nota, setNota] = useState('');
  const [formaPagamento, setFormaPagamento] = useState(order.formaPagamento || 'PIX');
  const [pago, setPago] = useState(order.pagamentoRecebido || false);
  const [valorProposto, setValorProposto] = useState(order.valor || '');

  const isConcluindo = status === 'concluido';
  const isAguardando = status === 'aguardando_aprovacao';
  const statusInalterado = status === statusAtual;
  const nadaMudou = statusInalterado && !nota.trim() && !isConcluindo;

  const handleSave = ()=>{
    if(isConcluindo){
      onSave(pago ? 'concluido' : 'pendente_pagamento', nota, {formaPagamento, pagamentoRecebido: pago});
    } else if(isAguardando){
      onSave(status, nota, {valorProposto: valorProposto || null});
    } else {
      onSave(status, nota, {});
    }
  };

  return (
    <Modal title={`Atualizar status — OS #${order.osNumber}`} onClose={onCancel} footer={
      <React.Fragment>
        <button className="btn btn-outline" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-gold" onClick={handleSave} disabled={(isAguardando && !nota.trim()) || nadaMudou}>Salvar e gerar mensagem</button>
      </React.Fragment>
    }>
      {nadaMudou && (
        <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'8px 12px', borderRadius:8, marginBottom:12}}>
          O status já está em "{STATUS_OS_LABELS[statusAtual]}". Escolha outro status ou escreva uma nota pra poder salvar — assim não fica registro duplicado no histórico.
        </div>
      )}
      <div className="field-row">
        <div className="field">
          <label>Novo status</label>
          <select value={status} onChange={e=>setStatus(e.target.value)}>
            {STATUS_OS_SELECIONAVEL.map(k=><option key={k} value={k}>{STATUS_OS_LABELS[k]}</option>)}
          </select>
        </div>
      </div>

      {!isConcluindo && !isAguardando && (
        <div style={{fontSize:12.5, color:'var(--ink-soft)', background:'var(--blue-bg)', padding:'8px 12px', borderRadius:8, marginBottom:12}}>
          A forma de pagamento só é perguntada quando a OS for marcada como Concluída — assim dá pra sinalizar se ainda pode mudar algo (peça extra, imprevisto) antes de fechar.
        </div>
      )}

      {isAguardando && (
        <React.Fragment>
          <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'8px 12px', borderRadius:8, marginBottom:12}}>
            Use isso quando surgir algo que precisa da autorização do cliente antes de continuar (peça extra, mudança de valor, problema novo). A OS fica pausada nesse status até você marcar a resposta do cliente.
          </div>
          <div className="field-row">
            <div className="field">
              <label>Novo valor estimado (opcional, se mudou)</label>
              <input type="number" step="0.01" value={valorProposto} onChange={e=>setValorProposto(e.target.value)} placeholder="Deixe em branco se o valor não mudou" />
            </div>
          </div>
        </React.Fragment>
      )}

      {isConcluindo && (
        <React.Fragment>
          <div className="section-bar">Pagamento</div>
          <div className="pay-check-row" style={{marginBottom:10}}>
            {['Dinheiro','PIX','Cartão','Outro'].map(m=>(
              <label className="pay-check" key={m}>
                <input type="radio" name="statusForma" checked={formaPagamento===m} onChange={()=>setFormaPagamento(m)} />
                {m}
              </label>
            ))}
          </div>
          <label className="pay-check" style={{marginBottom:12}}>
            <input type="checkbox" checked={pago} onChange={e=>setPago(e.target.checked)} />
            O cliente já realizou o pagamento
          </label>
          {!pago && (
            <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'8px 12px', borderRadius:8, marginBottom:12}}>
              Sem marcar como pago, a OS fica como <strong>Pendente pagamento</strong> — serviço pronto, aguardando o cliente pagar por {formaPagamento}.
            </div>
          )}
        </React.Fragment>
      )}

      <div className="field-row">
        <div className="field">
          <label>{isAguardando ? 'O que precisa de aprovação (obrigatório)' : 'Nota (opcional — vai junto na mensagem pro cliente)'}</label>
          <textarea value={nota} onChange={e=>setNota(e.target.value)} placeholder={isAguardando ? 'Ex: Encontrei a placa-mãe queimada, vai precisar trocar. Confirma se pode seguir?' : 'Ex: Faltava a fonte 500W, já chegou e a manutenção está em andamento.'} />
        </div>
      </div>
      {order.statusHistorico && order.statusHistorico.length>0 && (
        <React.Fragment>
          <div className="section-bar">Histórico</div>
          {order.statusHistorico.slice().reverse().map((h,i)=>(
            <div key={i} style={{fontSize:12.5, color:'var(--ink-soft)', borderBottom:'1px solid var(--border)', padding:'6px 0'}}>
              <strong style={{color:'var(--navy)'}}>{STATUS_OS_LABELS[h.status]||h.status}</strong> — {new Date(h.data).toLocaleString('pt-BR')}
              {h.nota && <div>{h.nota}</div>}
            </div>
          ))}
        </React.Fragment>
      )}
    </Modal>
  );
}

/* ---------------- ORDENS TAB ---------------- */
function OrdensTab({orders, setOrders, clients, setClients, products, config, setConfig, autoOpenNew, presetClientId, goTo, orcamentos, diagnosticos, appointments}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showClientQuick, setShowClientQuick] = useState(false);
  const [search, setSearch] = useState('');
  const [pendingClientId, setPendingClientId] = useState(presetClientId || '');
  const [statusTarget, setStatusTarget] = useState(null);
  const [statusMsg, setStatusMsg] = useState(null);
  const [soNaoSeparadas, setSoNaoSeparadas] = useState(false);

  useEffect(()=>{ if(autoOpenNew){ setEditing(null); setShowForm(true); } }, [autoOpenNew]);

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || 'Cliente não encontrado';
  const totalNaoSeparadas = orders.filter(o=>!orderUsaItens(o) && parseFloat(o.valor)>0).length;
  const filtered = orders.filter(o=> o.osNumber.includes(search) || clientName(o.clientId).toLowerCase().includes(search.toLowerCase()))
    .filter(o=> !soNaoSeparadas || (!orderUsaItens(o) && parseFloat(o.valor)>0))
    .sort((a,b)=> b.dataISO.localeCompare(a.dataISO));

  const saveOrder = (data)=>{
    if(editing){
      setOrders(prev=>prev.map(o=>o.id===editing.id ? {...o, ...data} : o));
      atualizarPortalAuto(orders.map(o=>o.id===editing.id ? {...o, ...data} : o), editing.clientId);
      setShowForm(false); setEditing(null);
      goTo('recibos', null, null, editing.id);
    } else {
      const novoId = uid();
      setConfig(prevConfig=>{
        const counter = (prevConfig.osCounter||1000000)+1;
        const novo = {...data, id:novoId, osNumber: generateOsNumber(counter), status: data.status || 'em_andamento', statusHistorico:[], createdAt:new Date().toISOString()};
        setOrders(prevOrders=>[novo, ...prevOrders]);
        goTo('recibos', null, null, novoId);
        return {...prevConfig, osCounter:counter};
      });
      setShowForm(false); setEditing(null);
    }
  };
  const deleteOrder = (id)=>{
    if(confirm('Excluir esta ordem de serviço?')) setOrders(prev=>prev.filter(o=>o.id!==id));
  };
  const quickAddClient = (data)=>{
    const novo = {...data, id:uid(), createdAt:new Date().toISOString(), interacoes:[]};
    setClients(prev=>[novo, ...prev]);
    setPendingClientId(novo.id);
    setShowClientQuick(false);
  };
  // Quando o status (ou a OS) muda, já manda pra página do cliente — só pra quem já tem link gerado.
  const [portalMsg, setPortalMsg] = useState(null);
  const atualizarPortalAuto = async (ordersNovos, clientId)=>{
    const cli = clients.find(c=>c.id===clientId);
    if(!cli || !cli.portalAtivo) return;
    if(!(config.githubOwner && config.githubRepo && config.githubToken && config.portalBaseUrl)) return;
    if(!cli.portalId || !cli.portalKey || !cli.portalK2){
      // Link do sistema antigo (sem criptografia) — publicar agora criaria um link novo que o cliente não tem.
      setPortalMsg({estado:'erro', msg:'🔒 Esse cliente ainda está com o link antigo. Vai em Clientes → "Atualizar todos os links" pra gerar o link novo (protegido) e manda pra ele.'});
      setTimeout(()=>setPortalMsg(null), 7000);
      return;
    }
    setPortalMsg({estado:'enviando', msg:'☁️ Atualizando a página do cliente...'});
    try{
      const hist = ordersNovos.filter(o=>o.clientId===clientId);
      const res = await atualizarLinkAcompanhamentoAoVivo(cli, hist, orcamentos||[], diagnosticos||[], appointments||[], config);
      if(res.portalId!==cli.portalId || res.portalKey!==cli.portalKey || res.portalK2!==cli.portalK2){
        setClients(prev=>prev.map(c=>c.id===clientId ? {...c, portalId:res.portalId, portalKey:res.portalKey, portalK2:res.portalK2} : c));
      }
      setPortalMsg({estado:'ok', msg:'✔ Página do cliente atualizada.'});
    }catch(e){
      setPortalMsg({estado:'erro', msg:'✕ Não deu pra atualizar a página do cliente agora ('+((e&&e.message)||'erro')+'). Tenta de novo em Clientes → Gerar link.'});
    }
    setTimeout(()=>setPortalMsg(null), 5000);
  };
  const saveStatus = (status, nota, extra)=>{
    const historico = [...(statusTarget.statusHistorico||[]), {status, nota, data:new Date().toISOString()}];
    const atualizado = {...statusTarget, status, statusHistorico:historico, ...(extra||{})};
    setOrders(prev=>prev.map(o=>o.id===statusTarget.id ? atualizado : o));
    atualizarPortalAuto(orders.map(o=>o.id===statusTarget.id ? atualizado : o), statusTarget.clientId);
    setStatusTarget(null);
    setStatusMsg({order:atualizado, nota});
  };
  const marcarPagamentoRecebido = (order)=>{
    const historico = [...(order.statusHistorico||[]), {status:'concluido', nota:'Pagamento recebido', data:new Date().toISOString()}];
    const atualizado = {...order, status:'concluido', pagamentoRecebido:true, statusHistorico:historico};
    setOrders(prev=>prev.map(o=>o.id===order.id ? atualizado : o));
    atualizarPortalAuto(orders.map(o=>o.id===order.id ? atualizado : o), order.clientId);
    setStatusMsg({order:atualizado, nota:''});
  };
  const marcarAprovacaoCliente = (order, aprovou)=>{
    const novoStatus = aprovou ? 'em_andamento' : 'cancelado';
    const nota = aprovou ? 'Cliente aprovou a alteração proposta' : 'Cliente não aprovou — serviço cancelado';
    const historico = [...(order.statusHistorico||[]), {status:novoStatus, nota, data:new Date().toISOString()}];
    const novoValor = aprovou && order.valorProposto ? order.valorProposto : order.valor;
    const atualizado = {...order, status:novoStatus, valor:novoValor, valorProposto:null, statusHistorico:historico};
    setOrders(prev=>prev.map(o=>o.id===order.id ? atualizado : o));
    atualizarPortalAuto(orders.map(o=>o.id===order.id ? atualizado : o), order.clientId);
    setStatusMsg({order:atualizado, nota});
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Ordens de Serviço</h1>
          <div className="page-sub">{orders.length} OS registrada(s)</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setPendingClientId(''); setShowForm(true);}}>+ Nova OS</button>
      </div>
      <div className="search-bar">
        <input placeholder="Buscar por nº da OS ou cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {totalNaoSeparadas>0 && (
        <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'10px 14px', borderRadius:8, marginBottom:14, display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap'}}>
          <span>⚠️ {totalNaoSeparadas} OS ainda {totalNaoSeparadas===1?'não separa':'não separam'} peça de mão de obra — o valor delas não entra no faturamento certo dos relatórios.</span>
          <button type="button" className="btn btn-outline btn-sm" onClick={()=>setSoNaoSeparadas(v=>!v)}>{soNaoSeparadas ? 'Mostrar todas' : 'Mostrar só essas'}</button>
        </div>
      )}
      {filtered.length===0 && <div className="empty-state"><div className="ic">🧾</div>Nenhuma ordem de serviço encontrada.</div>}
      {filtered.map(o=>(
        <div className="list-item" key={o.id} style={{flexDirection: (o.vistoria && !o.vistoria.resolvido) ? 'column' : 'row', alignItems: (o.vistoria && !o.vistoria.resolvido) ? 'stretch' : 'center'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, width:'100%'}}>
            <div className="li-main" onClick={()=>goTo('recibos', null, null, o.id)} style={{cursor:'pointer'}}>
              <strong>OS #{o.osNumber} — {clientName(o.clientId)}</strong> <span className={`pill ${STATUS_OS_PILL[o.status]||'pill-blue'}`}>{STATUS_OS_LABELS[o.status]||'Em andamento'}</span> {o.orcamentoOrigemId && <span className="pill pill-gold">📋 De orçamento</span>} {o.vistoria && !o.vistoria.resolvido && <span className="pill pill-red">🔍 OS — Vistoria</span>} {!orderUsaItens(o) && parseFloat(o.valor)>0 && <span className="pill pill-gold">⚠️ não separada</span>}
              <div className="meta">{formatDateBR(o.dataISO)} · {o.equipamento || 'Serviço'} · R$ {formatMoney(o.valor)}{o.formaPagamento ? ` · ${o.formaPagamento}` : ''}{o.status==='aguardando_aprovacao' && o.valorProposto ? ` · Novo valor proposto: R$ ${formatMoney(o.valorProposto)}` : ''}</div>
            </div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              <button className="btn btn-navy btn-sm" onClick={()=>setStatusTarget(o)}>🔄 Status</button>
              {o.status==='pendente_pagamento' && <button className="btn btn-gold btn-sm" onClick={()=>marcarPagamentoRecebido(o)}>💰 Pagamento recebido</button>}
              {o.status==='aguardando_aprovacao' && (
                <React.Fragment>
                  <button className="btn btn-gold btn-sm" onClick={()=>marcarAprovacaoCliente(o, true)}>✔ Cliente aprovou</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>marcarAprovacaoCliente(o, false)}>✕ Cliente recusou</button>
                </React.Fragment>
              )}
              <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(o); setShowForm(true);}}>Editar</button>
              <button className="btn btn-outline btn-sm" onClick={()=>goTo('recibos', null, null, o.id)}>Recibo</button>
              <button className="btn btn-danger btn-sm" onClick={()=>deleteOrder(o.id)}>Excluir</button>
            </div>
          </div>
          {o.vistoria && !o.vistoria.resolvido && (
            <div className="vistoria-box">
              <strong>Relato da vistoria:</strong> {o.vistoria.relato}
              <div style={{marginTop:6}}>
                <button className="btn btn-outline btn-sm" onClick={()=>goTo('garantia')}>🛡️ Ver na aba Garantia</button>
              </div>
            </div>
          )}
        </div>
      ))}

      {showForm && (
        <Modal title={editing ? `Editar OS #${editing.osNumber}` : 'Nova Ordem de Serviço'} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
          <OrderForm
            initial={editing || (pendingClientId ? {osNumber:'', dataISO: todayISO(), tecnico:'Gabriel', clientId:pendingClientId, equipamento:'', numeroSerie:'', observacoes:'', valor:'', formaPagamento:'', garantiaFisicaDias:90, garantiaSoftwareDias:7} : null)}
            clients={clients}
            products={products}
            onSave={saveOrder}
            onCancel={()=>{setShowForm(false); setEditing(null);}}

          />
        </Modal>
      )}

          {portalMsg.msg}
        </div>
      )}

        <OSStatusModal order={statusTarget} onSave={saveStatus} onCancel={()=>setStatusTarget(null)} />

          title={`Mensagem — OS #${statusMsg.order.osNumber}`}
          text={buildStatusOSText(statusMsg.order, clients.find(c=>c.id===statusMsg.order.clientId), statusMsg.nota)}
          onClose={()=>setStatusMsg(null)}
        />
      )}
    </div>
  );
}

            <div style={{fontSize:12.5, color: margem>=0 ? 'var(--green-ok)' : 'var(--red-no)', fontWeight:700, marginBottom:12}}>

function ProdutosTab({products, setProducts}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filterTipo, setFilterTipo] = useState('todos');
  const [search, setSearch] = useState('');

  const filtered = products.filter(p=>{
    if(filterTipo!=='todos' && p.tipo!==filterTipo) return false;
    return p.nome.toLowerCase().includes(search.toLowerCase()) || (p.categoria||'').toLowerCase().includes(search.toLowerCase());
  });

  const saveProduct = (data)=>{
    if(editing){
      setProducts(prev=>prev.map(p=>p.id===editing.id ? {...p, ...data} : p));
    } else {
      setProducts(prev=>[{...data, id:uid(), createdAt:new Date().toISOString()}, ...prev]);
    }
    setShowForm(false); setEditing(null);
  };
  const deleteProduct = (id)=>{
    if(confirm('Remover este item do catálogo?')) setProducts(prev=>prev.filter(p=>p.id!==id));
  };
  const marcarEsgotado = (id)=>{
    setProducts(prev=>prev.map(p=>p.id===id ? {...p, estoque:0} : p));
  };

  const tipoLabel = {produto:'Produto', licenca:'Licença', servico:'Serviço', insumo:'Insumo'};

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Produtos e Serviços</h1>
          <div className="page-sub">{products.length} item(ns) no catálogo</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Novo item</button>
      </div>

      <div className="filter-toggle">
        <button className={filterTipo==='todos'?'active':''} onClick={()=>setFilterTipo('todos')}>Todos</button>
        <button className={filterTipo==='produto'?'active':''} onClick={()=>setFilterTipo('produto')}>📦 Produtos</button>
        <button className={filterTipo==='licenca'?'active':''} onClick={()=>setFilterTipo('licenca')}>🔑 Licenças</button>
        <button className={filterTipo==='servico'?'active':''} onClick={()=>setFilterTipo('servico')}>🛠️ Serviços</button>
        <button className={filterTipo==='insumo'?'active':''} onClick={()=>setFilterTipo('insumo')}>🧴 Insumos</button>
      </div>

      <div className="search-bar">
        <input placeholder="Buscar por nome ou categoria..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>

      {filtered.length===0 && <div className="empty-state"><div className="ic">📦</div>Nenhum item encontrado.</div>}
      {filtered.map(p=>{
        const margem = p.precoCusto && parseFloat(p.precoCusto)>0 ? (parseFloat(p.preco)||0) - parseFloat(p.precoCusto) : null;
        const esgotado = (p.tipo==='produto' || p.tipo==='insumo') && (parseInt(p.estoque)||0)<=0;
        return (
          <div className="list-item" key={p.id}>
            <div className="li-main">
              <strong>{p.nome}</strong> <span className={`prod-badge ${p.tipo}`}>{tipoLabel[p.tipo] || p.tipo}</span>
              {esgotado && <span className="pill pill-red" style={{marginLeft:6}}>Esgotado</span>}
              <div className="meta">
                {p.categoria && <span>{p.categoria} · </span>}
                {p.tipo!=='insumo' && <span>R$ {formatMoney(p.preco)}</span>}
                {margem!==null && <span> · Lucro: <span style={{color: margem>=0 ? 'var(--green-ok)' : 'var(--red-no)', fontWeight:700}}>R$ {formatMoney(margem)}</span></span>}
                {(p.tipo==='produto' || p.tipo==='insumo') && <span> · Estoque: <span className={parseInt(p.estoque)<=2 ? 'stock-low' : ''}>{p.estoque || 0}</span></span>}
                {p.tipo==='licenca' && p.validade && <span> · Válida até {formatDateBR(p.validade)}</span>}
              </div>
            </div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              {(p.tipo==='produto' || p.tipo==='insumo') && !esgotado && <button className="btn btn-outline btn-sm" onClick={()=>marcarEsgotado(p.id)}>🚫 Esgotado</button>}
              <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(p); setShowForm(true);}}>Editar</button>
              <button className="btn btn-danger btn-sm" onClick={()=>deleteProduct(p.id)}>Excluir</button>
            </div>
          </div>
        );
      })}

      {showForm && (
        <Modal title={editing ? 'Editar item' : 'Novo item do catálogo'} onClose={()=>{setShowForm(false); setEditing(null);}}>
          <ProductForm initial={editing} onSave={saveProduct} onCancel={()=>{setShowForm(false); setEditing(null);}} />
        </Modal>
      )}
    </div>
  );
}

        <div style={{alignSelf:'flex-end'}}>
          <button type="button" className="btn btn-outline btn-sm" onClick={useMbSerial} disabled={!f.placaMae.serial}>Usar nº da placa-mãe</button>

      </div>
      <div className="build-comp-block">
        <div className="bc-title">Placa de Vídeo (GPU)</div>
