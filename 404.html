  useEffect(()=>{ if(loaded) saveData('lh_despesas', despesas); }, [despesas, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_diagnosticos', diagnosticos); }, [diagnosticos, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_devolucoes', devolucoes); }, [devolucoes, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_devolucoes_fornecedor', devolucoesFornecedor); }, [devolucoesFornecedor, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_dividas', dividas); }, [dividas, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_tombstones', tombstones); }, [tombstones, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_config', config); }, [config, loaded]);

  const goTo = (targetTab, mode, presetClientId, focusOrderId, focusDate)=>{
    setTab(targetTab);
    setNavFlag({key: Date.now(), autoNew: mode==='new', presetClientId: presetClientId||null, focusOrderId: focusOrderId||null, focusDate: focusDate||null});
  };

  const timestampArquivo = ()=>{
    const d = new Date();
    const pad = (n)=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}h${pad(d.getMinutes())}`;
  };

  const [syncStatus, setSyncStatus] = useState({loading:false, msg:''});
  const [syncStatusServidor, setSyncStatusServidor] = useState({loading:false, msg:''});
  const [syncStatusBackend, setSyncStatusBackend] = useState({loading:false, msg:''});
  const [syncStatusSupa, setSyncStatusSupa] = useState({loading:false, msg:''});
  const [syncStatusTema, setSyncStatusTema] = useState({loading:false, msg:''});
  const [autoSyncMsg, setAutoSyncMsg] = useState(null);
  const [avisoAgendamento, setAvisoAgendamento] = useState(null);

  // Ao abrir o app, confere se tem visita/agendamento marcado pra hoje ou amanhã, e avisa —
  // só um aviso dentro do próprio app (não é notificação do sistema operacional).
  useEffect(()=>{
    if(!loaded) return;
    const hoje = todayISO();
    const amanha = addDays(hoje, 1);
    const relevantes = (appointments||[]).filter(a=> a.status==='agendado' && (a.data===hoje || a.data===amanha));
    if(relevantes.length===0) return;
    const deHoje = relevantes.filter(a=>a.data===hoje);
    const deAmanha = relevantes.filter(a=>a.data===amanha);
    const partes = [];
    if(deHoje.length>0) partes.push(`${deHoje.length} pra HOJE`);
    if(deAmanha.length>0) partes.push(`${deAmanha.length} pra AMANHÃ`);
    const primeiro = (deHoje[0] || deAmanha[0]);
    const cliente = clients.find(c=>c.id===primeiro.clientId);
    setAvisoAgendamento({
      texto: `📅 Você tem ${partes.join(' e ')}: "${primeiro.titulo}"${cliente ? ` — ${cliente.nome}` : ''} às ${primeiro.hora}${relevantes.length>1 ? ` (+${relevantes.length-1} outro(s))` : ''}.`
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  const buildBackupObject = ()=>({
    version:1, exportedAt:new Date().toISOString(),
    clients, orders, appointments, products, builds, orcamentos, promocoes, despesas, diagnosticos, devolucoes, devolucoesFornecedor, dividas, config, tombstones
  });

  // Backup na nuvem via GitHub (não mais SheetBest/Google Sheets) — resolve de vez o limite de
  // 50 mil caracteres por célula do Google Sheets, que travava backups grandes com erro 422.
  // O backup inteiro vira UM ARQUIVO (backup/dados.json) num repositório PRIVADO do GitHub, e cada
  // envio é um commit — o que dá o histórico de versões de graça, sem precisar gerenciar linhas.
  const BACKUP_PATH_GITHUB = 'backup/dados.json';

  const githubBackupConfigOk = ()=> !!(config.githubBackupOwner && config.githubBackupRepo && config.githubBackupToken);

  const buscarArquivoBackupGithub = async ()=>{
    const owner = (config.githubBackupOwner||'').trim();
    const repo = (config.githubBackupRepo||'').trim();
    const token = (config.githubBackupToken||'').trim();
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${BACKUP_PATH_GITHUB}`;
    // Pede o conteúdo em DOIS formatos ao mesmo tempo: o "raw" (texto puro do arquivo, funciona até
    // 100MB) pra ler os dados de verdade, e o normal (JSON) só pra pegar o "sha" — que é sempre
    // devolvido não importa o tamanho do arquivo, mas o campo "content" em base64 vem VAZIO quando o
    // arquivo passa de 1MB. Sem isso, o backup pararia de conseguir ser lido assim que crescesse.
    const [respRaw, respMeta] = await Promise.all([
      fetch(apiUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.raw+json'}}),
      fetch(apiUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json'}}),
    ]);
    if(respRaw.status===404) return null; // ainda não existe nenhum backup enviado
    if(!respRaw.ok){
      const info = await respRaw.json().catch(()=>({}));
      if(respRaw.status===401) throw new Error('Token do GitHub inválido ou expirado.');
      throw new Error(info.message || `Resposta ${respRaw.status}`);
    }
    const infoMeta = await respMeta.json().catch(()=>({}));
    // Se o caminho "backup/dados.json" apontar pra uma PASTA em vez de um arquivo (ex: criada por
    // engano, ou por algum teste manual direto no GitHub), a API devolve uma LISTA de arquivos em
    // vez do conteúdo de um arquivo só — isso quebraria a leitura mais na frente sem avisar direito
    // o que houve. Detecta esse caso aqui e avisa com uma mensagem clara.
    if(Array.isArray(infoMeta)){
      throw new Error(`"${BACKUP_PATH_GITHUB}" é uma PASTA no seu repositório, não um arquivo — apaga essa pasta pelo site do GitHub (ou renomeia) e tenta enviar de novo, que o sistema recria certinho.`);
    }
    const conteudo = await respRaw.text();
    let obj;
    try{
      obj = JSON.parse(conteudo);
    }catch(erroParse){
      throw new Error(`O arquivo "${BACKUP_PATH_GITHUB}" que já existe no repositório não é um backup válido (conteúdo ilegível) — apaga esse arquivo pelo site do GitHub e tenta enviar de novo, que o sistema recria do zero.`);
    }
    if(!obj || typeof obj.dados !== 'string'){
      throw new Error(`O arquivo "${BACKUP_PATH_GITHUB}" que já existe no repositório não tem o formato esperado de um backup — apaga esse arquivo pelo site do GitHub e tenta enviar de novo, que o sistema recria do zero.`);
    }
    return {...obj, sha: infoMeta.sha};
  };

  // Verifica se algum outro aparelho já mandou algo pra nuvem depois da última vez que ESSE aparelho
  // sincronizou (enviou ou baixou). Evita que um aparelho com dado desatualizado sobrescreva sem querer
  // uma alteração mais recente feita em outro lugar.
  const checarConflitoNuvem = async ()=>{
    // Se não conseguir LER o que já está lá (arquivo corrompido, pasta no lugar errado, etc), não
    // trava o envio por causa disso — só não dá pra avisar sobre conflito, e segue em frente. Quem
    // realmente sobrescreve o arquivo (subirArquivoGithub) tem seu próprio jeito de pegar o
    // identificador certo, então o envio consegue continuar mesmo sem essa checagem funcionar.
    let atual;
    try{
      atual = await buscarArquivoBackupGithub();
    }catch(e){
      return {conflito:false, ultimaNaNuvem:null};
    }
    if(!atual) return {conflito:false, ultimaNaNuvem:null};
    const stampNaNuvem = atual.atualizado_em;
    const stampConhecido = config.lastKnownCloudStamp;
    const conflito = !!stampConhecido && !!stampNaNuvem && stampConhecido!==stampNaNuvem;
    return {conflito, ultimaNaNuvem: stampNaNuvem};
  };

  const enviarBackupNuvem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    setSyncStatus({loading:true, msg:''});
    try{
      const {conflito, ultimaNaNuvem} = await checarConflitoNuvem();
      if(conflito){
        setSyncStatus({loading:false, msg:''});
        const [dataConflito, dispositivoConflito, versaoConflito] = String(ultimaNaNuvem).split(' · ');
        const prosseguir = confirm(
          `⚠️ O aparelho "${dispositivoConflito || 'desconhecido'}"${versaoConflito ? ` (app ${versaoConflito})` : ''} enviou dados pra nuvem em ${dataConflito}, depois da última vez que ESSE aparelho sincronizou.\n\n` +
          `Se você enviar agora, vai SOBRESCREVER essa versão mais recente com os dados daqui.\n\n` +
          `Recomendado: cancele e use o botão "🔀 Mesclar com a nuvem" em vez desse aqui — ele junta os dados novos dos dois lados sem perder nada.\n\n` +
          `Quer enviar mesmo assim e sobrescrever?`
        );
        if(!prosseguir){
          setSyncStatus({loading:false, msg:'✕ Envio cancelado — dados da nuvem não foram alterados.'});
          return;
        }
      }
      setSyncStatus({loading:true, msg:''});
      const backup = buildBackupObject();
      const novoStamp = new Date().toLocaleString('pt-BR') + ' · ' + getNomeDispositivo() + ' · v' + APP_VERSION;
      const owner = config.githubBackupOwner.trim(), repo = config.githubBackupRepo.trim(), token = config.githubBackupToken.trim();
      const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify({dados: JSON.stringify(backup), atualizado_em: novoStamp}, null, 2))));
      await subirArquivoGithub(owner, repo, token, BACKUP_PATH_GITHUB, conteudoBase64, `Backup — ${novoStamp}`);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString(), lastCloudSyncAt:new Date().toISOString(), lastKnownCloudStamp:novoStamp}));
      setSyncStatus({loading:false, msg:'✔ Backup enviado pra nuvem com sucesso!'});
    }catch(e){
      setSyncStatus({loading:false, msg:'✕ Não deu pra enviar (' + (e.message||'erro desconhecido') + '). Confira se o repositório é PRIVADO, se o token tem permissão "repo", e se usuário/repositório estão certos.'});
    }
  };

  // Apaga o arquivo de backup do GitHub — não mexe em nada aqui no aparelho, só limpa o "arquivo
  // atual" lá na nuvem (o histórico de commits continua existindo, o Git nunca apaga isso sozinho).
  const apagarBackupNuvem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    setSyncStatus({loading:true, msg:''});
    try{
      const owner = config.githubBackupOwner.trim(), repo = config.githubBackupRepo.trim(), token = config.githubBackupToken.trim();
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${BACKUP_PATH_GITHUB}`;
      const getResp = await fetch(apiUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json'}});
      if(getResp.status===404){
        setSyncStatus({loading:false, msg:'Não tinha nenhum backup salvo no GitHub pra apagar.'});
        return;
      }
      if(!getResp.ok) throw new Error(`Resposta ${getResp.status} verificando o arquivo`);
      const info = await getResp.json();
      const delResp = await fetch(apiUrl, {
        method: 'DELETE',
        headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
        body: JSON.stringify({message: `Apaga backup — ${new Date().toLocaleString('pt-BR')}`, sha: info.sha}),
      });
      if(!delResp.ok) throw new Error(`Resposta ${delResp.status} apagando o arquivo`);
      setConfig(prev=>({...prev, lastKnownCloudStamp:null}));
      setSyncStatus({loading:false, msg:'✔ Backup apagado do GitHub. Os dados aqui no aparelho continuam intactos.'});
    }catch(e){
      setSyncStatus({loading:false, msg:'✕ Não deu pra apagar (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // Sincronização automática com a nuvem — DESATIVADA a pedido (a mensagem de erro ficava
  // aparecendo toda hora e incomodando). Os botões manuais na aba Backup continuam
  // funcionando normalmente; só a parte "sozinha" (disparada automaticamente) foi desligada.
  const githubBackupConfigRef = useRef({owner:config.githubBackupOwner, repo:config.githubBackupRepo, token:config.githubBackupToken});
  useEffect(()=>{ githubBackupConfigRef.current = {owner:config.githubBackupOwner, repo:config.githubBackupRepo, token:config.githubBackupToken}; }, [config.githubBackupOwner, config.githubBackupRepo, config.githubBackupToken]);

  useEffect(()=>{
    return; // desativado — sincronização automática depois de salvar não dispara mais
    if(!loaded) return;
    if(syncTrigger===0) return; // 0 é o valor inicial (app acabou de abrir) — não sincroniza à toa
    const timer = setTimeout(async ()=>{
      const {owner, repo, token} = githubBackupConfigRef.current;
      if(!owner || !repo || !token) return;
      try{
        const r = await executarMesclagem();
        if(!r.ok || r.semDados) return;
        if(r.totalAdicionadosDaNuvem>0 || r.totalConflitos>0){
          setAutoSyncMsg({tipo: r.totalConflitos===0 ? 'sucesso' : 'atencao', texto: `☁️ Sincronizado: +${r.totalAdicionadosDaNuvem} da nuvem${r.totalConflitos>0 ? `, ⚠️ ${r.totalConflitos} conflito(s) — confira na aba Backup` : ''}.`});
        } else {
          setAutoSyncMsg({tipo:'sucesso', texto:'☁️ Sincronizado com a nuvem.'});
        }
        setTimeout(()=>setAutoSyncMsg(null), 6000);
      }catch(e){
        setAutoSyncMsg({tipo:'erro', texto:'✕ Não deu pra sincronizar automaticamente: ' + (e.message||'sem conexão') + '.'});
        setTimeout(()=>setAutoSyncMsg(null), 8000);
      }
    }, 4000);
    return ()=> clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [syncTrigger, loaded]);

  const baixarBackupNuvem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    if(!confirm('Isso substitui TODOS os dados atuais do sistema pelos dados mais recentes salvos na nuvem. Tem certeza?')) return;
    setSyncStatus({loading:true, msg:''});
    try{
      const atual = await buscarArquivoBackupGithub();
      if(!atual) throw new Error('Nenhum backup encontrado no repositório ainda');
      const backup = JSON.parse(atual.dados);
      setClients(backup.clients||[]); setOrders(backup.orders||[]); setAppointments(backup.appointments||[]);
      setProducts(backup.products||[]); setBuilds(backup.builds||[]); setOrcamentos(backup.orcamentos||[]);
      setPromocoes(backup.promocoes||[]); setDespesas(backup.despesas||[]); setDiagnosticos(backup.diagnosticos||[]);
      setDevolucoes(backup.devolucoes||[]); setDevolucoesFornecedor(backup.devolucoesFornecedor||[]); setDividas(backup.dividas||[]);
      setTombstones(backup.tombstones||[]);
      setConfig(prev=>({...(backup.config||prev), githubBackupOwner:prev.githubBackupOwner, githubBackupRepo:prev.githubBackupRepo, githubBackupToken:prev.githubBackupToken, lastKnownCloudStamp:atual.atualizado_em}));
      setSyncStatus({loading:false, msg:'✔ Dados restaurados da nuvem com sucesso!'});
    }catch(e){
      setSyncStatus({loading:false, msg:'✕ Não deu pra baixar (' + (e.message||'erro desconhecido') + '). Confira a configuração e se já tem pelo menos um envio salvo.'});
    }
  };

  // Histórico: como cada envio é um COMMIT no Git, o histórico de versões já existe naturalmente —
  // busca ele via a API de commits do GitHub, em vez de gerenciar linhas manualmente numa planilha.
  const [historicoNuvem, setHistoricoNuvem] = useState({loading:false, itens:null, erro:''});

  const buscarHistoricoNuvem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    setHistoricoNuvem({loading:true, itens:null, erro:''});
    try{
      const owner = config.githubBackupOwner.trim(), repo = config.githubBackupRepo.trim(), token = config.githubBackupToken.trim();
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(BACKUP_PATH_GITHUB)}&per_page=30`;
      const resp = await fetch(apiUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json'}});
      if(!resp.ok){
        const info = await resp.json().catch(()=>({}));
        throw new Error(info.message || `Resposta ${resp.status}`);
      }
      const commits = await resp.json();
      // Busca o conteúdo de cada versão em paralelo, pra montar o resuminho (quantos clientes, OS etc tinha em cada uma)
      const itens = await Promise.all(commits.map(async (c)=>{
        let resumo = null, atualizadoEm = c.commit.message.replace(/^Backup( \(mesclado\))? — /, '') || c.commit.author.date;
        try{
          const contUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${BACKUP_PATH_GITHUB}?ref=${c.sha}`;
          const rc = await fetch(contUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.raw+json'}});
          if(rc.ok){
            const conteudo = await rc.text();
            const obj = JSON.parse(conteudo);
            const dados = JSON.parse(obj.dados);
            resumo = {
              clientes: (dados.clients||[]).length,
              os: (dados.orders||[]).length,
              orcamentos: (dados.orcamentos||[]).length,
              agendamentos: (dados.appointments||[]).length,
            };
          }
        }catch(e){ /* versão com dado corrompido/ilegível — ainda mostra na lista, só sem resumo */ }
        const [dataFormatada, dispositivo, versaoApp] = String(atualizadoEm).split(' · ');
        return {indice: c.sha, atualizadoEm: dataFormatada, dispositivo: dispositivo || null, versaoApp: versaoApp || null, resumo};
      }));
      setHistoricoNuvem({loading:false, itens, erro:''});
    }catch(e){
      setHistoricoNuvem({loading:false, itens:null, erro: e.message||'erro desconhecido'});
    }
  };

  const restaurarVersaoDoHistorico = async (sha)=>{
    if(!confirm('Isso substitui TODOS os dados atuais do sistema pelos dados dessa versão específica. Tem certeza?')) return;
    setSyncStatus({loading:true, msg:''});
    try{
      const owner = config.githubBackupOwner.trim(), repo = config.githubBackupRepo.trim(), token = config.githubBackupToken.trim();
      const contUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${BACKUP_PATH_GITHUB}?ref=${sha}`;
      const rc = await fetch(contUrl, {headers: {'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.raw+json'}});
      if(!rc.ok) throw new Error('Essa versão não existe mais no repositório');
      const conteudo = await rc.text();
      const linha = JSON.parse(conteudo);
      const backup = JSON.parse(linha.dados);
      setClients(backup.clients||[]); setOrders(backup.orders||[]); setAppointments(backup.appointments||[]);
      setProducts(backup.products||[]); setBuilds(backup.builds||[]); setOrcamentos(backup.orcamentos||[]);
      setPromocoes(backup.promocoes||[]); setDespesas(backup.despesas||[]); setDiagnosticos(backup.diagnosticos||[]);
      setDevolucoes(backup.devolucoes||[]); setDevolucoesFornecedor(backup.devolucoesFornecedor||[]); setDividas(backup.dividas||[]);
      setTombstones(backup.tombstones||[]);
      setConfig(prev=>({...(backup.config||prev), githubBackupOwner:prev.githubBackupOwner, githubBackupRepo:prev.githubBackupRepo, githubBackupToken:prev.githubBackupToken, lastKnownCloudStamp:linha.atualizado_em}));
      setSyncStatus({loading:false, msg:`✔ Restaurado a versão de ${linha.atualizado_em}!`});
    }catch(e){
      setSyncStatus({loading:false, msg:'✕ Não deu pra restaurar essa versão (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // Mescla os dados locais com os da nuvem, em vez de escolher um lado e jogar o outro fora.
  // Regra: registros que só existem de um lado (novo cliente cadastrado no celular, nova OS feita
  // no computador, etc.) entram todos, dos dois lados. Se o MESMO registro (mesmo id) tiver conteúdo
  // diferente nos dois lados — ou seja, foi editado nos dois aparelhos — mantém a versão local e avisa,
  // porque decidir qual edição "vale mais" exige julgamento humano, não dá pra adivinhar sozinho.
  const mesclarArrayPorId = (local, nuvem, idsApagados)=>{
    const porId = new Map();
    (nuvem||[]).forEach(item=> item && item.id && !idsApagados.has(item.id) && porId.set(item.id, item));
    let conflitos = 0;
    const conflitantes = [];
    (local||[]).forEach(item=>{
      if(!item || !item.id) return;
      if(idsApagados.has(item.id)) return; // apagado é apagado — não entra na mesclagem de jeito nenhum
      const daNuvem = porId.get(item.id);
      if(daNuvem && JSON.stringify(daNuvem)!==JSON.stringify(item)){
        conflitos++;
        conflitantes.push(item);
      }
      porId.set(item.id, item); // local prevalece em caso de mesmo id
    });
    return {merged: Array.from(porId.values()), conflitos, conflitantes};
  };

  // Junta o registro de exclusão local com o que veio da nuvem — união dos dois lados, sem
  // duplicar (mesmo id+tipo). É esse conjunto (não só o local) que decide o que fica de fora
  // da mesclagem, porque uma exclusão pode ter acontecido em QUALQUER aparelho.
  const mesclarTombstones = (locais, daNuvem)=>{
    const chave = (t)=> `${t.tipo}::${t.id}`;
    const mapa = new Map();
    (locais||[]).forEach(t=> t && t.id && mapa.set(chave(t), t));
    (daNuvem||[]).forEach(t=> t && t.id && !mapa.has(chave(t)) && mapa.set(chave(t), t));
    return Array.from(mapa.values());
  };

  // Núcleo da mesclagem — usado tanto pelo botão manual quanto pela sincronização automática ao abrir o sistema.
  const executarMesclagem = async ()=>{
    if(!githubBackupConfigOk()) return {ok:false, erro:'sem-config'};

    const atual = await buscarArquivoBackupGithub();
    if(!atual) return {ok:true, semDados:true};
    const nuvem = JSON.parse(atual.dados);

    const tombstonesUnificados = mesclarTombstones(tombstones, nuvem.tombstones);
    const idsApagadosPorTipo = {};
    tombstonesUnificados.forEach(t=>{
      if(!idsApagadosPorTipo[t.tipo]) idsApagadosPorTipo[t.tipo] = new Set();
      idsApagadosPorTipo[t.tipo].add(t.id);
    });
    const idsVazios = new Set();

    const camposParaMesclar = [
      {chave:'clients', label:'clientes', local:clients, set:setClients},
      {chave:'orders', label:'ordens de serviço', local:orders, set:setOrders},
      {chave:'appointments', label:'agendamentos', local:appointments, set:setAppointments},
      {chave:'products', label:'produtos', local:products, set:setProducts},
      {chave:'builds', label:'etiquetas', local:builds, set:setBuilds},
      {chave:'orcamentos', label:'orçamentos', local:orcamentos, set:setOrcamentos},
      {chave:'promocoes', label:'promoções', local:promocoes, set:setPromocoes},
      {chave:'despesas', label:'despesas', local:despesas, set:setDespesas},
      {chave:'diagnosticos', label:'diagnósticos', local:diagnosticos, set:setDiagnosticos},
      {chave:'devolucoes', label:'devoluções (cliente)', local:devolucoes, set:setDevolucoes},
      {chave:'devolucoesFornecedor', label:'devoluções (fornecedor)', local:devolucoesFornecedor, set:setDevolucoesFornecedor},
      {chave:'dividas', label:'dívidas', local:dividas, set:setDividas},
    ];

    let totalAdicionadosDaNuvem = 0;
    let totalConflitos = 0;
    const resumoPorTipo = [];
    const novoBackupCompleto = {};

    camposParaMesclar.forEach(({chave, label, local, set})=>{
      const nuvemArr = nuvem[chave] || [];
      const idsApagados = idsApagadosPorTipo[chave] || idsVazios;
      const { merged, conflitos } = mesclarArrayPorId(local, nuvemArr, idsApagados);
      const idsLocais = new Set((local||[]).map(i=>i && i.id));
      const adicionadosDaNuvem = merged.filter(i=> i && i.id && !idsLocais.has(i.id)).length;
      if(adicionadosDaNuvem>0 || conflitos>0){
        resumoPorTipo.push(`${label}: +${adicionadosDaNuvem} novo(s) da nuvem${conflitos>0 ? `, ${conflitos} em conflito (mantida a versão daqui)` : ''}`);
      }
      totalAdicionadosDaNuvem += adicionadosDaNuvem;
      totalConflitos += conflitos;
      set(merged);
      novoBackupCompleto[chave] = merged;
    });

    setTombstones(tombstonesUnificados);
    const tombstonesMudaram = tombstonesUnificados.length !== (tombstones||[]).length;

    // se não houve nada novo da nuvem, não precisa reenviar (economiza commits desnecessários)
    if(totalAdicionadosDaNuvem>0 || totalConflitos>0 || tombstonesMudaram || !config.lastKnownCloudStamp){
      const novoStamp = new Date().toLocaleString('pt-BR') + ' · ' + getNomeDispositivo() + ' · v' + APP_VERSION;
      const backupParaEnviar = {version:1, exportedAt:new Date().toISOString(), ...novoBackupCompleto, config, tombstones: tombstonesUnificados};
      const owner = config.githubBackupOwner.trim(), repo = config.githubBackupRepo.trim(), token = config.githubBackupToken.trim();
      const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify({dados: JSON.stringify(backupParaEnviar), atualizado_em: novoStamp}, null, 2))));
      await subirArquivoGithub(owner, repo, token, BACKUP_PATH_GITHUB, conteudoBase64, `Backup (mesclado) — ${novoStamp}`);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString(), lastCloudSyncAt:new Date().toISOString(), lastKnownCloudStamp:novoStamp}));
    } else {
      setConfig(prev=>({...prev, lastKnownCloudStamp:atual.atualizado_em}));
    }

    return {ok:true, totalAdicionadosDaNuvem, totalConflitos, resumoPorTipo};
  };

  // Pré-visualização: mostra o que MUDARIA se você mesclasse agora, sem aplicar nada ainda.
  const [previaMesclagem, setPreviaMesclagem] = useState({loading:false, resultado:null, erro:''});

  const preVisualizarMesclagem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    setPreviaMesclagem({loading:true, resultado:null, erro:''});
    try{
      const atual = await buscarArquivoBackupGithub();
      if(!atual){
        setPreviaMesclagem({loading:false, resultado:{semDados:true}, erro:''});
        return;
      }
      const nuvem = JSON.parse(atual.dados);
      const tombstonesUnificadosPreview = mesclarTombstones(tombstones, nuvem.tombstones);
      const idsApagadosPorTipoPreview = {};
      tombstonesUnificadosPreview.forEach(t=>{
        if(!idsApagadosPorTipoPreview[t.tipo]) idsApagadosPorTipoPreview[t.tipo] = new Set();
        idsApagadosPorTipoPreview[t.tipo].add(t.id);
      });
      const idsVaziosPreview = new Set();

      const camposParaMesclar = [
        {chave:'clients', label:'Clientes', local:clients},
        {chave:'orders', label:'Ordens de serviço', local:orders},
        {chave:'appointments', label:'Agendamentos', local:appointments},
        {chave:'products', label:'Produtos', local:products},
        {chave:'builds', label:'Etiquetas', local:builds},
        {chave:'orcamentos', label:'Orçamentos', local:orcamentos},
        {chave:'promocoes', label:'Promoções', local:promocoes},
        {chave:'despesas', label:'Despesas', local:despesas},
        {chave:'diagnosticos', label:'Diagnósticos', local:diagnosticos},
        {chave:'devolucoes', label:'Devoluções (cliente)', local:devolucoes},
        {chave:'devolucoesFornecedor', label:'Devoluções (fornecedor)', local:devolucoesFornecedor},
        {chave:'dividas', label:'Dívidas', local:dividas},
      ];

      const detalhes = camposParaMesclar.map(({chave, label, local})=>{
        const nuvemArr = nuvem[chave] || [];
        const idsApagados = idsApagadosPorTipoPreview[chave] || idsVaziosPreview;
        const { conflitos, conflitantes } = mesclarArrayPorId(local, nuvemArr, idsApagados);
        const idsLocais = new Set((local||[]).map(i=>i && i.id));
        const faltandoLocal = nuvemArr.filter(i=> i && i.id && !idsLocais.has(i.id) && !idsApagados.has(i.id));
        return {label, faltandoLocal: faltandoLocal.length, conflitos, conflitantes};
      }).filter(d=>d.faltandoLocal>0 || d.conflitos>0);

      setPreviaMesclagem({loading:false, resultado:{semDados:false, atualizadoEm: atual.atualizado_em, detalhes}, erro:''});
    }catch(e){
      setPreviaMesclagem({loading:false, resultado:null, erro: e.message||'erro desconhecido'});
    }
  };

  const mesclarComNuvem = async ()=>{
    if(!githubBackupConfigOk()){
      alert('Preenche usuário, repositório e token do GitHub primeiro.');
      return;
    }
    setSyncStatus({loading:true, msg:''});
    try{
      const r = await executarMesclagem();
      if(r.semDados){
        setSyncStatus({loading:false, msg:'✕ Nenhum backup encontrado no repositório ainda pra mesclar.'});
        return;
      }
      const resumoTexto = r.resumoPorTipo.length>0 ? r.resumoPorTipo.join(' · ') : 'Nada novo pra trazer — os dois lados já estavam iguais.';
      setSyncStatus({loading:false, msg:`✔ Mesclado com sucesso! ${r.totalAdicionadosDaNuvem} registro(s) trazido(s) da nuvem.${r.totalConflitos>0 ? ` ⚠️ ${r.totalConflitos} registro(s) existiam nos dois lados com conteúdo diferente — mantive a versão daqui, vale conferir manualmente.` : ''} (${resumoTexto})`});
    }catch(e){
      setSyncStatus({loading:false, msg:'✕ Não deu pra mesclar (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // ---- Servidor local (ESP32, na sua própria rede WiFi) ----
  // Funciona parecido com a nuvem, só que conversa direto com o endereço do ESP32 dentro da
  // rede — sem passar pela internet, sem GitHub. O ESP32 guarda só UMA versão (não tem
  // histórico como o GitHub), então aqui é sempre: busca o que está lá, mescla com o que tem
  // aqui, e manda a versão mesclada de volta pra ele.
  const enviarBackupServidorLocal = async ()=>{
    const ip = (config.esp32ServerIp||'').trim();
    if(!ip){ alert('Preenche o endereço (IP) do servidor primeiro.'); return; }
    setSyncStatusServidor({loading:true, msg:''});
    try{
      const backup = buildBackupObject();
      const resp = await fetch(`http://${ip}/backup`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(backup),
      });
      if(!resp.ok) throw new Error(`Resposta ${resp.status} do servidor`);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      setSyncStatusServidor({loading:false, msg:'✔ Backup enviado pro servidor local com sucesso!'});
    }catch(e){
      setSyncStatusServidor({loading:false, msg:'✕ Não deu pra enviar (' + (e.message||'erro desconhecido') + '). Confere se o celular/computador está na MESMA rede WiFi do servidor, e se o endereço (IP) está certo.'});
    }
  };

  // Busca o backup do servidor local em "páginas" pequenas e junta tudo — o ESP32 tem um
  // limite conhecido de ~64KB pra mandar numa resposta só, então divide em pedaços menores,
  // pedidos um de cada vez, e remonta o texto completo aqui do lado do app.
  const buscarBackupServidorLocalPorPaginas = async (ip)=>{
    const respInfo = await fetch(`http://${ip}/backup/info`);
    if(respInfo.status===404) return null; // nenhum backup salvo ainda
    if(!respInfo.ok) throw new Error(`Resposta ${respInfo.status} do servidor (info)`);
    const info = await respInfo.json();
    let textoCompleto = '';
    for(let pagina=0; pagina<info.totalPaginas; pagina++){
      const respPagina = await fetch(`http://${ip}/backup/pagina?n=${pagina}`);
      if(!respPagina.ok) throw new Error(`Resposta ${respPagina.status} do servidor (página ${pagina})`);
      textoCompleto += await respPagina.text();
    }
    return JSON.parse(textoCompleto);
  };

  const mesclarComServidorLocal = async ()=>{
    const ip = (config.esp32ServerIp||'').trim();
    if(!ip){ alert('Preenche o endereço (IP) do servidor primeiro.'); return; }
    setSyncStatusServidor({loading:true, msg:''});
    try{
      const doServidor = await buscarBackupServidorLocalPorPaginas(ip);
      if(!doServidor){
        setSyncStatusServidor({loading:false, msg:'Nenhum backup encontrado no servidor ainda — envia um primeiro com "📤 Enviar pro servidor local".'});
        return;
      }

      const tombstonesUnificados = mesclarTombstones(tombstones, doServidor.tombstones);
      const idsApagadosPorTipo = {};
      tombstonesUnificados.forEach(t=>{
        if(!idsApagadosPorTipo[t.tipo]) idsApagadosPorTipo[t.tipo] = new Set();
        idsApagadosPorTipo[t.tipo].add(t.id);
      });
      const idsVazios = new Set();

      const camposParaMesclar = [
        {chave:'clients', label:'clientes', local:clients, set:setClients},
        {chave:'orders', label:'ordens de serviço', local:orders, set:setOrders},
        {chave:'appointments', label:'agendamentos', local:appointments, set:setAppointments},
        {chave:'products', label:'produtos', local:products, set:setProducts},
        {chave:'builds', label:'etiquetas', local:builds, set:setBuilds},
        {chave:'orcamentos', label:'orçamentos', local:orcamentos, set:setOrcamentos},
        {chave:'promocoes', label:'promoções', local:promocoes, set:setPromocoes},
        {chave:'despesas', label:'despesas', local:despesas, set:setDespesas},
        {chave:'diagnosticos', label:'diagnósticos', local:diagnosticos, set:setDiagnosticos},
        {chave:'devolucoes', label:'devoluções (cliente)', local:devolucoes, set:setDevolucoes},
        {chave:'devolucoesFornecedor', label:'devoluções (fornecedor)', local:devolucoesFornecedor, set:setDevolucoesFornecedor},
        {chave:'dividas', label:'dívidas', local:dividas, set:setDividas},
      ];

      let totalAdicionados = 0, totalConflitos = 0;
      const resumoPorTipo = [];
      const novoBackupCompleto = {};
      camposParaMesclar.forEach(({chave, label, local, set})=>{
        const doServidorArr = doServidor[chave] || [];
        const idsApagados = idsApagadosPorTipo[chave] || idsVazios;
        const { merged, conflitos } = mesclarArrayPorId(local, doServidorArr, idsApagados);
        const idsLocais = new Set((local||[]).map(i=>i && i.id));
        const adicionados = merged.filter(i=> i && i.id && !idsLocais.has(i.id)).length;
        if(adicionados>0 || conflitos>0){
          resumoPorTipo.push(`${label}: +${adicionados} novo(s)${conflitos>0 ? `, ${conflitos} em conflito (mantida a versão daqui)` : ''}`);
        }
        totalAdicionados += adicionados;
        totalConflitos += conflitos;
        set(merged);
        novoBackupCompleto[chave] = merged;
      });
      setTombstones(tombstonesUnificados);

      // manda a versão já mesclada de volta pro servidor, pra ele ficar atualizado também
      const backupParaEnviar = {version:1, exportedAt:new Date().toISOString(), ...novoBackupCompleto, config, tombstones: tombstonesUnificados};
      const respPost = await fetch(`http://${ip}/backup`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(backupParaEnviar),
      });
      if(!respPost.ok) throw new Error(`Mesclou localmente, mas não conseguiu reenviar pro servidor (resposta ${respPost.status})`);

      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      const resumoTexto = resumoPorTipo.length>0 ? resumoPorTipo.join(' · ') : 'Nada novo pra trazer — os dois lados já estavam iguais.';
      setSyncStatusServidor({loading:false, msg:`✔ Mesclado com sucesso! ${totalAdicionados} registro(s) trazido(s) do servidor.${totalConflitos>0 ? ` ⚠️ ${totalConflitos} registro(s) existiam nos dois lados com conteúdo diferente — mantive a versão daqui.` : ''} (${resumoTexto})`});
    }catch(e){
      setSyncStatusServidor({loading:false, msg:'✕ Não deu pra mesclar (' + (e.message||'erro desconhecido') + '). Confere se está na mesma rede WiFi do servidor.'});
    }
  };

  // Manda o servidor local apagar o backup salvo nele — sem precisar abrir a página web do
  // ESP32 separadamente. Não mexe em nada aqui no aparelho, só limpa o que está guardado lá.
  const apagarBackupServidorLocal = async ()=>{
    const ip = (config.esp32ServerIp||'').trim();
    if(!ip){ alert('Preenche o endereço (IP) do servidor primeiro.'); return; }
    if(!confirm('Isso apaga o backup salvo no servidor local (ESP32). Os dados aqui no aparelho continuam intactos. Confirma?')) return;
    setSyncStatusServidor({loading:true, msg:''});
    try{
      const resp = await fetch(`http://${ip}/backup`, { method: 'DELETE' });
      if(!resp.ok) throw new Error(`Resposta ${resp.status} do servidor`);
      setSyncStatusServidor({loading:false, msg:'✔ Backup apagado do servidor local. Os dados aqui no aparelho continuam intactos.'});
    }catch(e){
      setSyncStatusServidor({loading:false, msg:'✕ Não deu pra apagar (' + (e.message||'erro desconhecido') + '). Confere se está na mesma rede WiFi do servidor.'});
    }
  };

  // ---- Backend dedicado (servidor próprio na internet, tipo Render.com) ----
  // Funciona parecido com o servidor local, só que usa endereço https:// (com o "s", seguro) e
  // exige um token — já que esse fica na internet aberta, não numa rede fechada de casa.
  const enviarBackupDedicado = async ()=>{
    const url = (config.backendUrl||'').trim().replace(/\/$/,'');
    const token = (config.backendToken||'').trim();
    if(!url || !token){ alert('Preenche o endereço e o token do backend primeiro.'); return; }
    setSyncStatusBackend({loading:true, msg:''});
    try{
      const backup = buildBackupObject();
      const resp = await fetch(`${url}/backup`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
        body: JSON.stringify(backup),
      });
      if(!resp.ok) throw new Error(`Resposta ${resp.status} do servidor`);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      setSyncStatusBackend({loading:false, msg:'✔ Backup enviado pro backend dedicado com sucesso!'});
    }catch(e){
      setSyncStatusBackend({loading:false, msg:'✕ Não deu pra enviar (' + (e.message||'erro desconhecido') + '). Confere o endereço, o token, e se o servidor está no ar (pode demorar uns 30-60s pra "acordar" se estiver há um tempo sem uso).'});
    }
  };

  const mesclarComBackendDedicado = async ()=>{
    const url = (config.backendUrl||'').trim().replace(/\/$/,'');
    const token = (config.backendToken||'').trim();
    if(!url || !token){ alert('Preenche o endereço e o token do backend primeiro.'); return; }
    setSyncStatusBackend({loading:true, msg:''});
    try{
      const respGet = await fetch(`${url}/backup`, {headers: {'Authorization': `Bearer ${token}`}});
      if(respGet.status===404){
        setSyncStatusBackend({loading:false, msg:'Nenhum backup encontrado no backend ainda — envia um primeiro com "📤 Enviar pro backend".'});
        return;
      }
      if(!respGet.ok) throw new Error(`Resposta ${respGet.status} do servidor`);
      const doServidor = await respGet.json();

      const tombstonesUnificados = mesclarTombstones(tombstones, doServidor.tombstones);
      const idsApagadosPorTipo = {};
      tombstonesUnificados.forEach(t=>{
        if(!idsApagadosPorTipo[t.tipo]) idsApagadosPorTipo[t.tipo] = new Set();
        idsApagadosPorTipo[t.tipo].add(t.id);
      });
      const idsVazios = new Set();

      const camposParaMesclar = [
        {chave:'clients', label:'clientes', local:clients, set:setClients},
        {chave:'orders', label:'ordens de serviço', local:orders, set:setOrders},
        {chave:'appointments', label:'agendamentos', local:appointments, set:setAppointments},
        {chave:'products', label:'produtos', local:products, set:setProducts},
        {chave:'builds', label:'etiquetas', local:builds, set:setBuilds},
        {chave:'orcamentos', label:'orçamentos', local:orcamentos, set:setOrcamentos},
        {chave:'promocoes', label:'promoções', local:promocoes, set:setPromocoes},
        {chave:'despesas', label:'despesas', local:despesas, set:setDespesas},
        {chave:'diagnosticos', label:'diagnósticos', local:diagnosticos, set:setDiagnosticos},
        {chave:'devolucoes', label:'devoluções (cliente)', local:devolucoes, set:setDevolucoes},
        {chave:'devolucoesFornecedor', label:'devoluções (fornecedor)', local:devolucoesFornecedor, set:setDevolucoesFornecedor},
        {chave:'dividas', label:'dívidas', local:dividas, set:setDividas},
      ];

      let totalAdicionados = 0, totalConflitos = 0;
      const resumoPorTipo = [];
      const novoBackupCompleto = {};
      camposParaMesclar.forEach(({chave, label, local, set})=>{
        const doServidorArr = doServidor[chave] || [];
        const idsApagados = idsApagadosPorTipo[chave] || idsVazios;
        const { merged, conflitos } = mesclarArrayPorId(local, doServidorArr, idsApagados);
        const idsLocais = new Set((local||[]).map(i=>i && i.id));
        const adicionados = merged.filter(i=> i && i.id && !idsLocais.has(i.id)).length;
        if(adicionados>0 || conflitos>0){
          resumoPorTipo.push(`${label}: +${adicionados} novo(s)${conflitos>0 ? `, ${conflitos} em conflito (mantida a versão daqui)` : ''}`);
        }
        totalAdicionados += adicionados;
        totalConflitos += conflitos;
        set(merged);
        novoBackupCompleto[chave] = merged;
      });
      setTombstones(tombstonesUnificados);

      const backupParaEnviar = {version:1, exportedAt:new Date().toISOString(), ...novoBackupCompleto, config, tombstones: tombstonesUnificados};
      const respPost = await fetch(`${url}/backup`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
        body: JSON.stringify(backupParaEnviar),
      });
      if(!respPost.ok) throw new Error(`Mesclou localmente, mas não conseguiu reenviar pro backend (resposta ${respPost.status})`);

      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      const resumoTexto = resumoPorTipo.length>0 ? resumoPorTipo.join(' · ') : 'Nada novo pra trazer — os dois lados já estavam iguais.';
      setSyncStatusBackend({loading:false, msg:`✔ Mesclado com sucesso! ${totalAdicionados} registro(s) trazido(s) do backend.${totalConflitos>0 ? ` ⚠️ ${totalConflitos} registro(s) existiam nos dois lados com conteúdo diferente — mantive a versão daqui.` : ''} (${resumoTexto})`});
    }catch(e){
      setSyncStatusBackend({loading:false, msg:'✕ Não deu pra mesclar (' + (e.message||'erro desconhecido') + '). Confere o endereço, o token, e se o servidor está no ar (pode demorar uns 30-60s pra "acordar" se estiver há um tempo sem uso).'});
    }
  };

  const apagarBackendDedicado = async ()=>{
    const url = (config.backendUrl||'').trim().replace(/\/$/,'');
    const token = (config.backendToken||'').trim();
    if(!url || !token){ alert('Preenche o endereço e o token do backend primeiro.'); return; }
    if(!confirm('Isso apaga o backup salvo no backend dedicado. Os dados aqui no aparelho continuam intactos. Confirma?')) return;
    setSyncStatusBackend({loading:true, msg:''});
    try{
      const resp = await fetch(`${url}/backup`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
      if(!resp.ok) throw new Error(`Resposta ${resp.status} do servidor`);
      setSyncStatusBackend({loading:false, msg:'✔ Backup apagado do backend dedicado. Os dados aqui no aparelho continuam intactos.'});
    }catch(e){
      setSyncStatusBackend({loading:false, msg:'✕ Não deu pra apagar (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // ---- Supabase (banco na nuvem com login; um registro de backup por usuário, protegido por RLS) ----
  // Quem entrou no programa já está conectado ao Supabase (login feito na tela inicial).
  const supaEntrar = async ()=>{
    const sess = await supaTokenValido();
    return {token:sess.access_token, userId:sess.userId, url:SUPABASE_URL_PADRAO, key:SUPABASE_CHAVE_PADRAO};
  };

  // Cada assunto vai pra sua própria tabela no Supabase (clientes, ordens_servico, orcamentos...).
  const SUPA_TABELAS = {
    clients:'clientes', orders:'ordens_servico', appointments:'agendamentos', products:'produtos', builds:'etiquetas',
    orcamentos:'orcamentos', promocoes:'promocoes', despesas:'despesas', diagnosticos:'diagnosticos',
    devolucoes:'devolucoes', devolucoesFornecedor:'devolucoes_fornecedor', dividas:'dividas',
  };
  const supaTxt = (v)=> (v===undefined || v===null || v==='') ? null : String(v);
  const SUPA_COLUNAS = {
    clients: r=>({nome:supaTxt(r.nome), telefone:supaTxt(r.telefone), cpf_cnpj:supaTxt(r.cpfCnpj), email:supaTxt(r.email)}),
    orders: r=>({os_number:supaTxt(r.osNumber), client_id:supaTxt(r.clientId), status:supaTxt(r.status), data_os:supaTxt(r.dataISO)}),
    orcamentos: r=>({numero:supaTxt(r.numero), client_id:supaTxt(r.clientId), status:supaTxt(r.status)}),
    appointments: r=>({client_id:supaTxt(r.clientId), status:supaTxt(r.status), data_agendamento:supaTxt(r.data)}),
    diagnosticos: r=>({client_id:supaTxt(r.clientId)}),
  };
  const supaFetch = async (cred, caminho, opts={})=>{
    const r = await fetch(`${cred.url}/rest/v1/${caminho}`, {...opts, headers:{'apikey':cred.key,'Authorization':`Bearer ${cred.token}`,'Content-Type':'application/json', ...(opts.headers||{})}});
    if(!r.ok){
      let det=''; try{ const j=await r.json(); det = j.message || j.hint || ''; }catch(_){}
      throw new Error(`Resposta ${r.status} do Supabase${det ? ': '+det : ''}`);
    }
    return r;
  };
  const supaLerTudo = async (cred, tabela, colunas)=>{
    const out=[]; const PAG=1000;
    for(let ini=0; ; ini+=PAG){
      const r = await supaFetch(cred, `${tabela}?select=${colunas}&order=id`, {headers:{'Range-Unit':'items','Range':`${ini}-${ini+PAG-1}`}});
      const lote = await r.json();
      out.push(...lote);
      if(lote.length<PAG) break;
    }
    return out;
  };
  const supaEnviarEstado = async (cred, estado, tombs)=>{
    const agora = new Date().toISOString();
    let total=0;
    const porTabela = [];
    for(const [chave, tabela] of Object.entries(SUPA_TABELAS)){
      const lista = (estado[chave]||[]).filter(r=>r && r.id!==undefined && r.id!==null);
      const extra = SUPA_COLUNAS[chave];
      for(let k=0; k<lista.length; k+=100){
        const lote = lista.slice(k,k+100).map(r=>({user_id:cred.userId, id:String(r.id), data:r, atualizado_em:agora, ...(extra ? extra(r) : {})}));
        await supaFetch(cred, `${tabela}?on_conflict=user_id,id`, {method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(lote)});
      }
      total += lista.length;
      if(lista.length) porTabela.push(`${tabela}: ${lista.length}`);
    }
    supaEnviarEstado.ultimoResumo = porTabela.join(' · ') || 'nenhum registro (as listas daqui estão vazias)';
    const tlist = (tombs||[]).filter(t=>t && t.id!==undefined && t.tipo);
    for(let k=0; k<tlist.length; k+=200){
      const lote = tlist.slice(k,k+200).map(t=>({user_id:cred.userId, tipo:String(t.tipo), id:String(t.id), data:t, apagado_em:t.deletedAt||agora}));
      await supaFetch(cred, `registros_apagados?on_conflict=user_id,tipo,id`, {method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(lote)});
    }
    // o que foi apagado aqui some das tabelas também
    for(const [chave, tabela] of Object.entries(SUPA_TABELAS)){
      const ids = tlist.filter(t=>t.tipo===chave).map(t=>String(t.id));
      for(let k=0; k<ids.length; k+=50){
        const lista = ids.slice(k,k+50).map(x=>`"${x.replace(/"/g,'')}"`).join(',');
        await supaFetch(cred, `${tabela}?id=in.(${encodeURIComponent(lista)})`, {method:'DELETE'});
      }
    }
    return total;
  };
  // Mesclagem em 3 vias: compara o registro daqui, o da nuvem e o da última sincronização.
  // Só a nuvem mudou → pega o da nuvem. Só aqui mudou → fica o daqui. Os dois mudaram → fica o daqui.
  const mesclarArrayPorId3 = (local, nuvem, idsApagados, base)=>{
    const porId = new Map();
    (nuvem||[]).forEach(i=> i && i.id && !idsApagados.has(i.id) && porId.set(i.id, i));
    let conflitos = 0, atualizadosDaNuvem = 0;
    (local||[]).forEach(item=>{
      if(!item || !item.id || idsApagados.has(item.id)) return;
      const c = porId.get(item.id);
      if(!c){ porId.set(item.id, item); return; }
      const hl = supaHash(item), hc = supaHash(c);
      if(hl===hc){ porId.set(item.id, item); return; }
      const hb = base ? base[String(item.id)] : undefined;
      if(hb!==undefined && hl===hb){ atualizadosDaNuvem++; return; }      // só a nuvem mudou
      if(hb!==undefined && hc===hb){ porId.set(item.id, item); return; }  // só aqui mudou
      conflitos++; porId.set(item.id, item);                              // os dois mudaram
    });
    return {merged: Array.from(porId.values()), conflitos, atualizadosDaNuvem};
  };
  const enviarBackupSupabase = async ()=>{
    setSyncStatusSupa({loading:true, msg:''});
    try{
      const cred = await supaEntrar();
      const estadoLocal = {clients, orders, appointments, products, builds, orcamentos, promocoes, despesas, diagnosticos, devolucoes, devolucoesFornecedor, dividas};
      const total = await supaEnviarEstado(cred, estadoLocal, tombstones);
      supaSalvarBase(estadoLocal);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      setSyncStatusSupa({loading:false, msg:`${total>0 ? '✔' : '⚠️'} Enviado pro Supabase: ${total} registro(s). (${supaEnviarEstado.ultimoResumo})`});
    }catch(e){
      setSyncStatusSupa({loading:false, msg:'✕ Não deu pra enviar (' + (e.message||'erro desconhecido') + ').'});
    }
  };
  const mesclarComSupabase = async ()=>{
    setSyncStatusSupa({loading:true, msg:''});
    try{
      const cred = await supaEntrar();
      const baseSupa = supaLerBase();
      const doServidor = {};
      let temAlgo = false;
      for(const [chave, tabela] of Object.entries(SUPA_TABELAS)){
        const linhas = await supaLerTudo(cred, tabela, 'data');
        doServidor[chave] = linhas.map(l=>l.data).filter(Boolean);
        if(linhas.length) temAlgo = true;
      }
      const apag = await supaLerTudo(cred, 'registros_apagados', 'data');
      doServidor.tombstones = apag.map(l=>l.data).filter(Boolean);
      if(apag.length) temAlgo = true;
      if(!temAlgo){
        const estadoLocal0 = {clients, orders, appointments, products, builds, orcamentos, promocoes, despesas, diagnosticos, devolucoes, devolucoesFornecedor, dividas};
        const total = await supaEnviarEstado(cred, estadoLocal0, tombstones);
        supaSalvarBase(estadoLocal0);
        setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
        setSyncStatusSupa({loading:false, msg:`✔ O Supabase estava vazio — enviei os dados daqui (${total} registro(s)).`});
        return;
      }
      const tombstonesUnificados = mesclarTombstones(tombstones, doServidor.tombstones);
      const idsApagadosPorTipo = {};
      tombstonesUnificados.forEach(t=>{
        if(!idsApagadosPorTipo[t.tipo]) idsApagadosPorTipo[t.tipo] = new Set();
        idsApagadosPorTipo[t.tipo].add(t.id);
      });
      const idsVazios = new Set();

      const camposParaMesclar = [
        {chave:'clients', label:'clientes', local:clients, set:setClients},
        {chave:'orders', label:'ordens de serviço', local:orders, set:setOrders},
        {chave:'appointments', label:'agendamentos', local:appointments, set:setAppointments},
        {chave:'products', label:'produtos', local:products, set:setProducts},
        {chave:'builds', label:'etiquetas', local:builds, set:setBuilds},
        {chave:'orcamentos', label:'orçamentos', local:orcamentos, set:setOrcamentos},
        {chave:'promocoes', label:'promoções', local:promocoes, set:setPromocoes},
        {chave:'despesas', label:'despesas', local:despesas, set:setDespesas},
        {chave:'diagnosticos', label:'diagnósticos', local:diagnosticos, set:setDiagnosticos},
        {chave:'devolucoes', label:'devoluções (cliente)', local:devolucoes, set:setDevolucoes},
        {chave:'devolucoesFornecedor', label:'devoluções (fornecedor)', local:devolucoesFornecedor, set:setDevolucoesFornecedor},
        {chave:'dividas', label:'dívidas', local:dividas, set:setDividas},
      ];

      let totalAdicionados = 0, totalConflitos = 0;
      const resumoPorTipo = [];
      const novoBackupCompleto = {};
      camposParaMesclar.forEach(({chave, label, local, set})=>{
        const doServidorArr = doServidor[chave] || [];
        const idsApagados = idsApagadosPorTipo[chave] || idsVazios;
        const { merged, conflitos, atualizadosDaNuvem } = mesclarArrayPorId3(local, doServidorArr, idsApagados, baseSupa[chave]);
        const idsLocais = new Set((local||[]).map(i=>i && i.id));
        const adicionados = merged.filter(i=> i && i.id && !idsLocais.has(i.id)).length;
        if(adicionados>0 || conflitos>0 || atualizadosDaNuvem>0){
          resumoPorTipo.push(`${label}: +${adicionados} novo(s)${atualizadosDaNuvem>0 ? `, ${atualizadosDaNuvem} atualizado(s) da nuvem` : ''}${conflitos>0 ? `, ${conflitos} em conflito (mantida a versão daqui)` : ''}`);
        }
        totalAdicionados += adicionados + atualizadosDaNuvem;
        totalConflitos += conflitos;
        set(merged);
        novoBackupCompleto[chave] = merged;
      });
      setTombstones(tombstonesUnificados);

      const totalEnviados = await supaEnviarEstado(cred, novoBackupCompleto, tombstonesUnificados);
      const resumoEnviado = supaEnviarEstado.ultimoResumo;
      supaSalvarBase(novoBackupCompleto);
      setConfig(prev=>({...prev, lastBackupAt:new Date().toISOString()}));
      const resumoTexto = resumoPorTipo.length>0 ? resumoPorTipo.join(' · ') : 'Nada novo pra trazer — os dois lados já estavam iguais.';
      setSyncStatusSupa({loading:false, msg:`✔ Mesclado! ${totalAdicionados} registro(s) trazido(s)/atualizado(s) do Supabase.${totalConflitos>0 ? ` ⚠️ ${totalConflitos} registro(s) mudaram nos dois aparelhos desde a última sincronização — mantive a versão daqui.` : ''} (${resumoTexto}) · Enviei ${totalEnviados} registro(s) pra nuvem: ${resumoEnviado}`});
    }catch(e){
      setSyncStatusSupa({loading:false, msg:'✕ Não deu pra mesclar (' + (e.message||'erro desconhecido') + ').'});
    }
  };
  const apagarBackupSupabase = async ()=>{
    if(!confirm('Isso apaga TODOS os dados salvos no Supabase (clientes, ordens de serviço, orçamentos...). Os dados aqui no aparelho continuam intactos. Confirma?')) return;
    setSyncStatusSupa({loading:true, msg:''});
    try{
      const cred = await supaEntrar();
      for(const tabela of [...Object.values(SUPA_TABELAS), 'registros_apagados']){
        await supaFetch(cred, `${tabela}?user_id=eq.${cred.userId}`, {method:'DELETE'});
      }
      setSyncStatusSupa({loading:false, msg:'✔ Dados apagados do Supabase. Os dados daqui continuam intactos.'});
    }catch(e){
      setSyncStatusSupa({loading:false, msg:'✕ Não deu pra apagar (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // Ao entrar no programa (já logado), junta o que tem na nuvem com o que tem aqui e devolve —
  // uma vez só por abertura, sem janelinhas de erro (se falhar, só aparece no cartão do Supabase).
  const mesclarSupaRef = useRef(null);
  mesclarSupaRef.current = mesclarComSupabase;
  const autoSyncLoginFeitoRef = useRef(false);
  useEffect(()=>{
    if(!loaded || autoSyncLoginFeitoRef.current) return;
    if(!supaLerSessao()) return;
    autoSyncLoginFeitoRef.current = true;
    const t = setTimeout(()=>{
      if(navigator.onLine===false) return;
      if(mesclarSupaRef.current) mesclarSupaRef.current();
    }, 1500);
    return ()=>clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // Salva a escolha do tema sazonal do portal (ou "automático", pra voltar a detectar pela
  // data sozinho) — sobe um arquivinho pequeno de configuração pro mesmo repositório do
  // GitHub usado pro backup em nuvem, que o portal do cliente lê antes de aplicar as cores.
  const salvarTemaManualPortal = async (temaId)=>{
    const owner = (config.githubOwner||'').trim();
    const repo = (config.githubRepo||'').trim();
    const token = (config.githubToken||'').trim();
    if(!owner || !repo || !token){
      alert('Configura o GitHub do portal do cliente primeiro (gera um link de acompanhamento pra algum cliente, que é onde essa configuração fica salva) — o tema usa o mesmo repositório do portal.');
      return;
    }
    setSyncStatusTema({loading:true, msg:''});
    try{
      const conteudo = JSON.stringify({temaForcado: temaId || null});
      const base64 = btoa(unescape(encodeURIComponent(conteudo)));
      await subirArquivoGithub(owner, repo, token, 'config/tema.json', base64, 'Atualiza tema do portal');
      setConfig(prev=>({...prev, temaPortalManual: temaId || ''}));
      setSyncStatusTema({loading:false, msg: temaId ? '✔ Tema fixado! O portal vai usar esse tema até você trocar de novo.' : '✔ Voltou pro automático — o portal detecta o tema certo sozinho, pela data.'});
    }catch(e){
      setSyncStatusTema({loading:false, msg:'✕ Não deu pra salvar (' + (e.message||'erro desconhecido') + ').'});
    }
  };

  // Pede permissão de notificação uma vez, ao abrir o app pela primeira vez (só dentro do app
  // instalado — no navegador isso não existe/não faz sentido). Sem essa permissão, os lembretes
  // de agendamento não conseguem aparecer, então vale pedir logo de cara.
  const permissaoNotifPedida = useRef(false);
  useEffect(()=>{
    if(!loaded) return;
    if(permissaoNotifPedida.current) return;
    permissaoNotifPedida.current = true;
    const capacitor = window.Capacitor;
    if(!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) return;
    const LocalNotifications = capacitor.Plugins && capacitor.Plugins.LocalNotifications;
    if(!LocalNotifications) return;
    LocalNotifications.requestPermissions().catch(()=>{});
  }, [loaded]);

  // Botão/gesto de "voltar" do Android: sem isso, o Android simplesmente FECHA o app direto,
  // mesmo estando em alguma tela lá dentro (bem chato, força fechar tudo sem querer). Agora:
  // 1º toque, se não estiver na tela inicial → volta pra tela inicial (não fecha nada)
  // 1º toque, já na tela inicial → mostra aviso "toque de novo pra sair"
  // 2º toque rápido (menos de 2 segundos), na tela inicial → aí sim fecha o app de verdade
  //
  // IMPORTANTE: registra o "ouvinte" só UMA VEZ (não a cada troca de aba) — usa uma "gaveta"
  // (ref) pra sempre ler a aba mais atual sem precisar registrar de novo toda hora. Registrar
  // de novo a cada clique era frágil e podia travar a troca de abas se desse algum problema.
  // Tudo dentro de try/catch também, pra nunca travar o resto do app por causa dessa parte.
  const ultimoToqueVoltar = useRef(0);
  const tabAtualRef = useRef(tab);
  useEffect(()=>{ tabAtualRef.current = tab; }, [tab]);

  useEffect(()=>{
    let handleRegistrado = null;
    let cancelado = false;
    try{
      const capacitor = window.Capacitor;
      if(!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) return;
      const AppPlugin = capacitor.Plugins && capacitor.Plugins.App;
      if(!AppPlugin) return;

      AppPlugin.addListener('backButton', ()=>{
        try{
          if(tabAtualRef.current !== 'inicio'){
            setTab('inicio');
            return;
          }
          const agora = Date.now();
          if(agora - ultimoToqueVoltar.current < 2000){
            AppPlugin.exitApp();
          } else {
            ultimoToqueVoltar.current = agora;
            setAvisoSairApp(true);
            setTimeout(()=>setAvisoSairApp(false), 2000);
          }
        }catch(e){ /* nunca deixa isso travar o app */ }
      }).then(handle=>{
        if(cancelado) handle.remove().catch(()=>{});
        else handleRegistrado = handle;
      }).catch(()=>{});
    }catch(e){ /* plugin indisponível ou com problema — segue sem essa função, sem travar nada */ }

    return ()=>{
      cancelado = true;
      if(handleRegistrado) handleRegistrado.remove().catch(()=>{});
    };
  }, []);

  // Mesclagem automática ao abrir o app — DESATIVADA a pedido, mesmo motivo da de cima.
  const mesclagemInicialFeita = useRef(false);
  useEffect(()=>{
    return; // desativado — não mescla mais sozinho ao abrir
    if(!loaded) return;
    if(mesclagemInicialFeita.current) return;
    mesclagemInicialFeita.current = true;
    if(!config.githubBackupOwner || !config.githubBackupRepo || !config.githubBackupToken) return;
    (async ()=>{
      try{
        const r = await executarMesclagem();
        if(!r.ok || r.semDados) return;
        if(r.totalAdicionadosDaNuvem>0 || r.totalConflitos>0){
          setAutoSyncMsg({tipo: r.totalConflitos===0 ? 'sucesso' : 'atencao', texto: `☁️ Atualizado ao abrir: +${r.totalAdicionadosDaNuvem} da nuvem${r.totalConflitos>0 ? `, ⚠️ ${r.totalConflitos} conflito(s) — confira na aba Backup` : ''}.`});
          setTimeout(()=>setAutoSyncMsg(null), 8000);
        }
      }catch(e){
        setAutoSyncMsg({tipo:'erro', texto:'✕ Não deu pra sincronizar com a nuvem ao abrir: ' + (e.message||'sem conexão') + '.'});
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  const exportBackup = async (evento)=>{
    const botao = evento && evento.currentTarget;
    const textoOriginal = botao ? botao.textContent : '';
    if(botao){
      botao.disabled = true;
      botao.textContent = '⏳ Gerando backup...';
      botao.style.opacity = '0.7';
    }
    const backup = {
      version:1, exportedAt:new Date().toISOString(),
      clients, orders, appointments, products, builds, orcamentos, promocoes, despesas, diagnosticos, devolucoes, devolucoesFornecedor, dividas, config, tombstones
    };
    const stamp = timestampArquivo();
    const nomeArquivo = `lontrahelp-backup-${stamp}.json`;
    const jsonTexto = JSON.stringify(backup, null, 2);
    const capacitor = window.Capacitor;
    const ehNativo = capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform();

    try{
      if(!ehNativo){
        // Navegador/desktop: o download comum funciona normal aqui.
        const blob = new Blob([jsonTexto], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
      } else {
        // App Android nativo: o clique de download comum não funciona dentro do WebView do app
        // instalado (mesmo problema que já resolvemos pro PDF) — salva o arquivo de verdade e
        // abre a caixa de compartilhar/salvar do Android.
        if(botao) botao.textContent = '⏳ Preparando compartilhamento...';
        const Filesystem = capacitor.Plugins && capacitor.Plugins.Filesystem;
        const Share = capacitor.Plugins && capacitor.Plugins.Share;
        if(!Filesystem || !Share) throw new Error('Plugins Filesystem/Share não encontrados — precisa instalar e sincronizar (veja o README do app mobile).');
        const base64Data = btoa(unescape(encodeURIComponent(jsonTexto)));
        const salvo = await Filesystem.writeFile({
          path: nomeArquivo,
          data: base64Data,
          directory: 'CACHE',
        });
        await Share.share({
          title: nomeArquivo,
          url: salvo.uri,
          dialogTitle: 'Salvar/compartilhar backup',
        });
      }

    const receitaTotal = orders.reduce((s,o)=>s+orderValorJaRecebido(o),0);

        'OS gerada': o.osId?'Sim':'Não', 'De diagnóstico': o.diagnosticoOrigemId?'Sim':'Não',
      };
    });
    addSheet(orcRows.length?orcRows:[{'Número':'Nenhum orçamento registrado'}], 'Orçamentos');

    const clientRows = clients.map(c=>({
      'Nome': c.nome, 'Telefone': c.telefone||'', 'CPF/CNPJ': c.cpfCnpj||'', 'E-mail': c.email||'',
      'Rua': c.rua||'', 'Número': c.numero||'', 'Bairro': c.bairro||'', 'Cidade': c.cidade||'', 'UF': c.uf||'', 'CEP': c.cep||'',

    }));

      'Descrição': d.descricao, 'Categoria': d.categoria, 'Valor (R$)': parseFloat(d.valor)||0, 'Data': formatDateBR(d.dataISO),
    }));
    addSheet(despesaRows.length?despesaRows:[{'Descrição':'Nenhuma despesa registrada'}], 'Despesas');

          'Fornecedor': it.fornecedor||'', 'Garantia Fornecedor': it.garantiaFornecedor||'',

    const buffer = await wb.xlsx.writeBuffer();
    const nomeArquivo = `lontrahelp-relatorio-${timestampArquivo()}.xlsx`;
    const capacitor = window.Capacitor;
    const ehNativo = capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform();

    if(!ehNativo){
      // Navegador/desktop: o download comum funciona normal aqui.
      const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    } else {
      // App Android nativo: o clique de download comum não funciona dentro do WebView do app
      // instalado (mesmo problema que já resolvemos pro backup em JSON) — salva o arquivo de
      // verdade e abre a caixa de compartilhar/salvar do Android.
      const Filesystem = capacitor.Plugins && capacitor.Plugins.Filesystem;
      const Share = capacitor.Plugins && capacitor.Plugins.Share;
      if(!Filesystem || !Share){
        alert('Plugins Filesystem/Share não encontrados — precisa instalar e sincronizar (veja o README do app mobile).');
        return;
      }
      // O Excel é um arquivo BINÁRIO (não texto), então a conversão pra base64 é diferente do
      // backup em JSON — precisa passar byte a byte, não dá pra usar btoa(texto) direto.
      const bytes = new Uint8Array(buffer);
      let binario = '';
      for(let i=0; i<bytes.length; i++) binario += String.fromCharCode(bytes[i]);
      const base64Data = btoa(binario);
      try{
        const salvo = await Filesystem.writeFile({ path: nomeArquivo, data: base64Data, directory: 'CACHE' });
        await Share.share({ title: nomeArquivo, url: salvo.uri, dialogTitle: 'Salvar/compartilhar relatório em Excel' });
      }catch(e){
        alert('Não consegui compartilhar o arquivo (' + (e.message||'erro desconhecido') + ').');
      }
    }

  const importBackup = (file)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{

        const data = JSON.parse(e.target.result);
        if(!confirm('Restaurar este backup? Isso vai SUBSTITUIR TODOS os dados atuais do sistema (clientes, OS, agendamentos, produtos, etiquetas e orçamentos) pelos dados desse arquivo. Se você tem coisas novas aqui que não estão nesse arquivo, elas serão perdidas. Se a ideia é levar dados do celular pro computador (ou vice-versa) sem perder nada, use "🔀 Mesclar arquivo de backup" em vez desse botão.')) return;
        if(Array.isArray(data.clients)) setClients(data.clients);
        if(Array.isArray(data.orders)) setOrders(data.orders);
        if(Array.isArray(data.appointments)) setAppointments(data.appointments);
        if(Array.isArray(data.products)) setProducts(data.products);
        if(Array.isArray(data.builds)) setBuilds(data.builds);
        if(Array.isArray(data.orcamentos)) setOrcamentos(data.orcamentos);
        if(Array.isArray(data.promocoes)) setPromocoes(data.promocoes);
        if(Array.isArray(data.despesas)) setDespesas(data.despesas);
        if(Array.isArray(data.diagnosticos)) setDiagnosticos(data.diagnosticos);
        if(Array.isArray(data.devolucoes)) setDevolucoes(data.devolucoes);
        if(Array.isArray(data.devolucoesFornecedor)) setDevolucoesFornecedor(data.devolucoesFornecedor);
        if(Array.isArray(data.dividas)) setDividas(data.dividas);
        if(Array.isArray(data.tombstones)) setTombstones(data.tombstones);
        if(data.config) setConfig(data.config);
        alert('Backup restaurado com sucesso!');
      }catch(err){
        alert('Não foi possível ler esse arquivo. Verifique se é um backup válido do LontraHelp (.json).');
      }
    };
    reader.readAsText(file);
  };

  // Mescla um arquivo de backup local (de outro aparelho) com o que já está aqui — em vez de
  // substituir tudo, junta os dados novos dos dois lados, sem perder nada. É a mesma lógica
  // (inclusive respeitando exclusões já feitas) usada na mesclagem com a nuvem, só que a fonte
  // dos dados é um arquivo escolhido na hora, em vez do GitHub. Serve pra levar dados do celular
  // pro computador (ou vice-versa) manualmente, sem depender de internet nem de nuvem nenhuma.
  const mesclarArquivoLocal = (file)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        mesclarTextoRecebido(e.target.result, 'arquivo');
      }catch(err){
        alert('Não foi possível ler esse arquivo. Verifique se é um backup válido do LontraHelp (.json).');
      }
    };
    reader.readAsText(file);
  };

  // Núcleo compartilhado da mesclagem de texto — usado tanto pelo arquivo local (acima) quanto
  // pelo texto remontado a partir dos pedaços escaneados via QR Code.
  const mesclarTextoRecebido = (texto, origem)=>{
    try{
      const dadosArquivo = JSON.parse(texto);
      const tombstonesUnificados = mesclarTombstones(tombstones, dadosArquivo.tombstones);
      const idsApagadosPorTipo = {};
      tombstonesUnificados.forEach(t=>{
        if(!idsApagadosPorTipo[t.tipo]) idsApagadosPorTipo[t.tipo] = new Set();
        idsApagadosPorTipo[t.tipo].add(t.id);
      });
      const idsVazios = new Set();

      const camposParaMesclar = [
        {chave:'clients', label:'Clientes', local:clients, set:setClients},
        {chave:'orders', label:'Ordens de serviço', local:orders, set:setOrders},
        {chave:'appointments', label:'Agendamentos', local:appointments, set:setAppointments},
        {chave:'products', label:'Produtos', local:products, set:setProducts},
        {chave:'builds', label:'Etiquetas', local:builds, set:setBuilds},
        {chave:'orcamentos', label:'Orçamentos', local:orcamentos, set:setOrcamentos},
        {chave:'promocoes', label:'Promoções', local:promocoes, set:setPromocoes},
        {chave:'despesas', label:'Despesas', local:despesas, set:setDespesas},
        {chave:'diagnosticos', label:'Diagnósticos', local:diagnosticos, set:setDiagnosticos},
        {chave:'devolucoes', label:'Devoluções (cliente)', local:devolucoes, set:setDevolucoes},
        {chave:'devolucoesFornecedor', label:'Devoluções (fornecedor)', local:devolucoesFornecedor, set:setDevolucoesFornecedor},
        {chave:'dividas', label:'Dívidas', local:dividas, set:setDividas},
      ];

      let totalAdicionados = 0, totalConflitos = 0;
      const resumoPorTipo = [];
      camposParaMesclar.forEach(({chave, label, local, set})=>{
        const doArquivo = dadosArquivo[chave] || [];
        const idsApagados = idsApagadosPorTipo[chave] || idsVazios;
        const { merged, conflitos } = mesclarArrayPorId(local, doArquivo, idsApagados);
        const idsLocais = new Set((local||[]).map(i=>i && i.id));
        const adicionados = merged.filter(i=> i && i.id && !idsLocais.has(i.id)).length;
        if(adicionados>0 || conflitos>0){
          resumoPorTipo.push(`${label}: +${adicionados} novo(s)${conflitos>0 ? `, ${conflitos} em conflito (mantida a versão daqui)` : ''}`);
        }
        totalAdicionados += adicionados;
        totalConflitos += conflitos;
        set(merged);
      });
      setTombstones(tombstonesUnificados);

      const resumoTexto = resumoPorTipo.length>0 ? '\n\n' + resumoPorTipo.join('\n') : '\n\nNada novo pra trazer — os dois lados já estavam iguais.';
      const origemTexto = origem==='qrcode' ? 'do QR Code' : 'do arquivo';
