// ---------- Login com Supabase (e-mail + senha, "lembrar de mim", código por e-mail depois de sair) ----------
// Comparação "de verdade" entre registros: ignora a ordem dos campos (o banco reordena) e
// guarda uma impressão digital do que foi sincronizado por último, pra saber QUEM mudou o quê.
const supaCanon = (v)=> JSON.stringify(v, (k,val)=> (val && typeof val==='object' && !Array.isArray(val)) ? Object.keys(val).sort().reduce((o,kk)=>{ o[kk]=val[kk]; return o; },{}) : val);
const supaHash = (v)=>{ const t = supaCanon(v); let h = 5381; for(let i=0;i<t.length;i++){ h = ((h<<5)+h+t.charCodeAt(i))|0; } return t.length+':'+h; };
function supaLerBase(){ try{ return JSON.parse(localStorage.getItem('lh_supa_base')||'{}'); }catch(e){ return {}; } }
function supaSalvarBase(estado){
  const base = {};
  Object.keys(estado||{}).forEach(chave=>{
    if(!Array.isArray(estado[chave])) return;
    base[chave] = {};
    estado[chave].forEach(r=>{ if(r && r.id!==undefined && r.id!==null) base[chave][String(r.id)] = supaHash(r); });
  });
  try{ localStorage.setItem('lh_supa_base', JSON.stringify(base)); }catch(e){}
}
const SUPA_SESSAO_KEY = 'lh_supa_sessao';
const SUPA_OTP_KEY = 'lh_exigir_otp';
function supaLerSessao(){
  try{
    const r = localStorage.getItem(SUPA_SESSAO_KEY) || sessionStorage.getItem(SUPA_SESSAO_KEY);
    return r ? JSON.parse(r) : null;
  }catch(e){ return null; }
}
function supaSalvarSessao(j, lembrar){
  const dado = {
    access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in||3600)),
    userId: j.user && j.user.id, email: j.user && j.user.email,
  };
  try{ localStorage.removeItem(SUPA_SESSAO_KEY); sessionStorage.removeItem(SUPA_SESSAO_KEY); }catch(e){}
  try{ (lembrar ? localStorage : sessionStorage).setItem(SUPA_SESSAO_KEY, JSON.stringify(dado)); }catch(e){}
  return dado;
}
function supaLimparSessao(){
  try{ localStorage.removeItem(SUPA_SESSAO_KEY); sessionStorage.removeItem(SUPA_SESSAO_KEY); }catch(e){}
}
async function supaAuthPost(caminho, corpo, token){
  const r = await fetch(`${SUPABASE_URL_PADRAO}/auth/v1/${caminho}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_CHAVE_PADRAO, ...(token ? {'Authorization':`Bearer ${token}`} : {})},
    body: JSON.stringify(corpo||{}),
  });
  const j = await r.json().catch(()=>({}));
  return {ok:r.ok, status:r.status, j};
}
function supaMensagemErro(res, contexto){
  const j = res.j || {};
  const cod = j.error_code || j.code || '';
  const txt = (j.msg || j.message || j.error_description || '').toString();
  if(cod==='email_not_confirmed') return 'Confirma o e-mail primeiro (o link que chegou na sua caixa de entrada) e tenta de novo.';
  if(cod==='invalid_credentials') return 'E-mail ou senha incorretos.';
  if(cod==='over_email_send_rate_limit' || res.status===429) return 'Muitos e-mails enviados em pouco tempo. Espera um pouco (até 1 hora) e tenta de novo.';
  if(cod==='otp_expired' || /expired|invalid/i.test(txt) && contexto==='codigo') return 'Código errado ou vencido. Pede um novo.';
  if(contexto==='cadastro' && (/database error|saving new user|já existe uma conta/i.test(txt) || res.status===500)) return 'Já existe uma conta cadastrada. Só é permitida uma — entra com ela.';
  if(cod==='user_already_exists') return 'Esse e-mail já tem conta. Entra com ele.';
  if(cod==='weak_password') return 'Senha fraca demais. Usa pelo menos 6 caracteres.';
  if(cod==='otp_disabled' || /signups not allowed|user not found/i.test(txt)) return 'Não encontrei conta com esse e-mail.';
  return txt || `Erro ${res.status}`;
}
// Devolve uma sessão válida (renova sozinho quando está perto de vencer).
async function supaTokenValido(){
  const sess = supaLerSessao();
  if(!sess) throw new Error('Você não está conectado ao Supabase. Sai e entra de novo.');
  if(sess.expires_at && sess.expires_at - 60 > Math.floor(Date.now()/1000)) return sess;
  const lembrar = !!localStorage.getItem(SUPA_SESSAO_KEY);
  const res = await supaAuthPost('token?grant_type=refresh_token', {refresh_token: sess.refresh_token});
  if(!res.ok){
    const err = new Error('Sua sessão venceu. Sai e entra de novo.');
    err.authInvalida = true;
    throw err;
  }
  return supaSalvarSessao(res.j, lembrar);
}

function SupaLoginScreen({onEntrar}){
  const [modo, setModo] = useState('entrar'); // entrar | criar | codigo
  const [email, setEmail] = useState(()=>{ try{ return localStorage.getItem('lh_supa_ultimo_email') || ''; }catch(e){ return ''; } });
  const [senha, setSenha] = useState('');
  const [lembrar, setLembrar] = useState(true);
  const [codigo, setCodigo] = useState('');
  const [erro, setErro] = useState('');
  const [info, setInfo] = useState('');
  const [carregando, setCarregando] = useState(false);

  const concluir = (j)=>{
    supaSalvarSessao(j, lembrar);
    try{ localStorage.removeItem(SUPA_OTP_KEY); localStorage.setItem('lh_supa_ultimo_email', email.trim()); }catch(e){}
    onEntrar();
  };
  const semInternet = ()=> setErro('Sem conexão com a internet. Conecta e tenta de novo.');

  const enviarCodigo = async ()=>{
    const res = await supaAuthPost('otp', {email: email.trim(), create_user:false});
    if(!res.ok){ setErro(supaMensagemErro(res,'otp')); return false; }
    setModo('codigo'); setCodigo('');
    setInfo('Enviei um código pro seu e-mail. Digita ele abaixo.');
    return true;
  };

  const entrar = async ()=>{
    setErro(''); setInfo('');
    if(!email.trim() || !senha){ setErro('Preenche e-mail e senha.'); return; }
    setCarregando(true);
    try{
      const res = await supaAuthPost('token?grant_type=password', {email: email.trim(), password: senha});
      if(!res.ok){ setErro(supaMensagemErro(res,'login')); return; }
      let exigir = false;
      try{ exigir = localStorage.getItem(SUPA_OTP_KEY)==='1'; }catch(e){}
      if(exigir){ await enviarCodigo(); return; }  // depois de sair da conta, pede o código do e-mail
      concluir(res.j);
    }catch(e){ semInternet(); }
    finally{ setCarregando(false); }
  };

  const entrarComCodigoSomente = async ()=>{
    setErro(''); setInfo('');
    if(!email.trim()){ setErro('Digita o e-mail primeiro.'); return; }
    setCarregando(true);
    try{ await enviarCodigo(); }catch(e){ semInternet(); }
    finally{ setCarregando(false); }
  };

  const confirmarCodigo = async ()=>{
    setErro('');
    const c = codigo.replace(/\s/g,'');
    if(c.length<6){ setErro('Digita o código completo que chegou no e-mail.'); return; }
    setCarregando(true);
    try{
      const res = await supaAuthPost('verify', {type:'email', email: email.trim(), token: c});
      if(!res.ok){ setErro(supaMensagemErro(res,'codigo')); return; }
      concluir(res.j);
    }catch(e){ semInternet(); }
    finally{ setCarregando(false); }
  };

  const criarConta = async ()=>{
    setErro(''); setInfo('');
    if(!email.trim() || senha.length<6){ setErro('Preenche o e-mail e uma senha com pelo menos 6 caracteres.'); return; }
    setCarregando(true);
    try{
      const res = await supaAuthPost('signup', {email: email.trim(), password: senha});
      if(!res.ok){ setErro(supaMensagemErro(res,'cadastro')); return; }
      setModo('entrar');
      setInfo('Conta criada! Abre o e-mail que o Supabase mandou, toca no link de confirmação e depois volta aqui e entra. (Se a página do link der erro, tudo bem — a confirmação já valeu.)');
    }catch(e){ semInternet(); }
    finally{ setCarregando(false); }
  };

  const Enter = (fn)=> (e)=>{ if(e.key==='Enter') fn(); };

  return (
    <div className="login-screen">
      <div className="login-box">
        <img src={LOGO_SRC} alt="LontraHelp" className="login-logo" />
        <div className="login-brand">LONTRA<span className="help">HELP</span></div>
        <div className="login-sub">MONTAGEM E FORMATAÇÃO</div>
        {erro && <div className="login-error">{erro}</div>}
        {info && <div style={{background:'#E7F5EC', color:'var(--green-ok)', padding:'10px 12px', borderRadius:8, fontSize:12.5, lineHeight:1.5, marginBottom:12}}>{info}</div>}

        {modo==='codigo' ? (
          <React.Fragment>
            <div className="field-row"><div className="field">
              <label>Código do e-mail</label>
              <input inputMode="numeric" autoComplete="one-time-code" maxLength={10} value={codigo} onChange={e=>setCodigo(e.target.value)} onKeyDown={Enter(confirmarCodigo)} placeholder="000000" autoFocus />
            </div></div>
            <button className="btn btn-gold" style={{width:'100%', marginTop:6}} disabled={carregando} onClick={confirmarCodigo}>{carregando ? 'Verificando...' : 'Confirmar código'}</button>
            <button className="btn btn-outline" style={{width:'100%', marginTop:8}} disabled={carregando} onClick={entrarComCodigoSomente}>Mandar outro código</button>
            <button className="btn btn-outline btn-sm" style={{width:'100%', marginTop:8}} onClick={()=>{ setModo('entrar'); setErro(''); setInfo(''); }}>Voltar</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="field-row"><div className="field">
              <label>E-mail</label>
              <input type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={Enter(modo==='criar' ? criarConta : entrar)} autoFocus />
            </div></div>
            <div className="field-row"><div className="field">
              <label>Senha{modo==='criar' ? ' (mínimo 6 caracteres)' : ''}</label>
              <input type="password" autoComplete={modo==='criar' ? 'new-password' : 'current-password'} value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={Enter(modo==='criar' ? criarConta : entrar)} />
            </div></div>
            {modo==='entrar' && (
              <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13, color:'var(--ink-soft)', margin:'4px 0 12px', cursor:'pointer'}}>
                <input type="checkbox" checked={lembrar} onChange={e=>setLembrar(e.target.checked)} style={{width:'auto'}} />
                Lembrar de mim neste aparelho
              </label>
            )}
            {modo==='entrar' ? (
              <React.Fragment>
                <button className="btn btn-gold" style={{width:'100%'}} disabled={carregando} onClick={entrar}>{carregando ? 'Entrando...' : 'Entrar'}</button>
                <button className="btn btn-outline btn-sm" style={{width:'100%', marginTop:8}} disabled={carregando} onClick={entrarComCodigoSomente}>Esqueci a senha — entrar com código do e-mail</button>
                <button className="btn btn-outline btn-sm" style={{width:'100%', marginTop:8}} onClick={()=>{ setModo('criar'); setErro(''); setInfo(''); }}>Primeira vez? Criar conta</button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <button className="btn btn-gold" style={{width:'100%'}} disabled={carregando} onClick={criarConta}>{carregando ? 'Criando...' : 'Criar conta'}</button>
                <button className="btn btn-outline btn-sm" style={{width:'100%', marginTop:8}} onClick={()=>{ setModo('entrar'); setErro(''); setInfo(''); }}>Já tenho conta</button>
              </React.Fragment>
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function AuthGate(){
  const [logado, setLogado] = useState(()=> !!supaLerSessao());
  // Se já tem sessão guardada, tenta renovar em segundo plano. Sem internet continua entrando
  // normalmente (o sistema funciona offline); só volta pro login se o Supabase recusar a sessão.
  useEffect(()=>{
    if(!logado) return;
    supaTokenValido().catch(e=>{ if(e && e.authInvalida){ supaLimparSessao(); setLogado(false); } });
  }, [logado]);
  const sair = ()=>{
    const sess = supaLerSessao();
    if(sess && sess.access_token){ supaAuthPost('logout', {}, sess.access_token).catch(()=>{}); }
    supaLimparSessao();
    try{ localStorage.setItem(SUPA_OTP_KEY, '1'); localStorage.removeItem('lh_logged_in'); }catch(e){}
    setLogado(false);
  };
  if(!logado) return <SupaLoginScreen onEntrar={()=>setLogado(true)} />;
  return <App onLogout={sair} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
</script>
</body>
</html>
