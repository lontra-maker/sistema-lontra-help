// Monta os dados públicos (nome, ordens, status) daquele cliente — usados tanto na versão antiga
// (link "fotografia", com dados embutidos no próprio link) quanto na versão nova (dados salvos
// num arquivo no GitHub, buscados ao vivo pelo portal toda vez que o cliente abre o link).
function montarDadosAcompanhamento(client, history, appointments){
  const agendamentosCliente = (appointments||[]).filter(a=>a.clientId===client.id);
  // Só os ÚLTIMOS 4 dígitos do telefone vão pro link — nunca o número inteiro. Serve como uma
  // "senha simples" pra abrir o portal: quem tem o link mas não sabe o telefone do cliente não
  // consegue ver os dados, mesmo que o link vaze ou seja encaminhado sem querer.
  const telDigitos = (client.telefone||'').replace(/\D/g,'');
  const ultimosDigitos = telDigitos.slice(-4);
  return {
    c: client.nome,
    v4: ultimosDigitos, // "verificação, 4 dígitos" — checado no portal antes de mostrar qualquer coisa
    o: history.map(o => ({
      n: o.osNumber,
      s: o.status || 'em_andamento',
      d: o.dataISO,
      t: (o.observacoes && o.observacoes.trim() ? o.observacoes.trim().split('\n')[0].slice(0,90) : '') || o.equipamento || 'Serviço',
      v: orderUsaItens(o) ? computeOrderTotals(o).totalGeralLiquido : (parseFloat(o.valor)||0),
      eq: o.equipamento || '',
      assinado: !!o.assinaturaClienteDataUrl, // recibo só vale de verdade depois de assinado
      g: o.temGarantia===false ? null : {
        // A garantia só passa a valer de verdade quando a OS está CONCLUÍDA (equipamento
        // entregue de volta pro cliente). Se ainda não foi concluída, manda "pendente:true" em
        // vez de uma data de início — senão o portal mostraria a garantia como se já estivesse
        // contando, mesmo com o equipamento ainda na sua mão.
        pendente: !orderEhFaturado(o),
        inicio: orderEhFaturado(o) ? orderGarantiaInicio(o) : null,
        // Zera o tipo que não se aplica (ex: "só mão de obra" não deve contar dias de
        // software), pra não aparecer como se cobrisse algo que não foi combinado.
        fisica: (o.tipoGarantia||'ambos')!=='apenas_software' ? (parseInt(o.garantiaFisicaDias)||0) : 0,
        software: (o.tipoGarantia||'ambos')!=='apenas_maodeobra' ? (parseInt(o.garantiaSoftwareDias)||0) : 0,
      },
      h: (o.statusHistorico||[]).map(ev => ({s: ev.status, d: ev.data})),
    })),
    a: agendamentosCliente.map(a => ({
      t: a.titulo || 'Visita técnica',
      d: a.data,
      h: a.hora,
      l: a.local || '',
      s: a.status || 'agendado',
    })),
  };
}


// Versão "fotografia" antiga — os dados ficam codificados dentro do próprio link (depois do #,
// que o navegador nunca manda pro servidor). Simples, mas não atualiza sozinho.
function gerarLinkAcompanhamento(client, history, baseUrl){
  const json = JSON.stringify(montarDadosAcompanhamento(client, history));
  const b64 = btoa(unescape(encodeURIComponent(json)));
  const b64url = b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const baseLimpa = baseUrl.trim().replace(/\/+$/, '');
  return baseLimpa + '/#d=' + b64url;
}

// Versão "ao vivo" — salva os dados como um arquivo no repositório do GitHub (via API, direto do
// navegador, sem precisar de servidor no meio) e devolve um link FIXO e curto pra esse cliente.
// Toda vez que o link for aberto, o portal busca a versão MAIS RECENTE desse arquivo — então
// atualizar depois é só chamar essa mesma função de novo (o link do cliente não muda).
// Sobe um arquivo qualquer (texto ou binário, em base64) pro repositório do GitHub — cria se não
// existir, atualiza se já existir (buscando o "sha" da versão atual primeiro, que o GitHub exige
// pra sobrescrever). Reaproveitado tanto pro arquivo de dados (JSON) quanto pra cada PDF.
// Transforma o id do agendamento (texto) num número — o Capacitor exige um ID numérico pra
// cada notificação, pra dar pra cancelar/reagendar depois sabendo exatamente qual é qual.
function hashParaInt(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = ((hash<<5)-hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash) % 2000000000;
}

// Agenda dois lembretes locais pro compromisso — um na véspera (de manhã) e outro faltando
// 1 hora — direto no sistema operacional do celular, sem precisar de internet nem servidor
// nenhum. Só funciona dentro do app instalado (não no navegador). Reagendar substitui os
// lembretes antigos desse mesmo compromisso, então dá pra chamar de novo sempre que editar.
async function agendarNotificacoesAppt(appt, nomeCliente){
  const capacitor = window.Capacitor;
  if(!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) return;
  const LocalNotifications = capacitor.Plugins && capacitor.Plugins.LocalNotifications;
  if(!LocalNotifications) return;

  const idBase = hashParaInt(appt.id);
  const idDiaAntes = idBase*10 + 1;
  const idHoraAntes = idBase*10 + 2;

  try{ await LocalNotifications.cancel({notifications: [{id: idDiaAntes}, {id: idHoraAntes}]}); }catch(e){ /* nenhuma notificação anterior pra cancelar, tudo bem */ }

  if(appt.status !== 'agendado') return; // cancelado/concluído não precisa mais de lembrete

  const dataHora = new Date(`${appt.data}T${appt.hora}:00`);
  if(isNaN(dataHora.getTime()) || dataHora <= new Date()) return; // já passou, não agenda

  const notifications = [];
  const umDiaAntes = new Date(dataHora);
  umDiaAntes.setDate(umDiaAntes.getDate()-1);
  umDiaAntes.setHours(8,0,0,0);
  if(umDiaAntes > new Date()){
    notifications.push({
      id: idDiaAntes,
      title: '📅 Visita amanhã',
      body: `${appt.titulo || 'Visita técnica'}${nomeCliente ? ' — ' + nomeCliente : ''} às ${appt.hora}`,
      schedule: {at: umDiaAntes},
      smallIcon: 'ic_launcher',
    });
  }
  const umaHoraAntes = new Date(dataHora.getTime() - 60*60*1000);
  if(umaHoraAntes > new Date()){
    notifications.push({
      id: idHoraAntes,
      title: '⏰ Visita em 1 hora',
      body: `${appt.titulo || 'Visita técnica'}${nomeCliente ? ' — ' + nomeCliente : ''}${appt.local ? ' · ' + appt.local : ''}`,
      schedule: {at: umaHoraAntes},
      smallIcon: 'ic_launcher',
    });
  }
  if(notifications.length>0){
    try{ await LocalNotifications.schedule({notifications}); }catch(e){ console.error('Erro agendando notificação local:', e); }
  }
}

async function cancelarNotificacoesAppt(apptId){
  const capacitor = window.Capacitor;
  if(!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) return;
  const LocalNotifications = capacitor.Plugins && capacitor.Plugins.LocalNotifications;
  if(!LocalNotifications) return;
  const idBase = hashParaInt(apptId);
  try{ await LocalNotifications.cancel({notifications: [{id: idBase*10+1}, {id: idBase*10+2}]}); }catch(e){ /* tudo bem se não tinha nenhuma */ }
}

// ---------------- PORTAL CRIPTOGRAFADO (v4.13) ----------------
// O repositório do portal é PÚBLICO (exigência do GitHub Pages grátis), então tudo que sobe pra lá
// vai embaralhado com AES-256-GCM. Cada cliente tem um "portalId" (nome aleatório da pasta) e uma
// "portalKey" (a chave) — os dois guardados na ficha do cliente. A chave vai SÓ no link, depois
// do "#", parte que o navegador nunca manda pra servidor nenhum. Sem o link completo, quem abrir o
// repositório só vê arquivos com nomes aleatórios e conteúdo ilegível.
function bytesParaB64(bytes){
  let bin = '';
  const passo = 0x8000;
  for(let i=0; i<bytes.length; i+=passo) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+passo));
  return btoa(bin);
}
function bytesParaB64Url(bytes){ return bytesParaB64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlParaBytes(s){
  let b64 = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function portalCryptoDisponivel(){ return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues); }
function portalGerarSegredo(qtdBytes){ return bytesParaB64Url(crypto.getRandomValues(new Uint8Array(qtdBytes))); }
// Garante que o cliente tem id + chave do portal. Devolve {portalId, portalKey, portalK2, novo}.
// v4.14: a chave (portalKey) é dividida em duas partes — K1 vai no link, K2 fica no Supabase e só é
// entregue pela função "portal-acesso" depois que o cliente confirma o código do e-mail (ou, sem
// e-mail cadastrado, os 4 últimos números do telefone). K1 = portalKey XOR portalK2.
function portalGarantirChaves(client){
  if(client && client.portalId && client.portalKey && client.portalK2) return {portalId: client.portalId, portalKey: client.portalKey, portalK2: client.portalK2, novo:false};
  return {
    portalId: (client && client.portalId) || portalGerarSegredo(12),
    portalKey: (client && client.portalKey) || portalGerarSegredo(32),
    portalK2: portalGerarSegredo(32),
    novo:true,
  };
}
function portalXor(aB64, bB64){
  const a = b64UrlParaBytes(aB64), b = b64UrlParaBytes(bB64);
  const out = new Uint8Array(a.length);
  for(let i=0;i<a.length;i++) out[i] = a[i] ^ b[i];
  return bytesParaB64Url(out);
}
const PORTAL_FUNCAO_URL = `${SUPABASE_URL_PADRAO}/functions/v1/portal-acesso`;
// Grava/atualiza no Supabase o que a função de acesso precisa: K2, nome, e-mail e o "hash" dos 4
// últimos números do telefone (o número em si não vai). Só o dono logado consegue gravar (RLS).
async function portalRegistrarAcesso(client, portalId, portalK2){
  const sess = await supaTokenValido();
  const tel = String(client.telefone||'').replace(/\D/g,'');
  const tel4 = tel.length>=4 ? tel.slice(-4) : null;
  const sha = async (t)=> Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const email = String(client.email||'').trim();
  const corpo = {
    portal_id: portalId,
    k2: portalK2,
    nome: (client.nome||'').trim() || null,
    email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : null,
    tel4_hash: tel4 ? await sha(`${portalId}:${tel4}`) : null,
    atualizado_em: new Date().toISOString(),
  };
  const r = await fetch(`${SUPABASE_URL_PADRAO}/rest/v1/portal_acesso?on_conflict=portal_id`, {
    method:'POST',
    headers:{'apikey':SUPABASE_CHAVE_PADRAO, 'Authorization':`Bearer ${sess.access_token}`, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify(corpo),
  });
  if(!r.ok){
    let det=''; try{ const j=await r.json(); det = j.message||''; }catch(_){}
    throw new Error(`Não consegui registrar o acesso do portal no Supabase (${r.status}${det ? ': '+det : ''}).`);
  }
}
async function portalApagarAcessosOrfaos(idsValidos){
  const sess = await supaTokenValido();
  const lista = [...idsValidos].filter(id=>/^[A-Za-z0-9_-]+$/.test(id));
  if(lista.length===0) return; // nunca apaga tudo "por engano" (ex.: aparelho ainda sem os clientes sincronizados)
  const r = await fetch(`${SUPABASE_URL_PADRAO}/rest/v1/portal_acesso?portal_id=not.in.(${lista.join(',')})`, {
    method:'DELETE',
    headers:{'apikey':SUPABASE_CHAVE_PADRAO, 'Authorization':`Bearer ${sess.access_token}`, 'Prefer':'return=minimal'},
  });
  if(!r.ok) throw new Error(`Supabase ${r.status}`);
}
async function portalImportarChave(portalKey){
  return crypto.subtle.importKey('raw', b64UrlParaBytes(portalKey), {name:'AES-GCM'}, false, ['encrypt']);
}
// Cifra bytes → [iv de 12 bytes][texto cifrado + tag]. O portal faz o caminho inverso.
async function portalCifrar(chaveCrypto, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, chaveCrypto, bytes));
  const out = new Uint8Array(iv.length + ct.length);
  out.set(iv, 0); out.set(ct, iv.length);
  return out;
}
// Nome de arquivo estável mas impossível de adivinhar (depende da chave): mesmo documento → mesmo
// nome (o cache e a sobrescrita continuam funcionando), sem revelar id de OS, cliente ou tipo.
async function portalNomeArquivo(portalKey, caminhoLogico){
  const dig = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(portalKey + '|' + caminhoLogico)));
  return Array.from(dig.slice(0, 12)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function portalMontarLink(portalBaseUrl, portalId, portalKey, portalK2){
  const base = (portalBaseUrl||'').trim().replace(/\/+$/, '');
  return `${base}/?p=${encodeURIComponent(portalId)}#k=${portalXor(portalKey, portalK2)}`;
}

// Remove do repositório do portal tudo que estava SEM criptografia (pasta "dados/", do sistema
// antigo) e os arquivos criptografados de clientes que não existem mais. Com apagarHistorico,
// também reescreve o histórico do repositório num commit só — senão os arquivos antigos
// continuariam acessíveis pelos commits passados.
async function limparPortalAntigoGithub(owner, repo, token, idsValidos, apagarHistorico){
  const H = {'Authorization':`token ${token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  const api = `https://api.github.com/repos/${owner}/${repo}`;
  const j = async (r, ctx)=>{
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      if(r.status===401) throw new Error('Token do GitHub inválido ou expirado.');
      if(r.status===404) throw new Error('Repositório não encontrado (ou o token não tem acesso a ele).');
      if(r.status===403 || r.status===422) throw new Error((e.message||`Erro ${r.status}`) + ` (${ctx}) — o token precisa da permissão "Contents: Read and write" nesse repositório.`);
      throw new Error(e.message || `Erro ${r.status} (${ctx})`);
    }
    return r.json();
  };
  const info = await j(await fetch(api, {headers:H}), 'repositório');
  const branch = info.default_branch;
  const ref = await j(await fetch(`${api}/git/ref/heads/${branch}`, {headers:H}), 'branch');
  const commitAtual = await j(await fetch(`${api}/git/commits/${ref.object.sha}`, {headers:H}), 'commit');
  const arvore = await j(await fetch(`${api}/git/trees/${commitAtual.tree.sha}?recursive=1`, {headers:H}), 'lista de arquivos');
  if(arvore.truncated) throw new Error('O repositório tem arquivos demais pra listar de uma vez. Apaga a pasta "dados" pelo site do GitHub.');
  const ids = new Set(idsValidos||[]);
  const ehLixo = (path)=>{
    if(path==='dados' || path.startsWith('dados/')) return true;
    const m = path.match(/^p\/([^/.]+)(\.json|\/)/);
    return !!(m && !ids.has(m[1]));
  };
  const blobs = arvore.tree.filter(it=>it.type==='blob');
  const remover = blobs.filter(it=>ehLixo(it.path));
  if(remover.length===0 && !apagarHistorico) return {removidos:0, historico:false};
  let novaArvore;
  if(apagarHistorico){
    const manter = blobs.filter(it=>!ehLixo(it.path)).map(it=>({path:it.path, mode:it.mode, type:'blob', sha:it.sha}));
    novaArvore = await j(await fetch(`${api}/git/trees`, {method:'POST', headers:H, body:JSON.stringify({tree:manter})}), 'nova árvore');
  } else {
    novaArvore = await j(await fetch(`${api}/git/trees`, {method:'POST', headers:H, body:JSON.stringify({base_tree:commitAtual.tree.sha, tree:remover.map(it=>({path:it.path, mode:it.mode, type:'blob', sha:null}))})}), 'nova árvore');
  }
  const novo = await j(await fetch(`${api}/git/commits`, {method:'POST', headers:H, body:JSON.stringify({
    message: apagarHistorico ? 'Portal: recomeça o histórico (dados agora criptografados)' : 'Portal: remove dados antigos sem criptografia',
    tree: novaArvore.sha,
    parents: apagarHistorico ? [] : [ref.object.sha],
  })}), 'novo commit');
  await j(await fetch(`${api}/git/refs/heads/${branch}`, {method:'PATCH', headers:H, body:JSON.stringify({sha:novo.sha, force: !!apagarHistorico})}), 'atualizar branch');
  return {removidos: remover.length, historico: !!apagarHistorico};
}

async function subirArquivoGithub(owner, repo, token, path, conteudoBase64, mensagemCommit){
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  const buscarShaAtual = async ()=>{
    const getResp = await fetch(apiUrl, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if(getResp.ok){
      const info = await getResp.json();
      return info.sha;
    } else if(getResp.status !== 404){
      const erroInfo = await getResp.json().catch(()=>({}));
      throw new Error(erroInfo.message || `Erro ${getResp.status} verificando arquivo existente.`);
    }
    return null;
  };

  const tentarSalvar = async (sha)=>{
    return fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        message: mensagemCommit,
        content: conteudoBase64,
        ...(sha ? {sha} : {}),
      }),
    });
  };

  let sha = await buscarShaAtual();
  let putResp = await tentarSalvar(sha);

  // Se o GitHub reclamar que falta o "sha", é sinal de que o arquivo já existia mas a busca de
  // cima não pegou certo a tempo (pode acontecer se dois envios saírem quase juntos, ou por uma
  // pequena demora do GitHub em atualizar). Busca o sha de novo, na hora, e tenta mais uma vez —
  // se resolver sozinho, o usuário nem percebe que teve um perrengue.
  if(!putResp.ok){
    const erroInfo1 = await putResp.json().catch(()=>({}));
    const mensagemErro1 = erroInfo1.message || '';
    if(putResp.status===422 && /sha/i.test(mensagemErro1)){
      sha = await buscarShaAtual();
      putResp = await tentarSalvar(sha);
    } else {
      if(putResp.status===401) throw new Error('Token do GitHub inválido ou expirado.');
      if(putResp.status===404) throw new Error('Repositório não encontrado — confere o usuário e o nome do repositório.');
      throw new Error(mensagemErro1 || `Erro ${putResp.status} salvando "${path}" no GitHub.`);
    }
  }

  if(!putResp.ok){
    const erroInfo2 = await putResp.json().catch(()=>({}));
    if(putResp.status===401) throw new Error('Token do GitHub inválido ou expirado.');
    if(putResp.status===404) throw new Error('Repositório não encontrado — confere o usuário e o nome do repositório.');
    throw new Error(erroInfo2.message || `Erro ${putResp.status} salvando "${path}" no GitHub — tentei de novo automaticamente e não resolveu, pode ser algo mais sério.`);
  }
}

// Sobe VÁRIOS arquivos de uma vez só, num único commit (bem mais rápido que 1 por 1:
// são ~6 chamadas no total em vez de 2 por arquivo). Se algo falhar, quem chama usa o jeito antigo.
async function subirVariosArquivosGithub(owner, repo, token, arquivos, mensagem){
  const H = {'Authorization':`token ${token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  const api = `https://api.github.com/repos/${owner}/${repo}`;
  const j = async (r, ctx)=>{
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      const err = new Error(e.message || `Erro ${r.status} (${ctx})`);
      err.status = r.status;
      throw err;
    }
    return r.json();
  };
  const info = await j(await fetch(api, {headers:H}), 'repositório');
  const branch = info.default_branch;
  const ref = await j(await fetch(`${api}/git/ref/heads/${branch}`, {headers:H}), 'branch');
  const commitAtual = await j(await fetch(`${api}/git/commits/${ref.object.sha}`, {headers:H}), 'commit');
  const itens = [];
  let idx = 0;
  const trabalhador = async ()=>{
    while(idx < arquivos.length){
      const a = arquivos[idx++];
      const b = await j(await fetch(`${api}/git/blobs`, {method:'POST', headers:H, body:JSON.stringify({content:a.base64, encoding:'base64'})}), 'arquivo');
      itens.push({path:a.path, mode:'100644', type:'blob', sha:b.sha});
    }
  };
  await Promise.all([trabalhador(), trabalhador(), trabalhador(), trabalhador()]);
  const arvore = await j(await fetch(`${api}/git/trees`, {method:'POST', headers:H, body:JSON.stringify({base_tree:commitAtual.tree.sha, tree:itens})}), 'árvore');
  const novo = await j(await fetch(`${api}/git/commits`, {method:'POST', headers:H, body:JSON.stringify({message:mensagem, tree:arvore.sha, parents:[ref.object.sha]})}), 'novo commit');
  await j(await fetch(`${api}/git/refs/heads/${branch}`, {method:'PATCH', headers:H, body:JSON.stringify({sha:novo.sha})}), 'atualizar branch');
}

function pdfParaBase64(pdf){
  return pdf.output('datauristring').split(',')[1];
}

async function atualizarLinkAcompanhamentoAoVivo(client, history, orcamentos, diagnosticos, appointments, config, onProgresso){
  const owner = (config.githubOwner||'').trim();
  const repo = (config.githubRepo||'').trim();
  const token = (config.githubToken||'').trim();
  if(!owner || !repo || !token) throw new Error('Falta preencher usuário, repositório ou token do GitHub.');
  if(!portalCryptoDisponivel()) throw new Error('Esse aparelho não tem suporte a criptografia (WebCrypto). Atualiza o navegador/app e tenta de novo.');
  const {portalId, portalKey, portalK2} = portalGarantirChaves(client);
  // Primeiro registra o acesso no Supabase (é ele que entrega a 2ª metade da chave depois do
  // código) — se a sessão venceu, falha aqui, antes de gastar tempo gerando PDFs.
  await portalRegistrarAcesso(client, portalId, portalK2);
  const chaveCrypto = await portalImportarChave(portalKey);
  // A ficha completa do cliente NÃO entra no hash (tem as próprias chaves); só o que aparece nos PDFs.
  const {portalKey:_k, portalK2:_k2, portalId:_p, portalAtivo:_a, ...clienteParaHash} = client;

  // Pra cada OS: gera o PDF do Recibo sempre, e do Orçamento/Diagnóstico vinculados quando existirem
  // — e sobe cada um pro GitHub, guardando o caminho de cada arquivo pra colocar no JSON de dados.
  // PDFs novos/alterados vão pra esta lista e sobem TODOS juntos, num commit só, no final.
  // PDFs que não mudaram desde o último envio nem são gerados de novo (cache local).
  const arquivos = [];
  const cacheAntigo = (()=>{ try{ return JSON.parse(localStorage.getItem('lh_pdf_cache')||'{}'); }catch(e){ return {}; } })();
  const cachePendente = {};
  const hashTxt = (t)=>{ let h = 5381; for(let i=0;i<t.length;i++){ h = ((h<<5)+h+t.charCodeAt(i))|0; } return String(h); };
  const configEstavel = {};
  Object.keys(config||{}).forEach(k=>{
    const v = config[k];
    if(/token|At$|Sync|senha|supabase|backend|esp32|github|portal|tema/i.test(k)) return;
    if(typeof v==='string' || typeof v==='number' || typeof v==='boolean') configEstavel[k] = v;
  });
  const hashBase = APP_VERSION + JSON.stringify(clienteParaHash) + JSON.stringify(configEstavel);
  // "caminhoLogico" é só um rótulo interno (ex.: "<os>-recibo"); o arquivo de verdade vai pra
  // p/<portalId>/<nome aleatório>.bin, criptografado.
  const pdfDoc = async (caminhoLogico, fonte, View, props)=>{
    const path = `p/${portalId}/${await portalNomeArquivo(portalKey, caminhoLogico)}.bin`;
    const h = hashTxt(hashBase + JSON.stringify(fonte));
    const ck = `${owner}/${repo}/${path}`;
    cachePendente[ck] = h;
    if(cacheAntigo[ck]===h) return path;  // não mudou — já está lá no GitHub
    if(arquivos.some(x=>x.path===path)) return path;
    const pdf = await renderizarECapturarPdf(View, props);
    const cifrado = await portalCifrar(chaveCrypto, new Uint8Array(pdf.output('arraybuffer')));
    arquivos.push({path, base64: bytesParaB64(cifrado)});
    return path;
  };
  const ordensComDocs = [];
  const total = history.length;
  for(let i=0; i<history.length; i++){
    const order = history[i];
    if(onProgresso) onProgresso(i+1, total, order.osNumber);
    const docs = {};

    try{
      docs.recibo = await pdfDoc(`dados/${client.id}/${order.id}-recibo.pdf`, order, ReceiptView, {order, client, config});
    }catch(e){ console.error('Falha gerando recibo da OS', order.osNumber, e); }

    if(order.orcamentoOrigemId){
      const orc = orcamentos.find(o=>o.id===order.orcamentoOrigemId);
      if(orc){
        try{
          docs.orcamento = await pdfDoc(`dados/${client.id}/${order.id}-orcamento.pdf`, orc, OrcamentoView, {orc, client});
        }catch(e){ console.error('Falha gerando orçamento da OS', order.osNumber, e); }
      }
    }

    if(order.diagnosticoOrigemId){
      const diag = diagnosticos.find(d=>d.id===order.diagnosticoOrigemId);
      if(diag){
        try{
          docs.diagnostico = await pdfDoc(`dados/${client.id}/${order.id}-diagnostico.pdf`, diag, DiagnosticoView, {diag, client});
        }catch(e){ console.error('Falha gerando diagnóstico da OS', order.osNumber, e); }
      }
    }

    ordensComDocs.push({order, docs});
  }

  const dadosBase = montarDadosAcompanhamento(client, history, appointments);
  // Diagnósticos ainda "soltos" (equipamento em análise, sem orçamento gerado ainda) também
  // aparecem no portal — assim o cliente já vê que o aparelho está sendo analisado, o prazo
  // estimado, e a opção de acelerar com taxa adicional, mesmo antes de ter um valor fechado.
  const diagnosticosPendentes = (diagnosticos||[]).filter(d => d.clientId===client.id && !d.orcamentoId);
  // Orçamentos ainda "soltos" (o cliente ainda não aprovou pra virar Ordem de Serviço) também
  // aparecem — assim, mesmo sem ter virado uma OS ainda, o cliente já vê o valor proposto e o
  // status (em preparo, enviado, aguardando aprovação, ou recusado).
  const orcamentosPendentes = (orcamentos||[]).filter(o => o.clientId===client.id && !o.osId);

  // Gera e sobe o PDF de cada diagnóstico/orçamento SOLTO também (mesmo sem ainda ter virado
  // uma OS) — assim o cliente consegue baixar o PDF de cada um pelo portal, igual já acontece
  // com os documentos de uma OS.
  const diagArray = [];
  for(const d of diagnosticosPendentes){
    let docPath = null;
    try{
      docPath = await pdfDoc(`dados/${client.id}/diag-${d.id}.pdf`, d, DiagnosticoView, {diag:d, client});
    }catch(e){ console.error('Falha gerando PDF do diagnóstico', d.numero, e); docPath = null; }
    diagArray.push({
      numero: d.numero,
      data: d.dataISO,
      equipamento: d.equipamento || '',
      relato: (d.problemaRelatado || '').trim().slice(0, 200),
      prazo: d.prazoEntregaEstimado || null,
      temUrgencia: !!d.prioridade,
      taxaUrgencia: d.prioridade ? (parseFloat(d.taxaPrioridade)||0) : 0,
      docPath,
    });
  }

  const orcArray = [];
  for(const o of orcamentosPendentes){
    const totals = computeOrcTotals(o);
    // Se esse orçamento veio de um diagnóstico, traz as informações dele junto (equipamento,
    // relato do problema) — assim o cliente vê a "história completa": o que foi encontrado no
    // diagnóstico, e o orçamento montado a partir disso, tudo no mesmo lugar.
    const diagOrigem = o.diagnosticoOrigemId ? (diagnosticos||[]).find(d=>d.id===o.diagnosticoOrigemId) : null;
    let docPathOrc = null, docPathDiagOrigem = null;
    try{
      docPathOrc = await pdfDoc(`dados/${client.id}/orc-${o.id}.pdf`, o, OrcamentoView, {orc:o, client});
    }catch(e){ console.error('Falha gerando PDF do orçamento', o.numero, e); docPathOrc = null; }
    if(diagOrigem){
      try{
        docPathDiagOrigem = await pdfDoc(`dados/${client.id}/diag-${diagOrigem.id}.pdf`, diagOrigem, DiagnosticoView, {diag:diagOrigem, client});
      }catch(e){ console.error('Falha gerando PDF do diagnóstico de origem', diagOrigem.numero, e); docPathDiagOrigem = null; }
    }
    orcArray.push({
      numero: o.numero,
      data: o.dataISO,
      status: o.status || 'em_preparo',
      totalAVista: totals.totalAVista,
      totalParcelado: totals.totalParcelado,
      parcelas: o.semParcelamento ? 1 : totals.parcelasMaoDeObra,
      semParcelamento: !!o.semParcelamento,
      validadeDias: o.validadeDias || null,
      maoDeObra: totals.maoAVista,
      frete: totals.frete,
      itens: (o.itens||[]).map(it => ({
        descricao: it.descricao || 'Item',
        quantidade: itemQtd(it),
        valorUnitario: parseFloat(it.valorAVista)||0,
      })),
      observacoes: (o.observacoes||'').trim().slice(0,300),
      docPath: docPathOrc,
      diagnostico: diagOrigem ? {
        numero: diagOrigem.numero,
        data: diagOrigem.dataISO,
        equipamento: diagOrigem.equipamento || '',
        relato: (diagOrigem.problemaRelatado || '').trim().slice(0,300),
        conclusao: (diagOrigem.diagnostico || '').trim().slice(0,300),
        recomendacao: (diagOrigem.recomendacao || '').trim().slice(0,300),
        docPath: docPathDiagOrigem,
      } : null,
    });
  }

  const dados = {
    ...dadosBase,
    o: dadosBase.o.map((resumo, idx) => ({...resumo, docs: ordensComDocs[idx].docs})),
    diag: diagArray,
    orc: orcArray,
    atualizadoEm: new Date().toISOString(),
  };
  delete dados.v4; // a conferência agora é feita no servidor (código por e-mail / 4 dígitos)
  const jsonCifrado = await portalCifrar(chaveCrypto, new TextEncoder().encode(JSON.stringify(dados)));
  const envelope = {v:2, alg:'AES-GCM', d: bytesParaB64(jsonCifrado)};
  arquivos.push({path:`p/${portalId}.json`, base64: btoa(JSON.stringify(envelope))});
  // Nada de nome de cliente no histórico de commits (o repositório é público).
  const msgCommit = `Atualiza portal ${portalId.slice(0,6)}`;
  try{
    await subirVariosArquivosGithub(owner, repo, token, arquivos, msgCommit);
  }catch(e){
    // plano B: jeito antigo, um arquivo por vez (mais lento, mas funciona em qualquer situação)
    console.warn('Commit único falhou, subindo um por um:', e);
    for(const a of arquivos){
      await subirArquivoGithub(owner, repo, token, a.path, a.base64, msgCommit);
    }
  }
  try{ localStorage.setItem('lh_pdf_cache', JSON.stringify({...cacheAntigo, ...cachePendente})); }catch(e){}

  // Quem chama precisa gravar portalId/portalKey/portalK2 na ficha do cliente (senão o link muda na próxima).
  return {link: portalMontarLink(config.portalBaseUrl, portalId, portalKey, portalK2), portalId, portalKey, portalK2};
}

    : `Windows ${windowsVersion}`;
  const linhas = [

function CopyTextModal({title, text, onClose}){
  const [copied, setCopied] = useState(false);
  const [copyFailed, setCopyFailed] = useState(false);
  const textRef = useRef(null);

  const legacyCopy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  };

  const copy = async ()=>{
    setCopyFailed(false);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(()=>setCopied(false), 2000);
        return;
      }
      throw new Error('clipboard api unavailable');
    }catch(e){
      const ok = legacyCopy();
      if(ok){
        setCopied(true);
        setTimeout(()=>setCopied(false), 2000);
      } else {
        setCopyFailed(true);
        if(textRef.current){
          const range = document.createRange();
          range.selectNodeContents(textRef.current);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    }
  };
  return (
    <Modal title={title} onClose={onClose} footer={
      <React.Fragment>
        <button className="btn btn-outline" onClick={onClose}>Fechar</button>
        <button className="btn btn-gold" onClick={copy}>{copied ? '✔ Copiado!' : '📋 Copiar texto'}</button>
      </React.Fragment>
    }>
      {copyFailed && <div style={{background:'#FFF6DC', color:'#9C7A05', fontSize:12.5, padding:'8px 12px', borderRadius:8, marginBottom:10, fontWeight:600}}>Não foi possível copiar automaticamente. Selecionei o texto abaixo — use "copiar" do menu de seleção do celular.</div>}
      <div className="comprovante-box" ref={textRef}>{text}</div>
    </Modal>
  );
}

function ComprovanteModal({appt, client, onClose}){
  const text = buildComprovanteText(appt, client);
  return <CopyTextModal title="Comprovante de agendamento" text={text} onClose={onClose} />;
}

        <button type="button" className={f.formatacaoWindows==='8'?'active':''} onClick={()=>set('formatacaoWindows', f.formatacaoWindows==='8' ? '' : '8')}>Windows 8</button>
        <button type="button" className={f.formatacaoWindows==='10'?'active':''} onClick={()=>set('formatacaoWindows', f.formatacaoWindows==='10' ? '' : '10')}>Windows 10</button>
        <button type="button" className={f.formatacaoWindows==='11'?'active':''} onClick={()=>set('formatacaoWindows', f.formatacaoWindows==='11' ? '' : '11')}>Windows 11</button>
        <button type="button" className={f.formatacaoWindows==='linux'?'active':''} onClick={()=>set('formatacaoWindows', f.formatacaoWindows==='linux' ? '' : 'linux')}>Linux</button>
      </div>
      {f.formatacaoWindows && (
        <React.Fragment>
          {f.formatacaoWindows==='linux' && (
            <div className="field-row">
              <div className="field">
                <label>Qual distribuição Linux? (opcional)</label>
                <input value={f.formatacaoLinuxDistro||''} onChange={e=>set('formatacaoLinuxDistro', e.target.value)} placeholder="Ex: Ubuntu, Mint, Fedora, Zorin..." />
              </div>
            </div>
          )}
          <div className="field-row">
            <div className="field">
              <label>Nome de usuário que o cliente quer</label>
              <input value={f.formatacaoUsuario} onChange={e=>set('formatacaoUsuario',e.target.value)} placeholder="Ex: Gabriel" />
            </div>
            <div className="field">
              <label>Senha</label>
              <input value={f.formatacaoSenha} onChange={e=>set('formatacaoSenha',e.target.value)} placeholder="A senha que o cliente escolheu" />
            </div>
          </div>
          {f.formatacaoWindows==='10' && (
            <React.Fragment>
              <div style={{fontSize:12, color:'var(--ink-soft)', marginBottom:6}}>3 perguntas de segurança (Windows 10 pede isso pra recuperação de senha):</div>
              {f.formatacaoPerguntas.map((p, i)=>(
                <div className="field-row" key={i}>
                  <div className="field">
                    <label>Pergunta {i+1}</label>
                    <input value={p.pergunta} onChange={e=>{
                      const novas = [...f.formatacaoPerguntas];
                      novas[i] = {...novas[i], pergunta:e.target.value};
                      set('formatacaoPerguntas', novas);
                    }} placeholder="Ex: Nome do seu primeiro animal de estimação?" />
                  </div>
                  <div className="field">
                    <label>Resposta</label>
                    <input value={p.resposta} onChange={e=>{
                      const novas = [...f.formatacaoPerguntas];
                      novas[i] = {...novas[i], resposta:e.target.value};
                      set('formatacaoPerguntas', novas);
                    }} />
                  </div>
                </div>
              ))}
            </React.Fragment>
          )}
          <button type="button" className="btn btn-outline btn-sm" style={{marginBottom:14}} onClick={()=>setMostrarFichaFormatacao(true)}>
            📋 Gerar perguntas pro cliente responder (copiar)
          </button>
          {mostrarFichaFormatacao && (
            <CopyTextModal
              title="Perguntas pro cliente — formatação"
              text={buildFichaFormatacaoText(f.formatacaoWindows, f.formatacaoLinuxDistro)}
              onClose={()=>setMostrarFichaFormatacao(false)}
            />
          )}
        </React.Fragment>
      )}

      <div className="section-bar">Peças / produtos usados (opcional)</div>
      <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:10}}>
        Marque <strong>"Minha peça"</strong> quando sai do seu estoque/você revende (entra no seu faturamento). Marque <strong>"De fornecedor"</strong> quando é peça de outro site (Kabum, Terabyteshop etc) que o cliente compra por conta — você só ganha a mão de obra de montar/instalar, então isso NÃO conta como seu lucro.
      </div>
      {f.itens.map(it=>(
        <div className="orc-item-block" key={it.id}>
          <div className="oib-top">
            <input placeholder="Descrição (ex: SSD 480GB Kingston)" value={it.descricao} onChange={e=>updateItem(it.id,'descricao',e.target.value)} />
            <div style={{display:'flex', flexDirection:'column', alignItems:'center', flex:'0 0 62px'}}>
              <label style={{fontSize:10, fontWeight:700, color:'var(--ink-soft)', marginBottom:2}}>Qtd</label>
              <input type="number" min="1" value={it.quantidade===undefined || it.quantidade===null ? 1 : it.quantidade} onChange={e=>updateItem(it.id,'quantidade',e.target.value)} style={{textAlign:'center', fontWeight:700, width:'100%'}} />
            </div>
            <button className="icon-btn" onClick={()=>removeItem(it.id)}>✕</button>
          </div>
          <div className="field-row" style={{marginBottom:8}}>
            <button type="button" className={it.propria ? 'active' : ''} onClick={()=>updateItem(it.id,'propria',true)} style={{flex:1, padding:'8px 10px', borderRadius:8, border:'1px solid var(--border)', background: it.propria ? 'var(--navy)' : '#fff', color: it.propria ? '#fff' : 'var(--ink)', fontWeight:700, fontSize:12.5, cursor:'pointer'}}>📦 Minha peça (estoque/lucro seu)</button>
            <button type="button" className={!it.propria ? 'active' : ''} onClick={()=>updateItem(it.id,'propria',false)} style={{flex:1, padding:'8px 10px', borderRadius:8, border:'1px solid var(--border)', background: !it.propria ? 'var(--navy)' : '#fff', color: !it.propria ? '#fff' : 'var(--ink)', fontWeight:700, fontSize:12.5, cursor:'pointer'}}>🔗 De fornecedor (cliente compra)</button>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Fornecedor / plataforma</label>
              <input placeholder="Ex: Kabum, Mercado Livre, Magalu..." value={it.fornecedor} onChange={e=>updateItem(it.id,'fornecedor',e.target.value)} />
            </div>
            <div className="field">
              <label>Link do fornecedor (opcional)</label>
              <input placeholder="https://..." value={it.fornecedorLink} onChange={e=>updateItem(it.id,'fornecedorLink',e.target.value)} />
            </div>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Garantia do fornecedor</label>
              <input placeholder="Ex: 12 meses" value={it.garantiaFornecedor} onChange={e=>updateItem(it.id,'garantiaFornecedor',e.target.value)} />
            </div>
            <div className="field">
              <label>Valor à vista R$ {itemQtd(it)>1 ? '(por unidade)' : ''}</label>
              <input type="number" step="0.01" value={it.valorAVista} onChange={e=>updateItem(it.id,'valorAVista',e.target.value)} />
            </div>
          </div>
          {!it.propria && (
            <div className="field-row">
              <div className="field">
                <label>Cliente já te deu dinheiro adiantado pra essa peça? (R$, opcional)</label>
                <input type="number" step="0.01" value={it.valorRecebidoAntecipado||''} onChange={e=>updateItem(it.id,'valorRecebidoAntecipado',e.target.value)} placeholder="Só se ele já te entregou o dinheiro antes de você comprar" />
              </div>
            </div>
          )}
          {!it.propria && it.valorRecebidoAntecipado && parseFloat(it.valorRecebidoAntecipado)>0 && (()=>{
            const saldo = (parseFloat(it.valorRecebidoAntecipado)||0)*itemQtd(it) - itemTotalAVista(it);
            return (
              <div style={{fontSize:12, background:'var(--blue-bg)', padding:'8px 10px', borderRadius:8, marginTop:-6, marginBottom:8, color:'var(--navy)'}}>
                {saldo > 0 && <span>💰 Sobrou <strong>R$ {formatMoney(saldo)}</strong> — vai descontar da mão de obra, e gera uma declaração assinável.</span>}
                {saldo < 0 && <span>⚠️ Faltou <strong>R$ {formatMoney(Math.abs(saldo))}</strong> — a peça custou mais do que o cliente deu.</span>}
                {saldo === 0 && <span>✔ Bateu certinho, sem sobra nem falta.</span>}
              </div>
            );
          })()}
          {itemQtd(it)>1 && it.valorAVista && (
            <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:-6, marginBottom:8}}>
              Total dessa peça ({itemQtd(it)}x): <strong style={{color:'var(--green-ok)'}}>R$ {formatMoney(itemTotalAVista(it))}</strong>
            </div>
          )}
        </div>
      ))}
      <button type="button" className="btn btn-outline btn-sm" onClick={addItem}>+ Adicionar peça</button>
      {products && products.filter(p=>p.tipo!=='insumo').length>0 && (
        <button type="button" className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>setMostrarCatalogoItem(true)}>📦 Adicionar do catálogo (produtos/licenças/serviços)</button>
      )}
      {mostrarCatalogoItem && (
        <Modal title="Escolher do catálogo (produtos, licenças e serviços)" onClose={()=>setMostrarCatalogoItem(false)}>
          <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:12}}>
            Toca num item pra adicionar ele na OS já com nome e preço preenchidos (marca automaticamente como "Minha peça", já que é do seu catálogo).
          </div>
          {products.filter(p=>p.tipo!=='insumo').map(p=>(
            <div key={p.id} className="list-item" style={{cursor:'pointer'}} onClick={()=>{
              setF(prev=>({...prev, itens:[...prev.itens, {...blankItem(), descricao:p.nome, valorAVista:String(p.preco||''), propria:true}]}));
              setMostrarCatalogoItem(false);
            }}>
              <div>
                <span className={`prod-badge ${p.tipo}`} style={{fontSize:10.5, marginBottom:3, display:'inline-block'}}>{p.tipo==='produto'?'Produto':p.tipo==='licenca'?'Licença':'Serviço'}</span>
                <div><strong style={{color:'var(--navy)'}}>{p.nome}</strong></div>
                {p.categoria && <div style={{fontSize:12, color:'var(--ink-soft)'}}>{p.categoria}</div>}
              </div>
              <div style={{fontWeight:700, color:'var(--navy)'}}>R$ {formatMoney(p.preco)}</div>
            </div>
          ))}
        </Modal>
      )}

      <div className="section-bar">Mão de obra</div>
      <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:10}}>
        O que o cliente paga pra você (LontraHelp) pelo serviço — separado do valor das peças.
      </div>
      {servicos.length>0 && (
        <div className="preset-btns" style={{marginBottom:10}}>
          {servicos.map(s=>(
            <button type="button" key={s.id} className="btn btn-outline btn-sm" onClick={()=>addServico(s)}>
              + {s.nome} (R$ {formatMoney(s.preco)})
            </button>
          ))}
        </div>
      )}
      <div className="field-row">
        <div className="field">
          <label>Mão de obra (R$)</label>
          <input type="number" step="0.01" value={f.maoDeObra} onChange={e=>set('maoDeObra',e.target.value)} placeholder="0,00" />
        </div>
        <div className="field">
          <label>Frete (opcional, R$)</label>
          <input type="number" step="0.01" placeholder="Deixe em branco se não tiver" value={f.frete} onChange={e=>set('frete',e.target.value)} />
        </div>
      </div>

      <div className="field-row">
        <div className="field">
          <label>Desconto na mão de obra — valor fixo (R$, opcional)</label>
          <input type="number" step="0.01" placeholder="Ex: 20" value={f.descontoManualValor||''} onChange={e=>set('descontoManualValor', e.target.value)} disabled={!!(f.descontoManualPercent && parseFloat(f.descontoManualPercent)>0)} />
        </div>
        <div className="field">
          <label>OU desconto em % (opcional)</label>
          <input type="number" step="1" placeholder="Ex: 10" value={f.descontoManualPercent||''} onChange={e=>set('descontoManualPercent', e.target.value)} disabled={!!(f.descontoManualValor && parseFloat(f.descontoManualValor)>0)} />
        </div>
      </div>
      {(()=>{
        const percent = parseFloat(f.descontoManualPercent)||0;
        const fixo = parseFloat(f.descontoManualValor)||0;
        if(percent<=0 && fixo<=0) return null;
        const maoObra = parseFloat(f.maoDeObra)||0;
        const desconto = percent>0 ? Math.min(maoObra, maoObra*(percent/100)) : Math.min(maoObra, fixo);
        return (
          <div style={{fontSize:12.5, background:'var(--blue-bg)', padding:'10px 12px', borderRadius:8, marginBottom:14, marginTop:-6, color:'var(--navy)'}}>
            💸 Desconto de <strong>R$ {formatMoney(desconto)}</strong> — mão de obra final: <strong>R$ {formatMoney(Math.max(0,maoObra-desconto))}</strong> (antes de qualquer desconto de adiantamento de peça, se tiver).
          </div>
        );
      })()}

      <div className="field-row">
        <div className="field">
          <label>Valor já recebido dessa OS (R$, opcional)</label>
          <input type="number" step="0.01" placeholder="Ex: sinal pago, mesmo com a OS arquivada/em andamento" value={f.valorJaRecebido||''} onChange={e=>set('valorJaRecebido', e.target.value)} />
        </div>
      </div>
      {f.valorJaRecebido && parseFloat(f.valorJaRecebido)>0 && (
        <div style={{fontSize:12.5, background:'#E7F5EC', padding:'10px 12px', borderRadius:8, marginBottom:14, marginTop:-6, color:'var(--green-ok)'}}>
          ✔ Esse valor já entra no Lucro Líquido de agora, mesmo que essa OS não esteja concluída (por exemplo, um sinal de consultoria pago com o serviço ainda arquivado). Só o restante ainda pendente conta no Lucro Previsto.
        </div>
      )}

      <div className="field-row">
        <div className="field">
          <label>{f.itens.filter(it=>it.descricao && it.descricao.trim()).length===0 ? '⚠️ Detalhes do serviço realizado (obrigatório quando não tem peça nenhuma)' : 'Detalhes do serviço realizado (texto livre — vai para o recibo)'}</label>
          <textarea value={f.observacoes} onChange={e=>set('observacoes', e.target.value)} placeholder={"Ex:\nAbertura do equipamento e instalação física de unidade de armazenamento SSD.\nFormatação e instalação limpa do sistema operacional Windows.\nInstalação e atualização de drivers essenciais."} style={{minHeight:110}} />
        </div>
      </div>
      {(()=>{
        const descricoesItens = f.itens.filter(it=>it.descricao && it.descricao.trim()).map(it=>it.descricao.trim().toLowerCase());
        if(descricoesItens.length===0 || !f.observacoes.trim()) return null;
        const linhasObs = f.observacoes.split('\n');
        const linhasRepetidas = linhasObs.filter(linha=>{
          const l = linha.trim().toLowerCase();
          if(!l) return false;
          // considera "repetida" se a linha começa com a descrição de alguma peça já cadastrada
          // (cobre o formato comum "Nome da peça — R$ 123,45 (fornecedor, garantia X)")
          return descricoesItens.some(desc => desc.length>8 && l.startsWith(desc.slice(0, Math.min(desc.length, 25))));
        });
        if(linhasRepetidas.length===0) return null;
        const limparRepetidas = ()=>{
          const linhasLimpas = linhasObs.filter(linha=>!linhasRepetidas.includes(linha));
          set('observacoes', linhasLimpas.join('\n').replace(/\n{3,}/g,'\n\n').trim());
        };
        return (
          <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'10px 12px', borderRadius:8, marginBottom:14, marginTop:-6}}>
            ⚠️ Encontrei {linhasRepetidas.length} linha(s) nessa observação que parecem repetir peças que já estão na lista de itens acima (duplicado no recibo). Quer limpar automaticamente?
            <div style={{marginTop:8}}>
              <button type="button" className="btn btn-gold btn-sm" onClick={limparRepetidas}>🧹 Remover linhas repetidas</button>
            </div>
          </div>
        );
      })()}
      {f.itens.filter(it=>it.descricao && it.descricao.trim()).length===0 && !f.observacoes.trim() && (
        <div style={{fontSize:12, color:'#9C7A05', background:'#FFF6DC', padding:'8px 12px', borderRadius:8, marginBottom:10, marginTop:-6}}>
          Sem peça nenhuma nessa OS, o recibo vai mostrar só um valor de mão de obra sem dizer o que foi feito. Descreva o serviço acima (ex: "Formatação de computador").
        </div>
      )}

      <div className="orc-mao-totais-bloco">
        <div className="orc-subtotal-row"><span>Total peças</span><span>R$ {formatMoney(totals.totalPecas)}</span></div>
        <div className="orc-subtotal-row"><span>Mão de obra</span><span>R$ {formatMoney(totals.maoDeObra)}</span></div>
        {totals.frete>0 && <div className="orc-subtotal-row"><span>Frete</span><span>R$ {formatMoney(totals.frete)}</span></div>}
        <div className="orc-price-split" style={{margin:'14px 0'}}>
          <div className="orc-price-box avista">
            <div className="opb-label">Total que o cliente paga</div>
            <div className="opb-value">R$ {formatMoney(totals.totalGeral)}</div>
          </div>
          <div className="orc-price-box parcelado">
            <div className="opb-label">O que é seu (mão de obra + peças próprias)</div>
            <div className="opb-value">R$ {formatMoney(totals.meuFaturamento)}</div>
            {totals.totalPecasTerceiros>0 && <div className="opb-sub">Não conta peça de fornecedor: R$ {formatMoney(totals.totalPecasTerceiros)}</div>}
          </div>
        </div>
      </div>

      <div className="section-bar">Garantia</div>
      <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:10}}>
        Serviço tipo consultoria/orientação geralmente não tem garantia (não é montagem física nem instalação). Desliga aqui se for o caso — a garantia só começa a contar a partir do dia que a OS for marcada como "Concluído".
      </div>
      <div className="type-toggle-3" style={{marginBottom:14}}>
        <button type="button" className={f.temGarantia!==false?'active':''} onClick={()=>set('temGarantia', true)}>✔ Tem garantia</button>
        <button type="button" className={f.temGarantia===false?'active':''} onClick={()=>set('temGarantia', false)}>Sem garantia (ex: consultoria)</button>
      </div>
      {f.temGarantia!==false && (
        <React.Fragment>
          <label style={{fontSize:12.5, fontWeight:700, color:'var(--navy)', display:'block', marginBottom:6}}>O que essa garantia cobre?</label>
          <div className="type-toggle-3" style={{marginBottom:14}}>
            <button type="button" className={(f.tipoGarantia||'ambos')==='ambos'?'active':''} onClick={()=>set('tipoGarantia', 'ambos')}>Mão de obra + software</button>
            <button type="button" className={f.tipoGarantia==='apenas_maodeobra'?'active':''} onClick={()=>set('tipoGarantia', 'apenas_maodeobra')}>Só mão de obra</button>
            <button type="button" className={f.tipoGarantia==='apenas_software'?'active':''} onClick={()=>set('tipoGarantia', 'apenas_software')}>Só software</button>
          </div>
          <div className="field-row">
            {(f.tipoGarantia||'ambos')!=='apenas_software' && (
              <div className="field">
                <label>Garantia de mão de obra física (dias)</label>
                <input type="number" value={f.garantiaFisicaDias} onChange={e=>set('garantiaFisicaDias', e.target.value)} />
              </div>
            )}
            {(f.tipoGarantia||'ambos')!=='apenas_maodeobra' && (
              <div className="field">
                <label>Garantia de software/configurações (dias)</label>
                <input type="number" value={f.garantiaSoftwareDias} onChange={e=>set('garantiaSoftwareDias', e.target.value)} />
              </div>
            )}
          </div>
        </React.Fragment>
      )}

      <div className="section-bar">Prazo de entrega</div>
      <div className="field-row">
        <div className="field">
          <label>Prazo combinado com o cliente (dias)</label>
          <input type="number" value={f.prazoEntregaDias||''} onChange={e=>set('prazoEntregaDias', e.target.value)} placeholder="ex: 3" />
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'flex-end', gap:10, marginTop:16}}>
        <button className="btn btn-outline" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-gold" disabled={!f.clientId} onClick={handleSave}>
          {initial ? 'Salvar alterações' : 'Salvar Ordem de Serviço'}
        </button>
      </div>
    </div>
  );
}

/* ---------------- RECEIPT VIEW ---------------- */
function ReceiptView({order, client, config}){
  if(!order) return null;
  // Quando não tem mão de obra nenhuma (só vendeu produto, sem prestar serviço), o documento vira
  // uma nota de venda de produto — não faz sentido chamar de "Ordem de Serviço" nesse caso.
  const ehVendaProduto = orderUsaItens(order) && (parseFloat(order.maoDeObra)||0)===0;
  return (
    <div className="receipt-page print-area" id="receipt-print-area">
      <div className="r-header">
        <img src={LOGO_SRC} alt="LontraHelp" className="r-logo-img" />
        <div className="r-brand">LONTRA<span className="help">HELP</span></div>
        <div className="r-sub">MONTAGEM E FORMATAÇÃO</div>
      </div>
      <div className="r-banner">{ehVendaProduto ? 'NOTA DE VENDA DE PRODUTO' : 'RECIBO DE PAGAMENTO E GARANTIA'}</div>
      <div className="r-contact">(81) 9 8623-4860 &nbsp;|&nbsp; @lontrahelp{config && config.empresaCnpj ? ` \u00A0|\u00A0 CNPJ: ${config.empresaCnpj}` : ''}</div>

      <div className="r-body">
        <div className="r-sec-title">Identificação</div>
        <div className="r-row">
          <div className="r-field"><div className="k">{ehVendaProduto ? 'Nº do Pedido' : 'Nº OS'}</div><div className="v">{order.osNumber}</div></div>
          <div className="r-field"><div className="k">Data</div><div className="v">{formatDateBR(order.dataISO)}</div></div>
        </div>
        <div className="r-row">
          <div className="r-field" style={{flex:'1 0 100%'}}><div className="k">{ehVendaProduto ? 'Vendedor Responsável' : 'Técnico Responsável'}</div><div className="v">{order.tecnico}</div></div>
        </div>

        <div className="r-sec-title">Dados do Cliente</div>
        <div className="r-row">
          <div className="r-field" style={{flex:'1 0 100%'}}><div className="k">Nome Completo</div><div className="v">{client ? client.nome : '—'}</div></div>
        </div>
        <div className="r-row">
          <div className="r-field"><div className="k">CPF / CNPJ</div><div className="v">{client && client.cpfCnpj ? client.cpfCnpj : '—'}</div></div>
          <div className="r-field"><div className="k">Telefone</div><div className="v">{client && client.telefone ? client.telefone : '—'}</div></div>
        </div>

        {!ehVendaProduto && (
          <React.Fragment>
            <div className="r-sec-title">Serviço Prestado</div>
            <div className="r-row">
              <div className="r-field"><div className="k">Equipamento</div><div className="v">{order.equipamento || '—'}</div></div>
              <div className="r-field"><div className="k">Nº de Série</div><div className="v">{order.numeroSerie || '—'}</div></div>

function DeclaracoesTab({orders, clients, goTo}){
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState('');

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || '—';

  // Toda OS que usa o sistema de itens E tem pelo menos uma peça com adiantamento entra na lista.
  const comDeclaracao = orders
    .filter(o=>orderUsaItens(o) && computeOrderTotals(o).itensComAdiantamento.length>0)
    .map(o=>({order:o, totals: computeOrderTotals(o)}))
    .filter(({order:o})=> o.osNumber.includes(search) || clientName(o.clientId).toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=> b.order.dataISO.localeCompare(a.order.dataISO));

  const selected = selectedId ? orders.find(o=>o.id===selectedId) : null;
  const selectedClient = selected ? clients.find(c=>c.id===selected.clientId) : null;
  useDocumentTitle(selected ? `Declaracao - OS ${selected.osNumber} - ${selectedClient ? selectedClient.nome : 'Cliente'}` : null);

  return (

      <div className="page-header">
        <div>
          <h1 className="page-title">Declarações</h1>

      ))}

  );
