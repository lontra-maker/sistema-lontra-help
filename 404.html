  const [photoLoaded, setPhotoLoaded] = useState(false);
  const [fontsReady, setFontsReady] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const [showCaption, setShowCaption] = useState(false);

  useEffect(()=>{
    const img = new Image();
    img.onload = ()=>{ logoImgRef.current = img; setLogoLoaded(true); };
    img.src = LOGO_SRC;
  }, []);

  useEffect(()=>{
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('400 64px Anton'),
        document.fonts.load('800 40px Poppins'),
        document.fonts.load('700 24px Inter')
      ]).then(()=>setFontsReady(true)).catch(()=>setFontsReady(true));
    } else {
      setFontsReady(true);
    }
  }, []);

  const handlePhotoUpload = (file)=>{
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{ photoImgRef.current = img; setPhotoLoaded(true); setPhotoDataUrl(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  const removePhoto = ()=>{ photoImgRef.current=null; setPhotoLoaded(false); setPhotoDataUrl(null); };

  const drawCoverImage = (ctx, img, x, y, w, h, radius)=>{
    const imgRatio = img.width/img.height;
    const boxRatio = w/h;
    let sx, sy, sw, sh;
    if(imgRatio > boxRatio){ sh = img.height; sw = sh*boxRatio; sy = 0; sx = (img.width-sw)/2; }
    else { sw = img.width; sh = sw/boxRatio; sx = 0; sy = (img.height-sh)/2; }
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,radius); else ctx.rect(x,y,w,h);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();
  };

  const draw = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const W = 1080;
    const H = format==='post' ? 1080 : 1920;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const corBase = promo.cor || LOJA_COR_PADRAO[promo.loja] || '#2C82C9';
    const claro = isLightColor(corBase);
    const corTexto = claro ? '#173A5E' : '#ffffff';
    const corTextoSuave = claro ? '#3E5872' : '#DCEBF7';
    const corAccent = claro ? '#173A5E' : '#F4C430';
    const corAccentTexto = claro ? '#ffffff' : '#173A5E';
    const corLinha = claro ? 'rgba(23,58,94,0.14)' : 'rgba(255,255,255,0.10)';
    const corLinhaDot = claro ? 'rgba(23,58,94,0.20)' : 'rgba(255,255,255,0.14)';

    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, shadeColor(corBase, 18));
    grad.addColorStop(0.55, corBase);
    grad.addColorStop(1, shadeColor(corBase, -38));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = corLinha;
    ctx.lineWidth = 2.5;
    for(let i=0;i<16;i++){
      const seedX = (i*173)%W, seedY = (i*311)%H;
      ctx.beginPath();
      ctx.moveTo(seedX, seedY);
      ctx.lineTo(seedX+70, seedY);
      ctx.lineTo(seedX+70, seedY+70);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(seedX+70, seedY+70, 4, 0, Math.PI*2);
      ctx.fillStyle = corLinhaDot;
      ctx.fill();
    }

    let y = format==='post' ? 70 : 100;

    if(logoImgRef.current){
      ctx.save();
      ctx.beginPath();
      ctx.arc(85, y+27, 35, 0, Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.clip();
      ctx.drawImage(logoImgRef.current, 50, y-8, 70, 70);
      ctx.restore();
    }

    // selo/monograma da loja, canto oposto
    const sigla = LOJA_SIGLA[promo.loja] || promo.loja.slice(0,2).toUpperCase();
    ctx.save();
    ctx.beginPath();
    ctx.arc(W-85, y+27, 35, 0, Math.PI*2);
    ctx.closePath();
    ctx.fillStyle = corAccent;
    ctx.fill();
    ctx.strokeStyle = claro ? 'rgba(23,58,94,0.25)' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    ctx.font = '800 26px Poppins, sans-serif';
    ctx.fillStyle = corAccentTexto;
    ctx.textAlign = 'center';
    ctx.fillText(sigla, W-85, y+36);

    const wordFont = format==='post' ? '400 44px Anton, sans-serif' : '400 50px Anton, sans-serif';
    ctx.font = wordFont;
    const lontraW = ctx.measureText('LONTRA').width;
    const helpW = ctx.measureText('HELP').width;
    const totalW = lontraW + helpW;
    const startX = W/2 - totalW/2 + 25;
    ctx.textAlign = 'left';
    ctx.fillStyle = corTexto;
    ctx.fillText('LONTRA', startX, y+34);
    ctx.fillStyle = claro ? '#0086FF' : '#F4C430';
    ctx.fillText('HELP', startX+lontraW, y+34);
    y += 58;

    ctx.font = '700 20px Inter, sans-serif';
    ctx.fillStyle = corTextoSuave;
    ctx.textAlign = 'center';
    ctx.fillText('ACHADOS E PROMOÇÕES', W/2, y);
    y += 40;

    ctx.fillStyle = corAccent;
    ctx.fillRect(W/2-50, y, 100, 4);
    y += 44;

    ctx.font = '700 26px Inter, sans-serif';
    const storeW = ctx.measureText(promo.loja.toUpperCase()).width + 40;
    ctx.fillStyle = corAccent;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(W/2-storeW/2, y, storeW, 44, 22); else ctx.rect(W/2-storeW/2,y,storeW,44);
    ctx.fill();
    ctx.fillStyle = corAccentTexto;
    ctx.fillText(promo.loja.toUpperCase(), W/2, y+30);
    y += 110;

    if(photoImgRef.current){
      const photoW = W-140;
      const photoH = format==='post' ? 420 : 560;
      drawCoverImage(ctx, photoImgRef.current, 70, y, photoW, photoH, 18);
      ctx.strokeStyle = claro ? 'rgba(23,58,94,0.7)' : 'rgba(244,196,48,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(70, y, photoW, photoH, 18); else ctx.rect(70,y,photoW,photoH);
      ctx.stroke();
      y += photoH + 66;
    }

    ctx.font = '800 50px Poppins, sans-serif';
    ctx.fillStyle = corTexto;
    ctx.textAlign = 'center';
    const titleLines = wrapCanvasText(ctx, promo.nome || 'Produto', W/2, y, W-140, 58, 2);
    y += titleLines*58 + 38;

    const temOriginal = promo.precoOriginal && parseFloat(promo.precoOriginal) > parseFloat(promo.precoPromo||0);
    if(temOriginal){
      ctx.font = '600 32px Inter, sans-serif';
      ctx.fillStyle = corTextoSuave;
      const origText = 'R$ ' + formatMoney(promo.precoOriginal);
      const origW = ctx.measureText(origText).width;
      ctx.fillText(origText, W/2, y);
      ctx.strokeStyle = corTextoSuave;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(W/2-origW/2-4, y-11);
      ctx.lineTo(W/2+origW/2+4, y-11);
      ctx.stroke();
      y += 56;
    }
    ctx.font = '800 78px Poppins, sans-serif';
    ctx.fillStyle = claro ? '#173A5E' : '#F4C430';
    ctx.fillText('R$ ' + formatMoney(promo.precoPromo), W/2, y);
    y += 72;

    const footerY = H - (format==='post' ? 100 : 160);

    if(!photoImgRef.current && footerY - y > 120){
      const iconY = y + (footerY - y)/2 + 50;
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.font = (format==='post' ? '190px' : '230px') + ' sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🛍️', W/2, iconY);
      ctx.restore();
    }

    ctx.font = '700 28px Inter, sans-serif';
    ctx.fillStyle = corTexto;
    ctx.textAlign = 'center';
    ctx.fillText('🔗 Link na descrição / bio', W/2, footerY);
    ctx.font = '600 24px Inter, sans-serif';
    ctx.fillStyle = corTextoSuave;
    ctx.fillText('@lontrahelp', W/2, footerY+38);
  };

  useEffect(()=>{ if(logoLoaded && fontsReady) draw(); }, [logoLoaded, fontsReady, photoLoaded, format]);

  const downloadImage = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const link = document.createElement('a');
    const safeName = (promo.nome||'promo').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    link.download = `promo-${safeName||'produto'}-${format}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  const legendaTexto = (()=>{
    const temOriginal = promo.precoOriginal && parseFloat(promo.precoOriginal) > parseFloat(promo.precoPromo||0);
    const linhas = [
      `🔥 OFERTA — ${promo.nome}`,
      ``,
      temOriginal ? `De R$ ${formatMoney(promo.precoOriginal)} por R$ ${formatMoney(promo.precoPromo)} na ${promo.loja}!` : `Por R$ ${formatMoney(promo.precoPromo)} na ${promo.loja}!`,
      ``,
      `👉 Link: ${promo.link || '(adicione o link no cadastro da promoção)'}`,
      ``,
      `#promocao #oferta #achadinhos`
    ];
    return linhas.join('\n');
  })();

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Gerar post — {promo.nome}</h1>
          <div className="page-sub">{promo.loja}</div>
        </div>
        <button className="btn btn-outline btn-sm" onClick={onBack}>← Voltar</button>
      </div>

      <div className="anuncio-layout">
        <div>
          <div className="format-toggle">
            <button className={format==='post'?'active':''} onClick={()=>setFormat('post')}>⬛ Post (quadrado)</button>
            <button className={format==='story'?'active':''} onClick={()=>setFormat('story')}>📱 Story (vertical)</button>
          </div>

          <div className="section-bar">Foto do produto</div>
          {!photoDataUrl ? (
            <label className="btn btn-outline btn-sm" style={{display:'inline-flex', cursor:'pointer'}}>
              📷 Enviar foto do produto
              <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>handlePhotoUpload(e.target.files[0])} />
            </label>
          ) : (
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
              <img src={photoDataUrl} alt="Foto do produto" style={{width:60, height:60, objectFit:'cover', borderRadius:8, border:'1px solid var(--border)'}} />
              <button className="btn btn-danger btn-sm" onClick={removePhoto}>Remover foto</button>
            </div>
          )}

          <div className="section-bar">Link de afiliado</div>
          <div className="link-copy-row">
            <input readOnly value={promo.link || 'Nenhum link cadastrado'} />
            <button className="btn btn-outline btn-sm" onClick={async ()=>{
              try{
                if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(promo.link||''); }
                else { const ta=document.createElement('textarea'); ta.value=promo.link||''; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
                setLinkCopied(true); setTimeout(()=>setLinkCopied(false),2000);
              }catch(e){}
            }}>{linkCopied ? '✔ Copiado' : '📋 Copiar'}</button>
          </div>

          <div className="section-bar">Legenda pronta pro Instagram</div>
          <button className="btn btn-outline btn-sm" onClick={()=>setShowCaption(true)}>📋 Ver e copiar legenda</button>
        </div>

        <div className="anuncio-preview-wrap">
          <canvas ref={canvasRef} className="anuncio-canvas"></canvas>
          <button className="btn btn-gold" onClick={downloadImage}>📥 Baixar imagem PNG</button>
        </div>
      </div>

      {showCaption && (
        <CopyTextModal title="Legenda para o post" text={legendaTexto} onClose={()=>setShowCaption(false)} />
      )}
    </div>
  );
}

/* ---------------- DIVULGAÇÃO (anúncio recorrente de serviço) ---------------- */
function DivulgacaoTab({products}){
  const [headline, setHeadline] = useState('Computador com problema?');
  const [descricao, setDescricao] = useState('Eu conserto! Rápido, com garantia e sem enrolação.');
  const [selectedServiceIds, setSelectedServiceIds] = useState([]);
  const [extraItens, setExtraItens] = useState('');
  const [format, setFormat] = useState('post');
  const canvasRef = useRef(null);
  const logoImgRef = useRef(null);
  const [logoLoaded, setLogoLoaded] = useState(false);
  const [fontsReady, setFontsReady] = useState(false);

  const servicos = (products||[]).filter(p=>p.tipo==='servico');

  useEffect(()=>{
    const img = new Image();
    img.onload = ()=>{ logoImgRef.current = img; setLogoLoaded(true); };
    img.src = LOGO_SRC;
  }, []);
  useEffect(()=>{
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('400 64px Anton'),
        document.fonts.load('800 40px Poppins'),
        document.fonts.load('700 24px Inter')
      ]).then(()=>setFontsReady(true)).catch(()=>setFontsReady(true));
    } else { setFontsReady(true); }
  }, []);

  const toggleService = (id)=> setSelectedServiceIds(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const itensList = ()=>{
    const nomes = servicos.filter(s=>selectedServiceIds.includes(s.id)).map(s=>s.nome);
    const extras = extraItens.split('\n').map(s=>s.trim()).filter(Boolean);
    return [...nomes, ...extras];
  };

  const draw = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const W = 1080;
    const H = format==='post' ? 1080 : 1920;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, '#173A5E');
    grad.addColorStop(1, '#0B2238');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 3;
    for(let i=0;i<12;i++){
      const seedX = (i*151)%W, seedY = (i*277)%H;
      ctx.beginPath();
      ctx.moveTo(seedX, seedY);
      ctx.lineTo(seedX+80, seedY);
      ctx.lineTo(seedX+80, seedY+80);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(seedX+80, seedY+80, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
    }

    let y = format==='post' ? 80 : 120;

    if(logoImgRef.current){
      ctx.save();
      ctx.beginPath();
      ctx.arc(W/2, y+45, 45, 0, Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.clip();
      ctx.drawImage(logoImgRef.current, W/2-45, y, 90, 90);
      ctx.restore();
      y += 108;
    }

    const wordFont = format==='post' ? '400 48px Anton, sans-serif' : '400 54px Anton, sans-serif';
    ctx.font = wordFont;
    const lontraW = ctx.measureText('LONTRA').width;
    const helpW = ctx.measureText('HELP').width;
    const startX = W/2 - (lontraW+helpW)/2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('LONTRA', startX, y+36);
    ctx.fillStyle = '#F4C430';
    ctx.fillText('HELP', startX+lontraW, y+36);
    y += 66;

    ctx.font = '700 20px Inter, sans-serif';
    ctx.fillStyle = '#AFC6DB';
    ctx.textAlign = 'center';
    ctx.fillText('MONTAGEM E FORMATAÇÃO', W/2, y);
    y += 56;

    ctx.fillStyle = '#F4C430';
    ctx.fillRect(W/2-55, y, 110, 5);
    y += 80;

    ctx.font = '800 62px Poppins, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    const headlineLines = wrapCanvasText(ctx, headline || 'Computador com problema?', W/2, y, W-140, 68, 3);
    y += headlineLines*68 + 30;

    if(descricao && descricao.trim()){
      ctx.font = '500 28px Inter, sans-serif';
      ctx.fillStyle = '#DCEBF7';
      const descLines = wrapCanvasText(ctx, descricao, W/2, y, W-220, 38, 3);
      y += descLines*38 + 40;
    } else {
      y += 20;
    }

    const itens = itensList();
    if(itens.length>0){
      const boxTop = y;
      const boxH = 60 + itens.length*54;
      const boxW = W-180;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(90, boxTop, boxW, boxH, 16); else ctx.rect(90,boxTop,boxW,boxH);
      ctx.fill();
      ctx.strokeStyle = 'rgba(244,196,48,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(90, boxTop, boxW, boxH, 16); else ctx.rect(90,boxTop,boxW,boxH);
      ctx.stroke();

      let iy = boxTop + 48;
      ctx.textAlign = 'left';
      ctx.font = '700 30px Inter, sans-serif';
      itens.forEach(item=>{
        ctx.fillStyle = '#F4C430';
        ctx.fillText('✔', 120, iy);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(item, 165, iy);
        iy += 54;
      });
      y = boxTop + boxH + 40;
    }

    const footerY = H - (format==='post' ? 130 : 190);
    ctx.fillStyle = '#F4C430';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(140, footerY-46, W-280, 90, 45); else ctx.rect(140,footerY-46,W-280,90);
    ctx.fill();
    ctx.font = '800 34px Poppins, sans-serif';
    ctx.fillStyle = '#173A5E';
    ctx.textAlign = 'center';
    ctx.fillText('📱 Chame agora!', W/2, footerY+12);

    ctx.font = '700 28px Inter, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('(81) 9 8623-4860', W/2, footerY+80);
    ctx.font = '600 24px Inter, sans-serif';
    ctx.fillStyle = '#DCEBF7';
    ctx.fillText('@lontrahelp', W/2, footerY+114);
  };

  useEffect(()=>{ if(logoLoaded && fontsReady) draw(); }, [logoLoaded, fontsReady, headline, descricao, format, JSON.stringify(selectedServiceIds), extraItens]);

  const downloadImage = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const link = document.createElement('a');
    const stamp = todayISO();
    link.download = `lontrahelp-divulgacao-${stamp}-${format}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Divulgação</h1>
          <div className="page-sub">Anúncio recorrente dos seus serviços — preenche rápido e publica todo dia</div>
        </div>
      </div>

      <div className="anuncio-layout">
        <div>
          <div className="format-toggle">
            <button className={format==='post'?'active':''} onClick={()=>setFormat('post')}>⬛ Post (quadrado)</button>
            <button className={format==='story'?'active':''} onClick={()=>setFormat('story')}>📱 Story (vertical)</button>
          </div>

          <div className="field-row">
            <div className="field">
              <label>Chamada principal</label>
              <input value={headline} onChange={e=>setHeadline(e.target.value)} placeholder="Ex: Computador com problema?" />
            </div>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Descrição curta</label>
              <input value={descricao} onChange={e=>setDescricao(e.target.value)} placeholder="Ex: Eu conserto! Rápido e com garantia." />
            </div>
          </div>

          {servicos.length>0 && (
            <React.Fragment>
              <div className="section-bar">Serviços do catálogo (toque pra incluir)</div>
              <div style={{marginBottom:10}}>
                {servicos.map(s=>(
                  <span key={s.id} className={`div-service-chip ${selectedServiceIds.includes(s.id)?'active':''}`} onClick={()=>toggleService(s.id)}>
                    {selectedServiceIds.includes(s.id) ? '✓' : '+'} {s.nome}
                  </span>
                ))}
              </div>
            </React.Fragment>
          )}

          <div className="section-bar">Outros itens (opcional, um por linha)</div>
          <div className="field-row">
            <div className="field">
              <textarea value={extraItens} onChange={e=>setExtraItens(e.target.value)} placeholder={"Ex:\nFormatação\nManutenção de impressoras\nMontagem de PC"} style={{minHeight:80}} />
            </div>
          </div>
        </div>

        <div className="anuncio-preview-wrap">
          <canvas ref={canvasRef} className="anuncio-canvas"></canvas>
          <button className="btn btn-gold" onClick={downloadImage}>📥 Baixar imagem PNG</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- CATÁLOGO (banner com serviços e produtos disponíveis) ---------------- */

  const [corFundo, setCorFundo] = useState('#5CB8E0');

  const logoImgRef = useRef(null);
  const [logoLoaded, setLogoLoaded] = useState(false);
  const [fontsReady, setFontsReady] = useState(false);

  useEffect(()=>{
    const img = new Image();
    img.onload = ()=>{ logoImgRef.current = img; setLogoLoaded(true); };
    img.src = LOGO_SRC;
  }, []);
  useEffect(()=>{
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('400 64px Anton'),
        document.fonts.load('800 40px Poppins'),
        document.fonts.load('700 24px Inter')
      ]).then(()=>setFontsReady(true)).catch(()=>setFontsReady(true));
    } else { setFontsReady(true); }
  }, []);

  const toggleSelect = (id)=> setSelectedIds(prev=> prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  const selectAllTipo = (tipo)=>{
    const ids = products.filter(p=>p.tipo===tipo).map(p=>p.id);
    setSelectedIds(prev=> Array.from(new Set([...prev, ...ids])));
  };
  const clearAll = ()=> setSelectedIds([]);

  const grupos = [
    {tipo:'servico', label:'SERVIÇOS', icone:'🛠️'},
    {tipo:'produto', label:'PRODUTOS', icone:'📦'},
    {tipo:'licenca', label:'LICENÇAS', icone:'🔑'},
  ].map(g=>({...g, itens: products.filter(p=>p.tipo===g.tipo && selectedIds.includes(p.id))}))
   .filter(g=>g.itens.length>0);

  const draw = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const W = 1080;
    const H = format==='post' ? 1080 : 1920;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, shadeColor(corFundo, 38));
    grad.addColorStop(0.5, corFundo);
    grad.addColorStop(1, shadeColor(corFundo, -30));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    const claro = isLightColor(corFundo);
    drawCircuitPattern(ctx, W, H, claro ? '#173A5E' : '#ffffff', 0.10);

    let y = format==='post' ? 60 : 90;

    if(logoImgRef.current){
      ctx.save();
      ctx.beginPath();
      ctx.arc(W/2, y+40, 40, 0, Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.clip();
      ctx.drawImage(logoImgRef.current, W/2-40, y, 80, 80);
      ctx.restore();
      y += 96;
    }

    const wordFont = format==='post' ? '400 46px Anton, sans-serif' : '400 52px Anton, sans-serif';
    ctx.font = wordFont;
    const lontraW = ctx.measureText('LONTRA').width;
    const helpW = ctx.measureText('HELP').width;
    const startX = W/2 - (lontraW+helpW)/2;
    ctx.textAlign = 'left';
    ctx.fillStyle = claro ? '#173A5E' : '#ffffff';
    ctx.fillText('LONTRA', startX, y+34);
    ctx.fillStyle = '#F4C430';
    ctx.fillText('HELP', startX+lontraW, y+34);
    y += 54;

    ctx.font = '700 19px Inter, sans-serif';
    ctx.fillStyle = claro ? 'rgba(23,58,94,0.75)' : 'rgba(255,255,255,0.8)';
    ctx.textAlign = 'center';
    ctx.fillText('MONTAGEM E FORMATAÇÃO', W/2, y);
    y += 40;

    ctx.fillStyle = '#F4C430';
    ctx.fillRect(W/2-50, y, 100, 4);
    y += 48;

    const totalItens = grupos.reduce((s,g)=>s+g.itens.length,0);
    const scale = totalItens > 14 ? 0.8 : totalItens > 9 ? 0.9 : 1;

    ctx.font = `800 ${Math.round(44*scale)}px Poppins, sans-serif`;
    ctx.fillStyle = claro ? '#173A5E' : '#ffffff';
    ctx.textAlign = 'center';
    const tituloLines = wrapCanvasText(ctx, (titulo||'Serviços e Produtos Disponíveis').toUpperCase(), W/2, y, W-140, 48*scale, 2);
    y += tituloLines*48*scale + 34*scale;

    if(totalItens===0){
      ctx.font = '500 26px Inter, sans-serif';
      ctx.fillStyle = claro ? 'rgba(23,58,94,0.7)' : 'rgba(255,255,255,0.75)';
      ctx.fillText('Selecione itens do catálogo ao lado', W/2, y+40);
    }

    grupos.forEach(g=>{
      ctx.font = `700 ${Math.round(26*scale)}px Inter, sans-serif`;
      const textW = ctx.measureText(g.label).width;
      const emojiSlot = 38*scale;
      const padSide = 26*scale;
      const labelW = emojiSlot + textW + padSide*2;
      ctx.fillStyle = '#173A5E';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(W/2-labelW/2, y, labelW, 40*scale, 20*scale); else ctx.rect(W/2-labelW/2,y,labelW,40*scale);
      ctx.fill();
      ctx.textAlign = 'left';
      ctx.font = `${Math.round(24*scale)}px sans-serif`;
      ctx.fillText(g.icone, W/2-labelW/2+padSide, y+28*scale);
      ctx.font = `700 ${Math.round(26*scale)}px Inter, sans-serif`;
      ctx.fillStyle = '#F4C430';
      ctx.fillText(g.label, W/2-labelW/2+padSide+emojiSlot, y+28*scale);
      ctx.textAlign = 'center';
      y += 56*scale;

      g.itens.forEach(item=>{
        ctx.font = `700 ${Math.round(28*scale)}px Inter, sans-serif`;
        ctx.fillStyle = claro ? '#173A5E' : '#ffffff';
        ctx.textAlign = 'left';
        const priceText = 'R$ ' + formatMoney(item.preco);
        ctx.font = `800 ${Math.round(28*scale)}px Poppins, sans-serif`;
        const priceW = ctx.measureText(priceText).width;
        ctx.font = `700 ${Math.round(28*scale)}px Inter, sans-serif`;
        const maxNameW = W-180-priceW-20;
        let nome = item.nome;
        while(ctx.measureText(nome).width > maxNameW && nome.length>3){ nome = nome.slice(0,-1); }
        if(nome!==item.nome) nome = nome.slice(0,-1)+'…';
        ctx.fillText('• ' + nome, 90, y+22*scale);
        ctx.textAlign = 'right';
        ctx.font = `800 ${Math.round(28*scale)}px Poppins, sans-serif`;
        ctx.fillStyle = '#F4C430';
        ctx.fillText(priceText, W-90, y+22*scale);
        y += 42*scale;
      });
      y += 20*scale;
    });

    const footerY = H - (format==='post' ? 80 : 130);
    ctx.font = '700 28px Inter, sans-serif';
    ctx.fillStyle = claro ? '#173A5E' : '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('📲 Chame e agende agora!', W/2, footerY);
    ctx.font = '600 24px Inter, sans-serif';
    ctx.fillStyle = claro ? 'rgba(23,58,94,0.8)' : 'rgba(255,255,255,0.85)';
    ctx.fillText('(81) 9 8623-4860  ·  @lontrahelp', W/2, footerY+38);
  };

  useEffect(()=>{ if(logoLoaded && fontsReady) draw(); }, [logoLoaded, fontsReady, format, titulo, corFundo, JSON.stringify(selectedIds)]);

  const downloadImage = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const link = document.createElement('a');
    const stamp = todayISO();
    link.download = `lontrahelp-catalogo-${stamp}-${format}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  const tipoLabel = {produto:'📦 Produtos', licenca:'🔑 Licenças', servico:'🛠️ Serviços'};

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Catálogo</h1>
          <div className="page-sub">Monte um banner com os serviços e produtos disponíveis pra compartilhar com clientes</div>
        </div>
      </div>

      <div className="anuncio-layout">
        <div>
          <div className="format-toggle">
            <button className={format==='post'?'active':''} onClick={()=>setFormat('post')}>⬛ Post (quadrado)</button>
            <button className={format==='story'?'active':''} onClick={()=>setFormat('story')}>📱 Story (vertical)</button>
          </div>

          <div className="field-row">
            <div className="field">
              <label>Título do banner</label>
              <input value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Ex: Serviços e Produtos Disponíveis" />
            </div>
          </div>

          <div className="field-row">
            <div className="field" style={{maxWidth:220}}>
              <label>Cor de fundo</label>
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <input type="color" value={corFundo} onChange={e=>setCorFundo(e.target.value)} style={{width:44, height:36, padding:2, border:'1.5px solid var(--border)', borderRadius:6}} />
                <button type="button" className="btn btn-outline btn-sm" onClick={()=>setCorFundo('#5CB8E0')}>Azul claro padrão</button>
              </div>
            </div>
          </div>

          {['servico','produto','licenca'].map(tipo=>{
            const itens = products.filter(p=>p.tipo===tipo);
            if(itens.length===0) return null;
            return (
              <React.Fragment key={tipo}>
                <div className="section-bar" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <span>{tipoLabel[tipo]}</span>
                  <button className="btn btn-outline btn-sm" style={{padding:'3px 10px', fontSize:11}} onClick={()=>selectAllTipo(tipo)}>Marcar todos</button>
                </div>
                {itens.map(p=>(
                  <div key={p.id} className={`cat-select-item ${selectedIds.includes(p.id)?'checked':''}`} onClick={()=>toggleSelect(p.id)}>
                    <input type="checkbox" checked={selectedIds.includes(p.id)} onChange={()=>toggleSelect(p.id)} onClick={e=>e.stopPropagation()} />
                    <div className="csi-info">{p.nome}</div>
                    <div className="csi-price">R$ {formatMoney(p.preco)}</div>
                  </div>
                ))}
              </React.Fragment>
            );
          })}

          {products.length===0 && <div className="empty-state"><div className="ic">📦</div>Cadastre produtos ou serviços primeiro, na aba Produtos.</div>}
          {products.length>0 && (
            <button className="btn btn-outline btn-sm" onClick={clearAll} style={{marginTop:8}}>Limpar seleção</button>
          )}
        </div>

        <div className="anuncio-preview-wrap">
          <canvas ref={canvasRef} className="anuncio-canvas"></canvas>
          <button className="btn btn-gold" onClick={downloadImage}>📥 Baixar imagem PNG</button>
        </div>
      </div>
    </div>
  );
}

function FinanceiroTab({orders, despesas, setDespesas, clients, autoOpenNew}){
  const hoje = new Date();
  const [mesSelecionado, setMesSelecionado] = useState(`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`);
  const [showForm, setShowForm] = useState(false);
  const [editingDespesa, setEditingDespesa] = useState(null);

  useEffect(()=>{ if(autoOpenNew){ setEditingDespesa(null); setShowForm(true); } }, [autoOpenNew]);

  const clientName = (id)=>{
    const c = clients.find(cl=>cl.id===id);
    return c ? c.nome : 'Cliente';
  };

  // Junta OS (que já receberam algum valor) e despesas numa lista única de "transações", cada
  // uma com data e valor (positivo = entrada, negativo = saída) — isso que permite calcular o
  // saldo acumulado de verdade, somando tudo desde o início até o mês escolhido. Despesas
  // carregam o "id" original, pra dar pra editar/apagar direto dessa lista.
  const resumo = React.useMemo(()=>{
    const transacoes = [];
    orders.forEach(o=>{
      const valor = orderValorJaRecebido(o);
      if(valor > 0){
        // Usa a data de conclusão (quando o dinheiro "fechou") se já tiver sido concluída;
        // senão, usa a data de abertura da OS como aproximação de quando entrou.
        const dataRef = (orderEhFaturado(o) ? orderGarantiaInicio(o) : null) || o.dataISO;
        if(dataRef) transacoes.push({data: dataRef, valor, tipo:'entrada', desc: `OS #${o.osNumber} — ${clientName(o.clientId)}`});
      }
    });
    despesas.forEach(d=>{
      const valor = -(parseFloat(d.valor)||0);
      if(d.dataISO) transacoes.push({data: d.dataISO, valor, tipo:'despesa', desc: d.descricao || 'Despesa', despesaOriginal: d});
    });

    const [anoSel, mesSel] = mesSelecionado.split('-').map(Number);
    let saldoAcumuladoAntes = 0;
    let entradasDoMes = 0, despesasDoMes = 0;
    const transacoesDoMes = [];

    transacoes.forEach(t=>{
      const partes = (t.data||'').split('-').map(Number);
      const ano = partes[0], mes = partes[1];
      if(!ano || !mes) return;
      if(ano === anoSel && mes === mesSel){
        transacoesDoMes.push(t);
        if(t.valor > 0) entradasDoMes += t.valor; else despesasDoMes += Math.abs(t.valor);
      } else if(ano < anoSel || (ano === anoSel && mes < mesSel)){
        saldoAcumuladoAntes += t.valor;
      }
    });

    const saldoDoMes = entradasDoMes - despesasDoMes;
    transacoesDoMes.sort((a,b)=>(b.data||'').localeCompare(a.data||''));

    return {
      entradasDoMes, despesasDoMes, saldoDoMes,
      saldoAcumuladoAntes,
      saldoAcumuladoFinal: saldoAcumuladoAntes + saldoDoMes,
      transacoesDoMes,
    };
  }, [orders, despesas, clients, mesSelecionado]);

  const mudarMes = (delta)=>{
    const [ano, mes] = mesSelecionado.split('-').map(Number);
    const d = new Date(ano, mes-1+delta, 1);
    setMesSelecionado(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  };

  const nomeDoMes = ()=>{
    const [ano, mes] = mesSelecionado.split('-').map(Number);
    const d = new Date(ano, mes-1, 1);
    return d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  };

  const saveDespesa = (data)=>{
    if(editingDespesa){
      setDespesas(prev=>prev.map(d=>d.id===editingDespesa.id ? {...d, ...data} : d));
    } else {
      setDespesas(prev=>[{...data, id:uid(), createdAt:new Date().toISOString()}, ...prev]);
    }
    setShowForm(false); setEditingDespesa(null);
  };
  const deleteDespesa = (id)=>{
    if(confirm('Remover esta despesa?')) setDespesas(prev=>prev.filter(d=>d.id!==id));
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Financeiro</h1>
          <div className="page-sub">Visão mês a mês, com o saldo acumulado desde o início</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditingDespesa(null); setShowForm(true);}}>+ Nova despesa</button>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10}}>
          <button className="btn btn-outline" onClick={()=>mudarMes(-1)}>‹ Anterior</button>
          <div style={{fontWeight:800, color:'var(--navy)', fontSize:16, textTransform:'capitalize'}}>{nomeDoMes()}</div>
          <button className="btn btn-outline" onClick={()=>mudarMes(1)}>Próximo ›</button>
        </div>
      </div>

      <div className="lucro-split">
        <div className="lucro-box receita">
          <div className="lb-label" style={{color:'var(--green-ok)'}}>Entradas do mês</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(resumo.entradasDoMes)}</div>
        </div>
        <div className="lucro-box despesa">
          <div className="lb-label" style={{color:'var(--red-no)'}}>Despesas do mês</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(resumo.despesasDoMes)}</div>
        </div>
        <div className="lucro-box liquido">
          <div className="lb-label">Saldo do mês</div>
          <div className="lb-value">R$ {formatMoney(resumo.saldoDoMes)}</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16, background: resumo.saldoAcumuladoFinal >= 0 ? '#E7F5EC' : '#FDEEEC', border: `1.5px solid ${resumo.saldoAcumuladoFinal >= 0 ? 'var(--green-ok)' : 'var(--red-no)'}`}}>
        <div style={{fontSize:12, fontWeight:800, color:'var(--ink-soft)', textTransform:'uppercase'}}>Saldo acumulado (desde o início até o fim desse mês)</div>
        <div style={{fontSize:26, fontWeight:800, color: resumo.saldoAcumuladoFinal >= 0 ? 'var(--green-ok)' : 'var(--red-no)', marginTop:4}}>R$ {formatMoney(resumo.saldoAcumuladoFinal)}</div>
        <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:6}}>
          Já vinha com R$ {formatMoney(resumo.saldoAcumuladoAntes)} de saldo antes desse mês começar, {resumo.saldoDoMes>=0 ? 'e somou' : 'e descontou'} R$ {formatMoney(Math.abs(resumo.saldoDoMes))} desse mês.
        </div>
      </div>

      <div className="card">
        <h3 style={{marginTop:0, color:'var(--navy)', fontSize:15}}>📋 Registro do mês</h3>
        {resumo.transacoesDoMes.length===0 ? (
          <div style={{fontSize:13, color:'var(--ink-soft)', textAlign:'center', padding:20}}>Nenhuma entrada ou despesa registrada nesse mês.</div>
        ) : (
          resumo.transacoesDoMes.map((t, i)=>(
            <div key={i} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom: i<resumo.transacoesDoMes.length-1 ? '1px solid var(--border)' : 'none', gap:8}}>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:600, color:'var(--navy)'}}>{t.desc}</div>
                <div style={{fontSize:11.5, color:'var(--ink-soft)'}}>{formatDateBR(t.data)}{t.despesaOriginal && t.despesaOriginal.categoria ? ' · ' + t.despesaOriginal.categoria : ''}</div>
              </div>
              <div style={{fontWeight:700, color: t.valor>=0 ? 'var(--green-ok)' : 'var(--red-no)', whiteSpace:'nowrap'}}>
                {t.valor>=0 ? '+' : '-'} R$ {formatMoney(Math.abs(t.valor))}
              </div>
              {t.despesaOriginal && (
                <div style={{display:'flex', gap:4}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>{setEditingDespesa(t.despesaOriginal); setShowForm(true);}}>Editar</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>deleteDespesa(t.despesaOriginal.id)}>Excluir</button>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      {showForm && (
        <Modal title={editingDespesa ? 'Editar despesa' : 'Nova despesa'} onClose={()=>{setShowForm(false); setEditingDespesa(null);}}>
          <DespesaForm initial={editingDespesa} onSave={saveDespesa} onCancel={()=>{setShowForm(false); setEditingDespesa(null);}} />
        </Modal>
      )}
    </div>
  );
}

function RelatoriosTab({onExportExcel, clients, orders, orcamentos, despesas, products, diagnosticos}){
  const [dataInicio, setDataInicio] = useState('');
  const [dataFim, setDataFim] = useState('');
  const temFiltro = !!(dataInicio || dataFim);

  // Data de referência de cada OS pro filtro de período: usa a data de conclusão quando já
  // tiver sido concluída (é quando o dinheiro "fechou" de verdade), senão usa a data de
  // abertura — mesma lógica já usada na tela Financeiro, pra ficar consistente entre as duas.
  const dataRefOrder = (o)=> (orderEhFaturado(o) ? orderGarantiaInicio(o) : null) || o.dataISO;
  const dentroDoPeriodo = (dataISO)=>{
    if(!dataISO) return !temFiltro;
    if(dataInicio && dataISO < dataInicio) return false;
    if(dataFim && dataISO > dataFim) return false;
    return true;
  };

  const ordersFiltradas = temFiltro ? orders.filter(o=>dentroDoPeriodo(dataRefOrder(o))) : orders;
  const despesasFiltradas = temFiltro ? despesas.filter(d=>dentroDoPeriodo(d.dataISO)) : despesas;

  const receitaTotal = ordersFiltradas.reduce((s,o)=>s+orderValorJaRecebido(o),0);
  const lucroPrevistoTotal = orders.filter(orderEhAberto).reduce((s,o)=>s+orderValorPendente(o),0);
  const despesaTotal = despesasFiltradas.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);

  const sheets = [
    {nome:'Resumo', desc:'Números gerais do negócio — receita, despesas, lucro líquido, contadores.'},
    {nome:'Ordens de Serviço', desc:`${orders.length} OS — data, cliente, equipamento, status, valor, pagamento, garantia.`},
    {nome:'Orçamentos', desc:`${orcamentos.length} orçamento(s) — status, total à vista/parcelado, validade.`},
    {nome:'Itens de Orçamentos', desc:'Cada peça de cada orçamento, uma linha por item — fornecedor, garantia, valores.'},
    {nome:'Clientes', desc:`${clients.length} cliente(s) — contato, endereço completo, data de cadastro.`},
    {nome:'Despesas', desc:`${despesas.length} despesa(s) — descrição, categoria, valor, data.`},
    {nome:'Produtos e Estoque', desc:`${products.length} item(ns) — preço, custo, lucro por unidade, estoque atual/mínimo.`},
    {nome:'Garantias', desc:'Cada OS com o status da garantia física/software e se está em vistoria.'},
    {nome:'Diagnósticos', desc:`${diagnosticos.length} diagnóstico(s) — prioridade, previsão de entrega.`},
    {nome:'Agendamentos', desc:'Todos os compromissos — data, hora, duração, cliente, status.'},
  ];

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Relatórios</h1>
          <div className="page-sub">Planilha completa em Excel, com tudo detalhado linha por linha</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div style={{fontSize:12, fontWeight:800, color:'var(--ink-soft)', textTransform:'uppercase', marginBottom:8}}>📆 Filtrar por período</div>
        <div className="field-row">
          <div className="field">
            <label>De</label>
            <input type="date" value={dataInicio} onChange={e=>setDataInicio(e.target.value)} />
          </div>
          <div className="field">
            <label>Até</label>
            <input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)} />
          </div>
        </div>
        {temFiltro && (
          <button className="btn btn-outline btn-sm" onClick={()=>{setDataInicio(''); setDataFim('');}}>✕ Limpar período (voltar a ver tudo)</button>
        )}
        <div style={{fontSize:11.5, color:'var(--ink-soft)', marginTop:8}}>
          Os números abaixo mudam com o período escolhido — mas o Excel baixado continua sendo o completo, com tudo desde o início.
        </div>
      </div>

      <div className="lucro-split">
        <div className="lucro-box receita">
          <div className="lb-label" style={{color:'var(--green-ok)'}}>Receita {temFiltro ? 'do período' : 'total'} (faturado)</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(receitaTotal)}</div>
        </div>
        <div className="lucro-box despesa">
          <div className="lb-label" style={{color:'var(--red-no)'}}>Despesas {temFiltro ? 'do período' : 'totais'}</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(despesaTotal)}</div>
        </div>
        <div className="lucro-box liquido">
          <div className="lb-label">Lucro líquido {temFiltro ? 'do período' : ''}</div>
          <div className="lb-value">R$ {formatMoney(receitaTotal - despesaTotal)}</div>
        </div>
      </div>
      <div className="lucro-split" style={{marginTop:-4}}>
        <div className="lucro-box receita">
          <div className="lb-label" style={{color:'#9C7A05'}}>🔮 Lucro previsto (OS em aberto, ainda não concluídas)</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(lucroPrevistoTotal)}</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>

/* ---------------- IMPORTAR PDF ---------------- */
function extractPdfField(text, label, nextLabels, ignorecase){
  const esc = (s)=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const nextPattern = nextLabels.map(esc).join('|');
  const flags = 'gs' + (ignorecase===false ? '' : 'i');
  const re = new RegExp(esc(label) + '[ \\t]*:?[ \\t]*(.*?)\\s*(?=' + nextPattern + '|$)', flags);
  const m = re.exec(text);
  return m ? m[1].trim() : '';
}
function extractPdfLine(text, label){
  const esc = (s)=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp(esc(label) + '[ \\t]*:?[ \\t]*([^\\n]*)', 'i');
  const m = re.exec(text);
  return m ? m[1].trim() : '';
}
function parseReciboPdfText(text){
  const osNumber = extractPdfField(text, 'Nº OS', ['Data']);
  const dataRaw = extractPdfField(text, 'Data', ['Técnico Responsável']);
  const tecnico = extractPdfField(text, 'Técnico Responsável', ['DADOS DO CLIENTE','Nome Completo']);
  const nome = extractPdfField(text, 'Nome Completo', ['CPF']);
  const cpfCnpj = extractPdfField(text, 'CPF / CNPJ', ['Telefone']);
  const telefone = extractPdfField(text, 'Telefone', ['SERVIÇO PRESTADO','Equipamento']);
  const equipamento = extractPdfField(text, 'Equipamento', ['Nº de Série']);
  const numeroSerie = extractPdfLine(text, 'Nº de Série');

  const valorSection = extractPdfField(text, 'VALOR TOTAL', ['Forma de Pagamento']);
  const valorMatch = /R\$\s*([\d.,]+)/.exec(valorSection);
  const valor = valorMatch ? valorMatch[1].replace(/\./g,'').replace(',','.') : '';

  const fpMatch = /\(\s*[xX]\s*\)\s*(Dinheiro|PIX|Cart[ãa]o|Outro)/.exec(text);
  const formaPagamento = fpMatch ? fpMatch[1] : '';

  let dataISO = '';
  const dm = /(\d{2})\/(\d{2})\/(\d{4})/.exec(dataRaw);
  if(dm) dataISO = `${dm[3]}-${dm[2]}-${dm[1]}`;

  let servicoTexto = '';
  const serieLineRe = /Nº de Série[ \t]*:?[ \t]*[^\n]*\n/i;
  const serieLineMatch = serieLineRe.exec(text);
  if(serieLineMatch){
    const start = serieLineMatch.index + serieLineMatch[0].length;
    let valIdx = text.indexOf('VALOR TOTAL', start);
    if(valIdx===-1) valIdx = text.indexOf('PAGAMENTO', start);
    if(valIdx>-1){
      servicoTexto = text.slice(start, valIdx).trim().replace(/\nPAGAMENTO\s*$/,'').trim();
    }
  }

  return {osNumber, dataISO, tecnico, nome, cpfCnpj, telefone, equipamento, numeroSerie, valor, formaPagamento, servicoTexto};
}

function ImportarTab({clients, setClients, orders, setOrders, config, setConfig, goTo}){
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState('');
  const [dadosExtraidos, setDadosExtraidos] = useState(null);
  const [rawTextPreview, setRawTextPreview] = useState('');
  const fileRef = useRef(null);

  const extractPdfTextByPosition = async (pdf)=>{
    let fullText = '';
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const items = content.items;
      const lines = [];
      let currentLine = null;
      let lastY = null;
      let lastEndX = null;
      items.forEach(item=>{
        if(!item.str) return;
        const x = item.transform[4];
        const y = item.transform[5];
        const roundedY = Math.round(y);
        const heightGuess = Math.abs(item.transform[3]) || 10;
        if(currentLine===null || lastY===null || Math.abs(roundedY-lastY) > heightGuess*0.4){
          if(currentLine!==null) lines.push(currentLine);
          currentLine = item.str;
        } else {
          const gap = x - (lastEndX===null ? x : lastEndX);
          if(gap > heightGuess*0.22){
            currentLine += ' ' + item.str;
          } else {
            currentLine += item.str;
          }
        }
        lastEndX = x + (item.width||0);
        lastY = roundedY;
      });
      if(currentLine!==null) lines.push(currentLine);
      fullText += lines.join('\n') + '\n';
    }
    return fullText;
  };

  const handleFile = async (file)=>{
    if(!file) return;
    setErro(''); setDadosExtraidos(null); setCarregando(true);
    try{
      if(typeof pdfjsLib === 'undefined'){
        setErro('A biblioteca de leitura de PDF não carregou (precisa de internet). Tente novamente com conexão.');
        setCarregando(false);
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
      const fullText = await extractPdfTextByPosition(pdf);
      setRawTextPreview(fullText.slice(0,400));
      const parsed = parseReciboPdfText(fullText);
      setDadosExtraidos({...parsed, dataISO: parsed.dataISO || todayISO()});
    }catch(e){
      setErro('Não foi possível ler esse PDF (' + (e.message||'erro desconhecido') + '). Talvez esteja escaneado como imagem, sem texto selecionável — nesse caso não dá pra extrair automaticamente, é preciso cadastrar manualmente.');
    }
    setCarregando(false);
  };

  const setCampo = (k,v)=> setDadosExtraidos(prev=>({...prev, [k]:v}));

  const confirmarImportacao = ()=>{
    if(!dadosExtraidos.nome.trim()){
      alert('Preencha pelo menos o nome do cliente antes de importar.');
      return;
    }
    let clientId = null;
    const existente = clients.find(c=>c.nome.trim().toLowerCase()===dadosExtraidos.nome.trim().toLowerCase());
    if(existente){
      clientId = existente.id;
      setClients(prev=>prev.map(c=>c.id===existente.id ? {
        ...c,
        telefone: c.telefone || dadosExtraidos.telefone,
        cpfCnpj: c.cpfCnpj || dadosExtraidos.cpfCnpj,
      } : c));
    } else {
      clientId = uid();
      setClients(prev=>[{
        id:clientId, nome:dadosExtraidos.nome, telefone:dadosExtraidos.telefone||'', cpfCnpj:dadosExtraidos.cpfCnpj||'',
        email:'', rua:'', numero:'', bairro:'', cidade:'', uf:'', cep:'', observacoes:'Importado de PDF antigo.',
        createdAt:new Date().toISOString(), interacoes:[]
      }, ...prev]);
    }

    const novoOrderId = uid();
    setConfig(prevConfig=>{
      const counter = (prevConfig.osCounter||1000000)+1;
      const novaOrdem = {
        id: novoOrderId,
        osNumber: dadosExtraidos.osNumber || generateOsNumber(counter),
        dataISO: dadosExtraidos.dataISO || todayISO(),
        tecnico: dadosExtraidos.tecnico || 'Gabriel',
        clientId,
        equipamento: dadosExtraidos.equipamento || '',
        numeroSerie: dadosExtraidos.numeroSerie || '',
        observacoes: dadosExtraidos.servicoTexto || '',
        valor: dadosExtraidos.valor || '',
        formaPagamento: dadosExtraidos.formaPagamento || '',
        garantiaFisicaDias: 90, garantiaSoftwareDias: 7,
        status: 'concluido', pagamentoRecebido: true,
        statusHistorico: [{status:'concluido', nota:'Importado de PDF antigo', data:new Date().toISOString()}],
        createdAt: new Date().toISOString()
      };
      setOrders(prevOrders=>[novaOrdem, ...prevOrders]);
      return {...prevConfig, osCounter:counter};
    });

    setDadosExtraidos(null);
    setRawTextPreview('');
    if(fileRef.current) fileRef.current.value = '';
    alert('Importado com sucesso! Cliente e Ordem de Serviço criados a partir do PDF.');
    goTo('ordens', null, null, novoOrderId);
  };

  const cancelarRevisao = ()=>{
    setDadosExtraidos(null);
    setRawTextPreview('');
    if(fileRef.current) fileRef.current.value = '';
  };

  if(dadosExtraidos){
    const campos = [
      {k:'nome', label:'Nome do cliente'},
      {k:'telefone', label:'Telefone'},
      {k:'cpfCnpj', label:'CPF/CNPJ'},
      {k:'osNumber', label:'Nº da OS original'},
      {k:'dataISO', label:'Data', type:'date'},
      {k:'tecnico', label:'Técnico'},
      {k:'equipamento', label:'Equipamento'},
      {k:'numeroSerie', label:'Nº de Série'},
      {k:'valor', label:'Valor (R$)', type:'number'},
      {k:'formaPagamento', label:'Forma de pagamento'},
    ];
    return (
      <div>
        <div className="page-header">
          <div>
            <h1 className="page-title">Revisar antes de importar</h1>

          </div>
        </div>

        <div className="import-review-box">
          ✏️ O sistema leu o PDF e tentou identificar os campos abaixo. Textos de PDF nem sempre saem perfeitos — revise tudo antes de importar, principalmente o nome do cliente.
        </div>

        <div className="field-row">
          {campos.slice(0,4).map(c=>(
            <div className="field" key={c.k}>
              <label>{c.label} {dadosExtraidos[c.k] ? <span className="import-field-status found">encontrado</span> : <span className="import-field-status missing">não encontrado</span>}</label>

        </div>
        <div className="field-row">
          {campos.slice(4,8).map(c=>(
            <div className="field" key={c.k}>
              <label>{c.label} {dadosExtraidos[c.k] ? <span className="import-field-status found">encontrado</span> : <span className="import-field-status missing">não encontrado</span>}</label>
              <input type={c.type||'text'} value={dadosExtraidos[c.k]||''} onChange={e=>setCampo(c.k, e.target.value)} />
            </div>
          ))}
        </div>
        <div className="field-row">
          {campos.slice(8).map(c=>(
            <div className="field" key={c.k}>
              <label>{c.label} {dadosExtraidos[c.k] ? <span className="import-field-status found">encontrado</span> : <span className="import-field-status missing">não encontrado</span>}</label>
              <input type={c.type||'text'} value={dadosExtraidos[c.k]||''} onChange={e=>setCampo(c.k, e.target.value)} />
            </div>
          ))}
        </div>

        <div className="section-bar">Descrição do serviço prestado</div>
        <div className="field-row">
          <div className="field">
            <textarea value={dadosExtraidos.servicoTexto||''} onChange={e=>setCampo('servicoTexto', e.target.value)} style={{minHeight:130}} />
          </div>

        <div style={{display:'flex', justifyContent:'flex-end', flexWrap:'wrap', gap:10, marginTop:16}}>

          <button className="btn btn-gold" style={{flex:'1 1 200px'}} onClick={confirmarImportacao}>✔ Confirmar e importar</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Importar PDF</h1>
          <div className="page-sub">Traga recibos antigos (de antes do sistema) pra dentro do LontraHelp</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <p style={{fontSize:13, color:'var(--ink-soft)', lineHeight:1.7, marginTop:0}}>
          Funciona melhor com PDFs gerados pelo próprio recibo do sistema (ou no mesmo formato). O sistema lê o texto do arquivo, tenta identificar cliente, equipamento, valor e forma de pagamento — e sempre te mostra tudo pra revisar antes de criar o registro. Nada é importado sem você confirmar.
        </p>
        <p style={{fontSize:12.5, color:'var(--ink-soft)', lineHeight:1.6}}>

// ---------------------------------------------------------------------
// Transferência por QR Code — divide o backup em pedacinhos, mostra cada um como um QR Code
// diferente (indo pro próximo sozinho), e o outro aparelho vai escaneando e juntando tudo com
// a câmera. Não depende de rede WiFi nenhuma — só tela e câmera.
// ---------------------------------------------------------------------
const QR_TAMANHO_PEDACO = 700; // caracteres de texto por QR Code — equilíbrio entre poucos QR
                                 // Codes (mais rápido) e QR Codes fáceis de escanear (não fica denso demais)
const QR_PREFIXO = 'LH'; // só pra confirmar que é um QR Code do nosso protocolo, não outro qualquer

function dividirEmPedacosQR(texto){
  const pedacos = [];
  for(let i=0; i<texto.length; i+=QR_TAMANHO_PEDACO){
    pedacos.push(texto.slice(i, i+QR_TAMANHO_PEDACO));
  }
  return pedacos.map((pedaco, indice)=> `${QR_PREFIXO}${indice}/${pedacos.length}:${pedaco}`);
}

function MostrarQRCodeModal({dados, onClose}){
  const canvasRef = useRef(null);
  const [indiceAtual, setIndiceAtual] = useState(0);
  const [velocidade, setVelocidade] = useState(350); // ms entre cada QR Code
  const pedacos = React.useMemo(()=> dividirEmPedacosQR(dados), [dados]);

  useEffect(()=>{
    const intervalo = setInterval(()=>{
      setIndiceAtual(prev => (prev + 1) % pedacos.length);
    }, velocidade);
    return ()=> clearInterval(intervalo);
  }, [pedacos.length, velocidade]);

  useEffect(()=>{
    if(canvasRef.current && pedacos[indiceAtual] && window.QRCode){
      window.QRCode.toCanvas(canvasRef.current, pedacos[indiceAtual], {width:280, margin:1, errorCorrectionLevel:'L'}, ()=>{});
    }
  }, [indiceAtual, pedacos]);

  return (
    <div style={{position:'fixed', inset:0, background:'rgba(15,44,72,0.92)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
      <div style={{background:'#fff', borderRadius:16, padding:24, maxWidth:360, width:'100%', textAlign:'center'}}>
        <h3 style={{marginTop:0, color:'var(--navy)'}}>📱 Mostrando QR Code</h3>
        <p style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:14}}>
          Aponta a câmera do outro aparelho pra tela. Fica passando sozinho — não precisa fazer nada, só esperar.
        </p>
        <canvas ref={canvasRef} style={{width:'100%', maxWidth:280, borderRadius:8}}></canvas>
        <div style={{marginTop:14, fontSize:13, fontWeight:700, color:'var(--navy)'}}>
          Pedaço {indiceAtual+1} de {pedacos.length}
        </div>
        <div style={{background:'#EDEFF2', height:6, borderRadius:3, marginTop:8, overflow:'hidden'}}>
          <div style={{background:'var(--gold)', height:'100%', width:`${((indiceAtual+1)/pedacos.length)*100}%`, transition:'width 0.2s'}}></div>
        </div>
        <p style={{fontSize:11, color:'var(--ink-soft)', marginTop:10}}>
          Fica repetindo em loop até você fechar — assim, se o outro aparelho perder algum pedaço, ele pega na próxima volta.
        </p>
        <button className="btn btn-outline" style={{marginTop:14, width:'100%'}} onClick={onClose}>Fechar</button>
      </div>
    </div>
  );
}

function EscanearQRCodeModal({onDadosCompletos, onClose}){
  const videoRef = useRef(null);
  const canvasOcultoRef = useRef(null);
  const streamRef = useRef(null);
  const pedacosRecebidos = useRef({}); // {indice: texto}
  const totalEsperado = useRef(null);
  const [progresso, setProgresso] = useState({recebidos:0, total:null});
  const [erro, setErro] = useState('');
  const [concluido, setConcluido] = useState(false);

  useEffect(()=>{
    let ativo = true;
    let intervaloLeitura = null;

    const iniciar = async ()=>{
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        if(!ativo){ stream.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current = stream;
        if(videoRef.current){
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        intervaloLeitura = setInterval(processarFrame, 200);
      }catch(e){
        setErro('Não consegui acessar a câmera (' + (e.message||'permissão negada') + '). Confere se você permitiu o uso da câmera pro app.');
      }
    };

    const processarFrame = ()=>{
      if(!videoRef.current || !canvasOcultoRef.current || !window.jsQR) return;
      const video = videoRef.current;
      if(video.readyState !== video.HAVE_ENOUGH_DATA) return;
      const canvas = canvasOcultoRef.current;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const codigo = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(codigo && codigo.data && codigo.data.startsWith(QR_PREFIXO)){
        processarTextoQR(codigo.data);
      }
    };

    const processarTextoQR = (texto)=>{
      const semPrefixo = texto.slice(QR_PREFIXO.length);
      const posDoisPontos = semPrefixo.indexOf(':');
      if(posDoisPontos===-1) return;
      const cabecalho = semPrefixo.slice(0, posDoisPontos);
      const conteudo = semPrefixo.slice(posDoisPontos+1);
      const [indiceStr, totalStr] = cabecalho.split('/');
      const indice = parseInt(indiceStr), total = parseInt(totalStr);
      if(isNaN(indice) || isNaN(total)) return;

      if(totalEsperado.current === null) totalEsperado.current = total;
      if(!(indice in pedacosRecebidos.current)){
        pedacosRecebidos.current[indice] = conteudo;
      }
      const recebidos = Object.keys(pedacosRecebidos.current).length;
      setProgresso({recebidos, total});

      if(recebidos === total){
        // já tem todos os pedaços — remonta na ordem certinha
        let textoCompleto = '';
        for(let i=0; i<total; i++) textoCompleto += pedacosRecebidos.current[i];
        setConcluido(true);
        pararCamera();
        onDadosCompletos(textoCompleto);
      }
    };

    const pararCamera = ()=>{
      if(intervaloLeitura) clearInterval(intervaloLeitura);
      if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    };

    iniciar();
    return ()=>{ ativo = false; pararCamera(); };
  }, []);

  return (
    <div style={{position:'fixed', inset:0, background:'rgba(15,44,72,0.92)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
      <div style={{background:'#fff', borderRadius:16, padding:24, maxWidth:360, width:'100%', textAlign:'center'}}>
        <h3 style={{marginTop:0, color:'var(--navy)'}}>📷 Escaneando QR Code</h3>
        {erro ? (
          <div style={{background:'#FDEEEC', color:'var(--red-no)', padding:12, borderRadius:8, fontSize:12.5}}>{erro}</div>
        ) : (
          <React.Fragment>
            <p style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:10}}>
              Aponta a câmera pra tela do outro aparelho, mostrando o QR Code que fica passando.
            </p>
            <video ref={videoRef} playsInline muted style={{width:'100%', borderRadius:8, background:'#000'}}></video>
            <canvas ref={canvasOcultoRef} style={{display:'none'}}></canvas>
            <div style={{marginTop:14, fontSize:13, fontWeight:700, color:'var(--navy)'}}>
              {progresso.total ? `${progresso.recebidos} de ${progresso.total} pedaços recebidos` : 'Procurando QR Code...'}
            </div>
            {progresso.total && (
              <div style={{background:'#EDEFF2', height:6, borderRadius:3, marginTop:8, overflow:'hidden'}}>
                <div style={{background:'var(--gold)', height:'100%', width:`${(progresso.recebidos/progresso.total)*100}%`, transition:'width 0.2s'}}></div>
              </div>
            )}
          </React.Fragment>
        )}
        <button className="btn btn-outline" style={{marginTop:14, width:'100%'}} onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}

/* ---------------- RECIBOS TAB ---------------- */
function RecibosTab({orders, setOrders, clients, focusOrderId, config}){
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(focusOrderId || null);
  const [documento, setDocumento] = useState('recibo');
  const [assinandoQuem, setAssinandoQuem] = useState(null); // 'cliente' | 'tecnico' | null
  useEffect(()=>{ if(focusOrderId) setSelectedId(focusOrderId); }, [focusOrderId]);

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || '—';
  const filtered = orders.filter(o=> o.osNumber.includes(search) || clientName(o.clientId).toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=> b.dataISO.localeCompare(a.dataISO));

  const selectedOrder = orders.find(o=>o.id===selectedId);
  const selectedClient = selectedOrder ? clients.find(c=>c.id===selectedOrder.clientId) : null;
  useDocumentTitle(selectedOrder ? `OS ${selectedOrder.osNumber} - ${selectedClient ? selectedClient.nome : 'Cliente'}` : null);
  const temAdiantamento = selectedOrder && orderUsaItens(selectedOrder) && computeOrderTotals(selectedOrder).itensComAdiantamento.length>0;
  const temSinalParcial = selectedOrder && !orderEhFaturado(selectedOrder) && orderValorJaRecebido(selectedOrder)>0;

  const salvarAssinatura = (dataUrl)=>{
    const campo = assinandoQuem==='cliente' ? 'assinaturaClienteDataUrl' : 'assinaturaTecnicoDataUrl';
    setOrders(prev=>prev.map(o=>o.id===selectedOrder.id ? {...o, [campo]: dataUrl} : o));
    setAssinandoQuem(null);
  };
  const apagarAssinatura = (quem)=>{
    const campo = quem==='cliente' ? 'assinaturaClienteDataUrl' : 'assinaturaTecnicoDataUrl';
    setOrders(prev=>prev.map(o=>o.id===selectedOrder.id ? {...o, [campo]: null} : o));
  };

  if(selectedOrder){
    return (
      <div>
        <div className="receipt-toolbar no-print">
          <button className="btn btn-outline btn-sm" onClick={()=>setSelectedId(null)}>← Voltar para recibos</button>
          <button className="btn btn-gold" onClick={imprimirDocumento}>📄 Salvar / Compartilhar PDF</button>
        </div>
        {documento==='recibo' && (
          <div className="no-print" style={{maxWidth:460, margin:'0 auto 16px', display:'flex', gap:8, flexWrap:'wrap', justifyContent:'center'}}>
            <button className="btn btn-outline btn-sm" onClick={()=>setAssinandoQuem('cliente')}>
              ✍️ {selectedOrder.assinaturaClienteDataUrl ? 'Refazer' : 'Adicionar'} assinatura do cliente
            </button>
            {selectedOrder.assinaturaClienteDataUrl && <button className="btn btn-outline btn-sm" onClick={()=>apagarAssinatura('cliente')}>🗑 Cliente</button>}
            <button className="btn btn-outline btn-sm" onClick={()=>setAssinandoQuem('tecnico')}>
              ✍️ {selectedOrder.assinaturaTecnicoDataUrl ? 'Refazer' : 'Adicionar'} assinatura do técnico
            </button>
            {selectedOrder.assinaturaTecnicoDataUrl && <button className="btn btn-outline btn-sm" onClick={()=>apagarAssinatura('tecnico')}>🗑 Técnico</button>}
          </div>
        )}
        {assinandoQuem && (
          <SignaturePad
            titulo={assinandoQuem==='cliente' ? 'Assinatura do Cliente' : 'Assinatura do Técnico'}
            onSalvar={salvarAssinatura}
            onCancel={()=>setAssinandoQuem(null)}
          />
        )}
        {(temAdiantamento || temSinalParcial) && (
          <div className="filter-toggle no-print" style={{maxWidth:460, margin:'0 auto 16px'}}>
            <button className={documento==='recibo'?'active':''} onClick={()=>setDocumento('recibo')}>🧾 Recibo</button>
            {temAdiantamento && <button className={documento==='declaracao'?'active':''} onClick={()=>setDocumento('declaracao')}>📜 Declaração</button>}
            {temSinalParcial && <button className={documento==='sinal'?'active':''} onClick={()=>setDocumento('sinal')}>💰 Recibo de Sinal</button>}
          </div>
        )}
        {documento==='declaracao' && temAdiantamento && <DeclaracaoView order={selectedOrder} client={selectedClient} />}
        {documento==='sinal' && temSinalParcial && <ReciboSinalView order={selectedOrder} client={selectedClient} />}
        {(documento==='recibo' || (documento==='declaracao' && !temAdiantamento) || (documento==='sinal' && !temSinalParcial)) && <ReceiptView order={selectedOrder} client={selectedClient} config={config} />}
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Recibos</h1>
          <div className="page-sub">Consulte, imprima ou salve os recibos de OS já emitidos</div>
        </div>
      </div>
      <div className="search-bar">
        <input placeholder="Buscar por nº da OS ou cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {filtered.length===0 && <div className="empty-state"><div className="ic">🧾</div>Nenhum recibo encontrado.</div>}
      {filtered.map(o=>(
        <div className="list-item" key={o.id} onClick={()=>setSelectedId(o.id)}>
          <div className="li-main">
            <strong>OS #{o.osNumber} — {clientName(o.clientId)}</strong>
            <div className="meta">{formatDateBR(o.dataISO)} · R$ {formatMoney(o.valor)}</div>
          </div>
          <span className="pill pill-gold">Ver recibo</span>
        </div>
      ))}
    </div>
  );
}

/* ---------------- ENDEREÇO POR ABA ----------------
   Cada aba tem seu próprio endereço, pra dar pra salvar nos favoritos, abrir direto ou mandar o link:
   - no GitHub Pages: .../sistema-lontra-help/agendamento  (precisa do 404.html = cópia do index.html)
   - no app (Android/Windows), Amplify e arquivo local: ...#/agendamento  (funciona sem servidor) */
const ABAS_COM_ENDERECO = ['inicio','clientes','agendamento','ordens','diagnostico','orcamentos','produtos','estoque','devolucoes','dividas','etiquetas','garantia','recibos','declaracoes','anuncio','promocoes','financeiro','catalogo','divulgacao','relatorios','importar','backup','configuracoes'];
const NAV_ABAS_TITULO = {inicio:'Início', clientes:'Clientes', agendamento:'Agendamento', ordens:'Ordens de Serviço', diagnostico:'Diagnóstico', orcamentos:'Orçamentos', produtos:'Produtos', estoque:'Estoque', devolucoes:'Devoluções', dividas:'Dívidas', etiquetas:'Etiquetas', garantia:'Garantia', recibos:'Recibos', declaracoes:'Declarações', anuncio:'Anúncio', promocoes:'Promoções', financeiro:'Financeiro', catalogo:'Catálogo', divulgacao:'Divulgação', relatorios:'Relatórios', importar:'Importar PDF', backup:'Backup', configuracoes:'Configurações'};
function rotaPorCaminho(){
  try{ return /\.github\.io$/i.test(location.hostname) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
  catch(e){ return false; }
}
function rotaBase(){
  // site de projeto do GitHub Pages: /<repositório>/
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return seg ? `/${seg}/` : '/';
}
function lerAbaDoEndereco(){
  try{
    let slug = '';
    if(rotaPorCaminho()) slug = location.pathname.slice(rotaBase().length).split('/')[0];
    else slug = ((location.hash||'').match(/^#\/([a-z_]+)/)||[])[1] || '';
    slug = decodeURIComponent(slug||'').toLowerCase();
    return ABAS_COM_ENDERECO.includes(slug) ? slug : 'inicio';
  }catch(e){ return 'inicio'; }
}
function gravarAbaNoEndereco(aba){
  try{
    if(lerAbaDoEndereco()===aba) return;
    const url = rotaPorCaminho()
      ? rotaBase() + (aba==='inicio' ? '' : aba) + location.search
      : location.pathname + location.search + (aba==='inicio' ? '' : '#/' + aba);
    history.pushState({aba}, '', url);
  }catch(e){ /* navegador sem History API: segue só com a aba na tela */ }
}

/* ---------------- APP ROOT ---------------- */
function App({onLogout}){
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState(lerAbaDoEndereco);
  // aba ↔ endereço: trocar de aba muda o endereço; voltar/avançar do navegador troca a aba
  useEffect(()=>{
    gravarAbaNoEndereco(tab);
    // nome da aba do navegador = nome da tela; não atropela um título de PDF que a tela tenha posto
    try{
      const anterior = window.__lhTituloAba;
      const novo = `${NAV_ABAS_TITULO[tab]||'Início'} — LontraHelp`;
      window.__lhTituloAba = novo;
      if(document.title===DEFAULT_TITLE || document.title===anterior) document.title = novo;
    }catch(e){}
  }, [tab]);
  useEffect(()=>{
    const aoVoltar = ()=> setTab(lerAbaDoEndereco());
    window.addEventListener('popstate', aoVoltar);
    window.addEventListener('hashchange', aoVoltar);
    return ()=>{ window.removeEventListener('popstate', aoVoltar); window.removeEventListener('hashchange', aoVoltar); };
  }, []);
  const [avisoSairApp, setAvisoSairApp] = useState(false);
  const [clients, setClients] = useState([]);
  const [orders, setOrders] = useState([]);
  const [appointments, setAppointments] = useState([]);
  const [products, setProducts] = useState([]);
  const [builds, setBuilds] = useState([]);
  const [orcamentos, setOrcamentos] = useState([]);
  const [promocoes, setPromocoes] = useState([]);
  const [despesas, setDespesas] = useState([]);
  const [diagnosticos, setDiagnosticos] = useState([]);
  const [devolucoes, setDevolucoes] = useState([]);
  const [devolucoesFornecedor, setDevolucoesFornecedor] = useState([]);
  const [dividas, setDividas] = useState([]);
  const [config, setConfig] = useState({osCounter:1000000});
  // Registro de exclusões: toda vez que algo é apagado (em qualquer lista), fica anotado aqui
  // {id, tipo, deletedAt}. Isso é o que impede um item apagado de "ressuscitar" quando mescla
  // com uma versão mais antiga vinda da nuvem — sem isso, mesclar não tem como saber a diferença
  // entre "isso é novo, veio de outro aparelho" e "isso foi apagado, mas a nuvem ainda não sabe".
  const [tombstones, setTombstones] = useState([]);

  // Sinalizador de "algo mudou de verdade" — só sobe quando uma tela realmente SALVA um registro
  // (clicou em Salvar, Excluir, mudou status, etc), nunca por só abrir/navegar entre telas.
  // A sincronização com a nuvem escuta ESSE sinal, não os dados brutos, pra não disparar à toa.
  const [syncTrigger, setSyncTrigger] = useState(0);
  const marcarParaSincronizar = ()=> setSyncTrigger(t=>t+1);

  // Versões "sinalizadoras" dos setters — fazem exatamente a mesma coisa que os originais,
  // só que também avisam a sincronização que um salvamento de verdade aconteceu, E detectam
  // sozinhas quando algum item desaparece da lista (= foi apagado), registrando isso no
  // "registro de exclusão" — pra esse item nunca mais ressuscitar numa mesclagem futura.
  // São essas (não as originais) que vão pras telas (ClientesTab, OrdensTab, etc) via propriedade.
  const registrarExclusoes = (antes, depois, tipo)=>{
    const idsAntes = new Set((antes||[]).map(i=>i && i.id).filter(Boolean));
    const idsDepois = new Set((depois||[]).map(i=>i && i.id).filter(Boolean));
    const removidos = [...idsAntes].filter(id=>!idsDepois.has(id));
    if(removidos.length>0){
      const agora = new Date().toISOString();
      setTombstones(prev=>[...prev, ...removidos.map(id=>({id, tipo, deletedAt: agora}))]);
    }
  };
  const criarSetterSync = (setter, tipo)=> (v)=>{
    setter(prev=>{
      const proximo = typeof v === 'function' ? v(prev) : v;
      registrarExclusoes(prev, proximo, tipo);
      return proximo;
    });
    marcarParaSincronizar();
  };
  const setClientsSync = criarSetterSync(setClients, 'clients');
  const setOrdersSync = criarSetterSync(setOrders, 'orders');
  const setAppointmentsSync = criarSetterSync(setAppointments, 'appointments');

  const setDevolucoesSync = criarSetterSync(setDevolucoes, 'devolucoes');
  const setDevolucoesFornecedorSync = criarSetterSync(setDevolucoesFornecedor, 'devolucoesFornecedor');
  const setDividasSync = criarSetterSync(setDividas, 'dividas');
  const [navFlag, setNavFlag] = useState({key:0, autoNew:false, presetClientId:null, focusOrderId:null, focusDate:null});
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [canShare, setCanShare] = useState(false);

  }, []);

  useEffect(()=>{

  useEffect(()=>{

      setClients(c); setOrders(o); setAppointments(a); setProducts(p); setBuilds(bl); setOrcamentos(orc); setPromocoes(promo); setDespesas(desp); setDiagnosticos(diag); setDevolucoes(dev); setDevolucoesFornecedor(devF); setDividas(div); setConfig(cfg); setTombstones(tomb);

  useEffect(()=>{ if(loaded) saveData('lh_produtos', products); }, [products, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_etiquetas', builds); }, [builds, loaded]);
  useEffect(()=>{ if(loaded) saveData('lh_orcamentos', orcamentos); }, [orcamentos, loaded]);
