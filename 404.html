function EtiquetasTab({builds, setBuilds, clients}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [documentoAtivo, setDocumentoAtivo] = useState('etiqueta');

  const clientName = (id)=> id ? ((clients.find(c=>c.id===id)||{}).nome || '—') : null;

  const matches = (b, term)=>{
    const t = term.toLowerCase();
    const fields = [b.serial, b.apelido, b.placaMae && b.placaMae.serial, b.processador && b.processador.serial,
      b.memoriaRam && b.memoriaRam.serial, b.armazenamento && b.armazenamento.serial, b.fonte && b.fonte.serial,
      clientName(b.clientId)];
    return fields.some(f=> f && f.toLowerCase().includes(t));
  };
  const filtered = builds.filter(b=> !search || matches(b, search)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const selected = builds.find(b=>b.id===selectedId);

  const saveBuild = (data)=>{
    if(editing){
      setBuilds(prev=>prev.map(b=>b.id===editing.id ? {...b, ...data} : b));
    } else {
      setBuilds(prev=>[{...data, id:uid(), createdAt:new Date().toISOString()}, ...prev]);
    }
    setShowForm(false); setEditing(null);
  };
  const deleteBuild = (id)=>{
    if(confirm('Remover este registro de computador?')){
      setBuilds(prev=>prev.filter(b=>b.id!==id));
      if(selectedId===id) setSelectedId(null);
    }
  };

  if(selected){
    const clienteDoSelecionado = clients.find(c=>c.id===selected.clientId);
    return (
      <div>
        <div className="receipt-toolbar no-print">
          <button className="btn btn-outline btn-sm" onClick={()=>setSelectedId(null)}>← Voltar para etiquetas</button>
          <div style={{display:'flex', gap:10}}>
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(selected); setShowForm(true);}}>Editar dados</button>
            <button className="btn btn-gold" onClick={imprimirDocumento}>📄 Salvar / Compartilhar PDF</button>
          </div>
        </div>
        <div className="filter-toggle no-print" style={{maxWidth:400, margin:'0 auto 16px'}}>
          <button className={documentoAtivo==='etiqueta'?'active':''} onClick={()=>setDocumentoAtivo('etiqueta')}>🏷️ Etiqueta</button>
          <button className={documentoAtivo==='certificado'?'active':''} onClick={()=>setDocumentoAtivo('certificado')}>📜 Certificado</button>
        </div>
        {documentoAtivo==='etiqueta' ? <EtiquetaSimplesPrint build={selected} /> : <CertificadoView build={selected} client={clienteDoSelecionado} />}
        {showForm && (
          <Modal title="Editar computador" onClose={()=>{setShowForm(false); setEditing(null);}} wide>
            <BuildForm initial={editing} clients={clients} onSave={saveBuild} onCancel={()=>{setShowForm(false); setEditing(null);}} />
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Etiquetas</h1>
          <div className="page-sub">Registro de computadores montados e geração de etiquetas de série</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Nova etiqueta</button>
      </div>
      <div className="search-bar">
        <input placeholder="Buscar por nº de série (qualquer componente), apelido ou cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {filtered.length===0 && <div className="empty-state"><div className="ic">🏷️</div>Nenhum computador registrado ainda.</div>}
      {filtered.map(b=>(
        <div className="list-item" key={b.id} onClick={()=>setSelectedId(b.id)}>
          <div className="li-main">
            <strong>{b.apelido || 'Computador sem apelido'}</strong>
            <div className="meta">Nº série: {b.serial} {clientName(b.clientId) && `· Cliente: ${clientName(b.clientId)}`}</div>
          </div>
          <div style={{display:'flex', gap:6}}>
            <button className="btn btn-outline btn-sm" onClick={(e)=>{e.stopPropagation(); setEditing(b); setShowForm(true);}}>Editar</button>
            <button className="btn btn-danger btn-sm" onClick={(e)=>{e.stopPropagation(); deleteBuild(b.id);}}>Excluir</button>
          </div>
        </div>
      ))}

      {showForm && (
        <Modal title={editing ? 'Editar computador' : 'Novo computador / etiqueta'} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
          <BuildForm initial={editing} clients={clients} onSave={saveBuild} onCancel={()=>{setShowForm(false); setEditing(null);}} />
        </Modal>
      )}
    </div>
  );
}

function buildDevolucaoText(dev, clientName){
  const tipoLabel = {troca:'Troca', credito:'Crédito', estorno:'Estorno'};
  const linhas = [
    `🔄 *Devolução — LontraHelp*`,
    ``,
    `Olá${clientName ? ', ' + clientName.split(' ')[0] : ''}!`,
    `Produto: ${dev.produtoNome}`,
    `Tipo de resolução: ${tipoLabel[dev.tipo]}`,
  ];
  if(dev.tipo==='troca') linhas.push(`Substituição já realizada.`);
  if(dev.tipo==='credito') linhas.push(`Crédito gerado: R$ ${formatMoney(dev.valor)} — disponível pra usar em um próximo serviço ou produto.`);
  if(dev.tipo==='estorno') linhas.push(`Valor estornado: R$ ${formatMoney(dev.valor)}`);
  linhas.push(`Motivo: ${dev.motivo}`, `Data: ${formatDateBR(dev.dataISO)}`, ``, `Qualquer dúvida, chama a gente!`, `LontraHelp — (81) 9 8623-4860 | @lontrahelp`);
  return linhas.join('\n');
}

function EstoqueTab({products, setProducts, devolucoes, setDevolucoes, clients}){
  const [filtro, setFiltro] = useState('reposicao');
  const [devolAlvo, setDevolAlvo] = useState(null);
  const [devolMsg, setDevolMsg] = useState(null);

  const itensProduto = products.filter(p=>p.tipo==='produto' || p.tipo==='insumo');

  const classificar = (p)=>{
    const atual = parseInt(p.estoque)||0;
    const minimo = parseInt(p.estoqueMinimo)||0;
    if(atual<=0) return 'urgente';
    if(minimo>0 && atual<=minimo) return p.essencial ? 'urgente' : 'repor';
    return 'ok';
  };

  const enriquecidos = itensProduto.map(p=>({...p, situacao: classificar(p)}));
  const urgentes = enriquecidos.filter(p=>p.situacao==='urgente');
  const paraRepor = enriquecidos.filter(p=>p.situacao==='repor');
  const okItens = enriquecidos.filter(p=>p.situacao==='ok');

  const listaFiltrada = filtro==='reposicao' ? [...urgentes, ...paraRepor] : enriquecidos;

  const ajustarEstoque = (p, delta)=>{
    const novoValor = Math.max(0, (parseInt(p.estoque)||0) + delta);
    setProducts(prev=>prev.map(x=>x.id===p.id ? {...x, estoque:novoValor} : x));
  };

  const confirmarDevolucao = ({tipo, clientId, motivo, quantidade, valor})=>{
    const qtd = parseInt(quantidade)||1;
    if(tipo==='troca') ajustarEstoque(devolAlvo, -qtd);
    const clientName = clientId ? (clients.find(c=>c.id===clientId)||{}).nome : '';
    const novaDevol = {
      id: uid(), tipo, produtoId: devolAlvo.id, produtoNome: devolAlvo.nome,
      clienteId: clientId||null, clienteNome: clientName||'', motivo,
      quantidade: tipo==='troca' ? qtd : null,
      valor: tipo!=='troca' ? (parseFloat(valor)||0) : null,
      usado: false,
      dataISO: todayISO(), createdAt: new Date().toISOString(),
    };
    setDevolucoes(prev=>[novaDevol, ...prev]);
    setDevolAlvo(null);
    setDevolMsg(novaDevol);
  };

  const situacaoLabel = {urgente:'🔴 Repor urgente', repor:'🟡 Repor em breve', ok:'🟢 Em dia'};

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Estoque</h1>
          <div className="page-sub">Controle do que precisa repor — itens essenciais aparecem primeiro</div>
        </div>
      </div>

      <div className="lucro-split">
        <div className="lucro-box despesa">
          <div className="lb-label" style={{color:'var(--red-no)'}}>Repor urgente</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>{urgentes.length}</div>
        </div>
        <div className="lucro-box" style={{background:'#FFFDF0', border:'1px solid #F0DDA0'}}>
          <div className="lb-label" style={{color:'#9C7A05'}}>Repor em breve</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>{paraRepor.length}</div>
        </div>
        <div className="lucro-box receita">
          <div className="lb-label" style={{color:'var(--green-ok)'}}>Em dia</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>{okItens.length}</div>
        </div>
      </div>

      <div className="filter-toggle">
        <button className={filtro==='reposicao'?'active':''} onClick={()=>setFiltro('reposicao')}>Precisa repor</button>
        <button className={filtro==='todos'?'active':''} onClick={()=>setFiltro('todos')}>Todos os produtos</button>
      </div>

      {itensProduto.length===0 && <div className="empty-state"><div className="ic">📦</div>Nenhum produto cadastrado ainda — cadastre em Produtos.</div>}
      {itensProduto.length>0 && listaFiltrada.length===0 && <div className="empty-state"><div className="ic">✔️</div>Tudo em dia, nada precisa de reposição agora.</div>}

      {listaFiltrada
        .sort((a,b)=>{
          const ordem = {urgente:0, repor:1, ok:2};
          return ordem[a.situacao]-ordem[b.situacao];
        })
        .map(p=>(
        <div className={`estoque-card ${p.situacao}`} key={p.id}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:8}}>
            <div>
              <strong style={{color:'var(--navy)'}}>{p.tipo==='insumo' ? '🧴 ' : ''}{p.nome}</strong>
              {p.essencial && <span className="essencial-badge">NÃO PODE FALTAR</span>}
              <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:2}}>
                {situacaoLabel[p.situacao]} {p.estoqueMinimo ? `· mínimo: ${p.estoqueMinimo}` : ''}
              </div>
            </div>
            <div style={{fontSize:22, fontWeight:800, color: p.situacao==='urgente' ? 'var(--red-no)' : p.situacao==='repor' ? '#9C7A05' : 'var(--green-ok)'}}>
              {p.estoque || 0}
            </div>
          </div>
          <div className="estoque-qty-row">
            <button className="btn btn-outline btn-sm" onClick={()=>ajustarEstoque(p,-1)}>− Saída</button>
            <button className="btn btn-outline btn-sm" onClick={()=>ajustarEstoque(p,1)}>+ Entrada</button>
            {p.tipo!=='insumo' && <button className="btn btn-navy btn-sm" onClick={()=>setDevolAlvo(p)}>🔄 Registrar devolução</button>}
          </div>
        </div>
      ))}

      {devolAlvo && (
        <DevolucaoClienteModal produto={devolAlvo} clients={clients} onSave={confirmarDevolucao} onCancel={()=>setDevolAlvo(null)} />
      )}
      {devolMsg && (
        <CopyTextModal
          title="Devolução registrada — avisar cliente"
          text={buildDevolucaoText(devolMsg, devolMsg.clienteNome)}
          onClose={()=>setDevolMsg(null)}
        />
      )}
    </div>
  );
}

  const tipoBadgeClass = {troca:'devol-badge-troca', credito:'devol-badge-credito', estorno:'devol-badge-estorno'};

  const marcarCreditoUsado = (id)=>{
    setDevolucoes(prev=>prev.map(d=>d.id===id ? {...d, usado:true} : d));
  };

  const saveFornecedor = (data)=>{
    if(editing){
      setDevolucoesFornecedor(prev=>prev.map(d=>d.id===editing.id ? {...d, ...data} : d));
    } else {
      setDevolucoesFornecedor(prev=>[{...data, id:uid(), status:'enviado', resolucao:'', createdAt:new Date().toISOString()}, ...prev]);
    }
    setShowForm(false); setEditing(null);
  };
  const marcarResolvido = (d)=>{
    const resolucao = prompt('O que o fornecedor fez? (Ex: trocou por um novo, reembolsou o valor, etc)') || '';
    setDevolucoesFornecedor(prev=>prev.map(x=>x.id===d.id ? {...x, status:'resolvido', resolucao} : x));
  };
  const deleteFornecedor = (id)=>{
    if(confirm('Excluir este registro?')) setDevolucoesFornecedor(prev=>prev.filter(d=>d.id!==id));
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Devoluções</h1>
          <div className="page-sub">Cliente devolvendo pra você, ou você devolvendo pro fornecedor</div>
        </div>
        {aba==='fornecedor' && <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Nova devolução ao fornecedor</button>}
      </div>

      <div className="filter-toggle">
        <button className={aba==='cliente'?'active':''} onClick={()=>setAba('cliente')}>Cliente → Você</button>
        <button className={aba==='fornecedor'?'active':''} onClick={()=>setAba('fornecedor')}>Você → Fornecedor</button>
      </div>

      {aba==='cliente' && (
        <React.Fragment>
          {ordenadasCliente.length===0 && <div className="empty-state"><div className="ic">🔄</div>Nenhuma devolução registrada ainda. Registre pela aba Estoque, no produto.</div>}
          {ordenadasCliente.map(d=>(
            <div className="troca-card" key={d.id}>
              <strong style={{color:'var(--navy)'}}>{d.produtoNome}</strong> <span className={tipoBadgeClass[d.tipo]}>{tipoLabel[d.tipo]}</span>
              {d.tipo==='credito' && (d.usado ? <span className="devol-badge-usado">Já usado</span> : <span className="devol-badge-credito">Disponível</span>)}
              <div style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:4}}>
                {formatDateBR(d.dataISO)} {d.clienteId ? `· Cliente: ${clientName(d.clienteId)}` : ''}
                {d.tipo==='troca' ? ` · Qtd: ${d.quantidade}` : ` · R$ ${formatMoney(d.valor)}`}
              </div>
              <div style={{fontSize:12.5, color:'var(--navy)', marginTop:6}}>{d.motivo}</div>
              {d.tipo==='credito' && !d.usado && (
                <button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>marcarCreditoUsado(d.id)}>✔ Marcar crédito como usado</button>
              )}
            </div>
          ))}
        </React.Fragment>
      )}

      {aba==='fornecedor' && (
        <React.Fragment>
          {ordenadasFornecedor.length===0 && <div className="empty-state"><div className="ic">📦</div>Nenhuma devolução ao fornecedor registrada.</div>}
          {ordenadasFornecedor.map(d=>(
            <div className={`fornecedor-card ${d.status==='resolvido'?'resolvido':''}`} key={d.id}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
                <div>
                  <strong style={{color:'var(--navy)'}}>{d.produtoNome}</strong>
                  <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:2}}>
                    Fornecedor: {d.fornecedor} {d.garantiaFornecedor ? `· Garantia: ${d.garantiaFornecedor}` : ''}
                  </div>
                  <div style={{fontSize:12, color:'var(--ink-soft)'}}>
                    Enviado em {formatDateBR(d.dataISO)} {d.dataCompraOriginal ? `· Comprado em ${formatDateBR(d.dataCompraOriginal)}` : ''}
                  </div>
                </div>
                <span className={d.status==='resolvido' ? 'divida-badge-paga' : 'divida-badge-pendente'}>{d.status==='resolvido' ? 'Resolvido' : 'Aguardando'}</span>
              </div>
              <div style={{fontSize:12.5, color:'var(--navy)', marginTop:6}}>{d.motivo}</div>
              {d.resolucao && <div style={{fontSize:12.5, color:'var(--green-ok)', marginTop:4}}>✔ {d.resolucao}</div>}
              <div style={{display:'flex', gap:6, marginTop:8}}>
                {d.status!=='resolvido' && <button className="btn btn-gold btn-sm" onClick={()=>marcarResolvido(d)}>✔ Marcar como resolvido</button>}
                <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(d); setShowForm(true);}}>Editar</button>
                <button className="btn btn-danger btn-sm" onClick={()=>deleteFornecedor(d.id)}>Excluir</button>
              </div>
            </div>
          ))}
        </React.Fragment>
      )}

      {showForm && (
        <Modal title={editing ? 'Editar devolução ao fornecedor' : 'Nova devolução ao fornecedor'} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
          <DevolucaoFornecedorForm initial={editing} onSave={saveFornecedor} onCancel={()=>{setShowForm(false); setEditing(null);}} />
        </Modal>
      )}
    </div>
  );
}

function DividasTab({dividas, setDividas}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filtro, setFiltro] = useState('pendentes');

  const saveDivida = (data)=>{
    if(editing){
      setDividas(prev=>prev.map(d=>d.id===editing.id ? {...d, ...data} : d));
    } else {
      setDividas(prev=>[{...data, id:uid(), paga:false, dataPagamento:null, createdAt:new Date().toISOString()}, ...prev]);
    }
    setShowForm(false); setEditing(null);
  };
  const marcarPaga = (d)=>{
    setDividas(prev=>prev.map(x=>x.id===d.id ? {...x, paga:true, dataPagamento:new Date().toISOString()} : x));
  };
  const deleteDivida = (id)=>{
    if(confirm('Excluir esse registro de dívida?')) setDividas(prev=>prev.filter(d=>d.id!==id));
  };

  const pendentes = dividas.filter(d=>!d.paga);
  const pagas = dividas.filter(d=>d.paga);
  const totalPendente = pendentes.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
  const listaFiltrada = filtro==='pendentes' ? pendentes : filtro==='pagas' ? pagas : dividas;

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Dívidas</h1>
          <div className="page-sub">Compras feitas no cartão da empresa — o que ainda falta pagar</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Nova compra</button>
      </div>

      <div className="lucro-split">
        <div className="lucro-box despesa">
          <div className="lb-label" style={{color:'var(--red-no)'}}>Total pendente</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>R$ {formatMoney(totalPendente)}</div>
        </div>
        <div className="lucro-box receita">
          <div className="lb-label" style={{color:'var(--green-ok)'}}>Já pagas</div>
          <div className="lb-value" style={{color:'var(--navy)'}}>{pagas.length}</div>
        </div>
      </div>

      <div className="filter-toggle">
        <button className={filtro==='pendentes'?'active':''} onClick={()=>setFiltro('pendentes')}>Pendentes</button>
        <button className={filtro==='pagas'?'active':''} onClick={()=>setFiltro('pagas')}>Pagas</button>
        <button className={filtro==='todas'?'active':''} onClick={()=>setFiltro('todas')}>Todas</button>
      </div>

      {listaFiltrada.length===0 && <div className="empty-state"><div className="ic">💳</div>Nenhuma dívida por aqui.</div>}
      {listaFiltrada.map(d=>(
        <div className={`divida-card ${d.paga?'paga':''}`} key={d.id}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
            <div>
              <strong style={{color:'var(--navy)'}}>{d.descricao}</strong> {d.paga ? <span className="divida-badge-paga">Paga</span> : <span className="divida-badge-pendente">Pendente</span>}
              <div style={{fontSize:12, color:'var(--ink-soft)', marginTop:2}}>
                {formatDateBR(d.dataCompra)} {d.fornecedor ? `· ${d.fornecedor}` : ''} {d.notaFiscal ? `· NF: ${d.notaFiscal}` : ''}
              </div>
            </div>
            <div style={{fontSize:18, fontWeight:800, color:'var(--navy)'}}>R$ {formatMoney(d.valor)}</div>
          </div>
          <div style={{display:'flex', gap:6, marginTop:8}}>
            {!d.paga && <button className="btn btn-gold btn-sm" onClick={()=>marcarPaga(d)}>✔ Marcar como paga</button>}
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(d); setShowForm(true);}}>Editar</button>
            <button className="btn btn-danger btn-sm" onClick={()=>deleteDivida(d.id)}>Excluir</button>
          </div>

      {showForm && (
        <Modal title={editing ? 'Editar compra' : 'Nova compra no cartão'} onClose={()=>{setShowForm(false); setEditing(null);}}>

        </Modal>
      )}
    </div>
  );
}

function GarantiaTab({orders, clients, setOrders}){
  const [filter, setFilter] = useState('ativas');
  const [search, setSearch] = useState('');
  const [vistoriaTarget, setVistoriaTarget] = useState(null);
  const [relatoText, setRelatoText] = useState('');

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || '—';
  const today = todayISO();

  const enriched = orders.map(o=>{
    const inicioGarantia = orderGarantiaInicio(o);
    if(inicioGarantia === null){
      // OS ainda não concluída — garantia ainda não começou a contar, não é "ativa"
      return {...o, fimFisica:null, fimSoftware:null, fisicaAtiva:false, softwareAtiva:false, algumaAtiva:false, garantiaPendente: o.temGarantia!==false};
    }
    const fimFisica = addDays(inicioGarantia, o.garantiaFisicaDias||0);
    const fimSoftware = addDays(inicioGarantia, o.garantiaSoftwareDias||0);
    const tipoGarantia = o.tipoGarantia||'ambos';
    const fisicaAtiva = tipoGarantia!=='apenas_software' && today <= fimFisica;
    const softwareAtiva = tipoGarantia!=='apenas_maodeobra' && today <= fimSoftware;
    return {...o, fimFisica, fimSoftware, fisicaAtiva, softwareAtiva, algumaAtiva: fisicaAtiva || softwareAtiva, garantiaPendente: false};
  });

  let list = enriched;
  if(filter==='ativas') list = list.filter(o=>o.algumaAtiva);
  if(filter==='vistoria') list = list.filter(o=>o.vistoria && !o.vistoria.resolvido);
  list = list.filter(o=> clientName(o.clientId).toLowerCase().includes(search.toLowerCase()) || o.osNumber.includes(search) || (o.numeroSerie||'').toLowerCase().includes(search.toLowerCase()));
  list = list.sort((a,b)=>{
    const aFlag = a.vistoria && !a.vistoria.resolvido ? 0 : 1;
    const bFlag = b.vistoria && !b.vistoria.resolvido ? 0 : 1;
    if(aFlag!==bFlag) return aFlag-bFlag;
    return b.dataISO.localeCompare(a.dataISO);
  });

  const abrirVistoria = (order)=>{
    setVistoriaTarget(order);
    setRelatoText('');
  };
  const salvarVistoria = ()=>{
    if(!relatoText.trim()) return;
    setOrders(prev=>prev.map(o=>o.id===vistoriaTarget.id ? {...o, vistoria:{relato:relatoText, data:new Date().toISOString(), resolvido:false}} : o));
    setVistoriaTarget(null); setRelatoText('');
  };
  const resolverVistoria = (id)=>{
    setOrders(prev=>prev.map(o=>o.id===id ? {...o, vistoria:{...o.vistoria, resolvido:true, dataResolucao:new Date().toISOString()}} : o));
  };
  const limparVistoria = (id)=>{
    if(confirm('Remover o registro de vistoria deste item?')) setOrders(prev=>prev.map(o=>o.id===id ? {...o, vistoria:null} : o));
  };

  const flaggedCount = enriched.filter(o=>o.vistoria && !o.vistoria.resolvido).length;

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Garantia</h1>
          <div className="page-sub">Controle de garantias ativas por número de série / OS</div>
        </div>
        {flaggedCount>0 && <span className="pill pill-red">{flaggedCount} para vistoria</span>}
      </div>

      <div className="filter-toggle">
        <button className={filter==='ativas'?'active':''} onClick={()=>setFilter('ativas')}>Garantias ativas</button>
        <button className={filter==='vistoria'?'active':''} onClick={()=>setFilter('vistoria')}>Para vistoria</button>
        <button className={filter==='todas'?'active':''} onClick={()=>setFilter('todas')}>Todas as OS</button>
      </div>

      <div className="search-bar">
        <input placeholder="Buscar por cliente, nº OS ou nº de série..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>

      {list.length===0 && <div className="empty-state"><div className="ic">🛡️</div>Nenhum item encontrado.</div>}

      {list.map(o=>{
        const flagged = o.vistoria && !o.vistoria.resolvido;
        return (
          <div className={`warranty-card ${flagged?'flagged':''}`} key={o.id}>
            <div className="warranty-top">
              <div>
                <strong style={{color:'var(--navy)', fontSize:14.5}}>OS #{o.osNumber} — {clientName(o.clientId)}</strong>
                <div style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:2}}>
                  {o.equipamento || 'Equipamento não informado'} {o.numeroSerie && `· Nº Série: ${o.numeroSerie}`} · Emitida em {formatDateBR(o.dataISO)}
                </div>
              </div>
              {flagged && <span className="pill pill-red">🔴 Aguardando vistoria</span>}
              {!flagged && o.vistoria && o.vistoria.resolvido && <span className="pill pill-green">✔ Vistoria resolvida</span>}
            </div>
            <div className="warranty-badges">
              {o.garantiaPendente ? (
                <span className="wbadge pending">⏳ Garantia começa a contar quando a OS for concluída (equipamento entregue)</span>
              ) : (
                <React.Fragment>
                  {(o.tipoGarantia||'ambos')!=='apenas_software' && (
                    <span className={`wbadge ${o.fisicaAtiva?'active':'expired'}`}>Física: {o.fisicaAtiva ? `ativa até ${formatDateBR(o.fimFisica)}` : `expirada em ${formatDateBR(o.fimFisica)}`}</span>
                  )}
                  {(o.tipoGarantia||'ambos')!=='apenas_maodeobra' && (
                    <span className={`wbadge ${o.softwareAtiva?'active':'expired'}`}>Software: {o.softwareAtiva ? `ativa até ${formatDateBR(o.fimSoftware)}` : `expirada em ${formatDateBR(o.fimSoftware)}`}</span>
                  )}
                </React.Fragment>
              )}
            </div>
            {o.vistoria && (
              <div className="vistoria-box">
                <strong>Relato:</strong> {o.vistoria.relato}
                <div style={{fontSize:11, color:'var(--ink-soft)', marginTop:4}}>
                  Registrado em {new Date(o.vistoria.data).toLocaleString('pt-BR')}
                  {o.vistoria.resolvido && ` · Resolvido em ${new Date(o.vistoria.dataResolucao).toLocaleString('pt-BR')}`}
                </div>
              </div>
            )}
            <div className="appt-actions">
              {!o.vistoria && <button className="btn btn-outline btn-sm" onClick={()=>abrirVistoria(o)}>🔍 Registrar problema / vistoria</button>}
              {flagged && <button className="btn btn-outline btn-sm" onClick={()=>resolverVistoria(o.id)}>✔ Marcar como resolvido</button>}
              {o.vistoria && <button className="btn btn-danger btn-sm" onClick={()=>limparVistoria(o.id)}>Limpar registro</button>}
            </div>
          </div>
        );
      })}

      {vistoriaTarget && (
        <Modal title={`Registrar vistoria — OS #${vistoriaTarget.osNumber}`} onClose={()=>setVistoriaTarget(null)} footer={
          <React.Fragment>
            <button className="btn btn-outline" onClick={()=>setVistoriaTarget(null)}>Cancelar</button>
            <button className="btn btn-gold" disabled={!relatoText.trim()} onClick={salvarVistoria}>Salvar</button>
          </React.Fragment>
        }>
          <div className="field">
            <label>O que o cliente relatou / o que você verificou</label>
            <textarea value={relatoText} onChange={e=>setRelatoText(e.target.value)} placeholder="Ex: Cliente relatou que o notebook está desligando sozinho. Verifiquei e realmente apresenta o problema — vou olhar." style={{minHeight:100}} />
          </div>
        </Modal>
      )}
    </div>
  );
}

        </button>
      </div>
    </div>
  );
}

function DiagnosticosTab({diagnosticos, setDiagnosticos, clients, setClients, orcamentos, setOrcamentos, config, setConfig, goTo, autoOpenNew}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showClientQuick, setShowClientQuick] = useState(false);
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);

  useEffect(()=>{ if(autoOpenNew){ setEditing(null); setShowForm(true); } }, [autoOpenNew]);

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || 'Cliente não encontrado';
  const filtered = diagnosticos.filter(d=> d.numero.toLowerCase().includes(search.toLowerCase()) || clientName(d.clientId).toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>{
      if(!!a.prioridade !== !!b.prioridade) return a.prioridade ? -1 : 1;
      return b.dataISO.localeCompare(a.dataISO);
    });
  const selected = diagnosticos.find(d=>d.id===selectedId);
  useDocumentTitle(selected ? `Diagnóstico ${selected.numero} - ${clientName(selected.clientId)}` : null);

  const saveDiag = (data)=>{
    if(editing){
      setDiagnosticos(prev=>prev.map(d=>d.id===editing.id ? {...d, ...data} : d));
      setShowForm(false); setEditing(null);
      setSelectedId(editing.id);
    } else {
      const novoId = uid();
      setConfig(prevConfig=>{
        const counter = (prevConfig.diagCounter||100000)+1;
        const novo = {...data, id:novoId, numero: generateDiagNumber(counter), orcamentoId:null, createdAt:new Date().toISOString()};
        setDiagnosticos(prev=>[novo, ...prev]);
        setSelectedId(novoId);
        return {...prevConfig, diagCounter:counter};
      });
      setShowForm(false); setEditing(null);
    }
  };
  const deleteDiag = (id)=>{
    if(confirm('Excluir este diagnóstico?')){
      setDiagnosticos(prev=>prev.filter(d=>d.id!==id));
      if(selectedId===id) setSelectedId(null);
    }
  };
  const quickAddClient = (data)=>{
    const novo = {...data, id:uid(), createdAt:new Date().toISOString(), interacoes:[]};
    setClients(prev=>[novo, ...prev]);
    setShowClientQuick(false);
  };

  const gerarOrcamento = (diag)=>{
    if(diag.orcamentoId){
      goTo('orcamentos');
      return;
    }
    const novoId = uid();
    const recomendacaoTexto = diag.recomendacao && diag.recomendacao.trim()
      ? `Baseado no diagnóstico ${diag.numero}:\n${diag.recomendacao.trim()}`
      : `Baseado no diagnóstico ${diag.numero}.`;
    const itensIniciais = [{id:uid(), descricao:'', fornecedor:'', fornecedorLink:'', garantiaFornecedor:'', valorAVista:'', valorParcelado:'', parcelasFornecedor:'', quantidade:1}];
    if(diag.prioridade && parseFloat(diag.taxaPrioridade)>0){
      itensIniciais.unshift({id:uid(), descricao:'Taxa de verificação prioritária', fornecedor:'', fornecedorLink:'', garantiaFornecedor:'', valorAVista:String(diag.taxaPrioridade), valorParcelado:'', parcelasFornecedor:'', quantidade:1});
    }
    setConfig(prevConfig=>{
      const counter = (prevConfig.orcCounter||500000)+1;
      const novo = {
        id: novoId,
        numero: generateOrcNumber(counter),
        dataISO: todayISO(),
        clientId: diag.clientId,
        itens: itensIniciais,
        maoDeObraAVista: '', maoDeObraParcelado: '',
        parcelamentoMax: 3, parcelamentoJuros: '',
        validadeDias: 7,
        observacoes: recomendacaoTexto,
        status: 'em_preparo', enviadoEm: null,
        diagnosticoOrigemId: diag.id,
        createdAt: new Date().toISOString()
      };
      setOrcamentos(prev=>[novo, ...prev]);
      return {...prevConfig, orcCounter:counter};
    });
    setDiagnosticos(prev=>prev.map(d=>d.id===diag.id ? {...d, orcamentoId:novoId} : d));
    goTo('orcamentos');
  };

  if(selected){
    const client = clients.find(c=>c.id===selected.clientId);
    return (
      <div>
        <div className="receipt-toolbar no-print">
          <button className="btn btn-outline btn-sm" onClick={()=>setSelectedId(null)}>← Voltar para diagnósticos</button>
          <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(selected); setShowForm(true);}}>Editar</button>
            <button className="btn btn-gold" onClick={imprimirDocumento}>📄 Salvar / Compartilhar PDF</button>
          </div>
        </div>
        <div className="no-print" style={{maxWidth:720, margin:'0 auto 16px'}}>
          <div className="card">
            {selected.orcamentoId ? (
              <div className="orc-status-note" style={{background:'#E7F5EC', color:'var(--green-ok)'}}>✔ Orçamento já gerado a partir deste diagnóstico.</div>
            ) : (
              <div className="orc-status-note">Diagnóstico pronto. Quando quiser, gere o orçamento com as peças e valores pra recuperar o equipamento.</div>
            )}
            <button className="btn btn-gold btn-sm" style={{marginTop:8}} onClick={()=>gerarOrcamento(selected)}>
              {selected.orcamentoId ? '💰 Ver orçamento gerado' : '💰 Gerar orçamento a partir deste diagnóstico'}
            </button>
          </div>
        </div>
        <DiagnosticoView diag={selected} client={client} />
        {showForm && (
          <Modal title={`Editar diagnóstico ${editing.numero}`} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
            <DiagnosticoForm initial={editing} clients={clients} onSave={saveDiag} onCancel={()=>{setShowForm(false); setEditing(null);}} onQuickAddClient={()=>setShowClientQuick(true)} />
          </Modal>
        )}
        {showClientQuick && (
          <Modal title="Novo cliente" onClose={()=>setShowClientQuick(false)}>
            <ClientForm onSave={quickAddClient} onCancel={()=>setShowClientQuick(false)} clients={clients} />
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Diagnóstico</h1>
          <div className="page-sub">Documenta o problema encontrado antes de gerar o orçamento</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Novo diagnóstico</button>
      </div>
      <div className="search-bar">
        <input placeholder="Buscar por número ou cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {filtered.length===0 && <div className="empty-state"><div className="ic">🔍</div>Nenhum diagnóstico registrado ainda.</div>}
      {filtered.map(d=>(
        <div className="list-item" key={d.id} onClick={()=>setSelectedId(d.id)}>
          <div className="li-main">
            <strong>{d.numero} — {clientName(d.clientId)}</strong> {d.prioridade && <span className="pill pill-gold">⚡ Verificação rápida</span>} {d.orcamentoId && <span className="pill pill-green">💰 Orçamento gerado</span>}
            <div className="meta">{formatDateBR(d.dataISO)} · {d.equipamento || 'Equipamento não informado'}{d.prazoEntregaEstimado ? ` · Previsão: ${formatDateBR(d.prazoEntregaEstimado)}` : ''}</div>
          </div>
          <div style={{display:'flex', gap:6}} onClick={e=>e.stopPropagation()}>
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(d); setShowForm(true);}}>Editar</button>
            <button className="btn btn-danger btn-sm" onClick={()=>deleteDiag(d.id)}>Excluir</button>
          </div>
        </div>
      ))}

      {showForm && (
        <Modal title={editing ? `Editar ${editing.numero}` : 'Novo Diagnóstico'} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
          <DiagnosticoForm initial={editing} clients={clients} onSave={saveDiag} onCancel={()=>{setShowForm(false); setEditing(null);}} onQuickAddClient={()=>setShowClientQuick(true)} />
        </Modal>
      )}
      {showClientQuick && (
        <Modal title="Novo cliente" onClose={()=>setShowClientQuick(false)}>
          <ClientForm onSave={quickAddClient} onCancel={()=>setShowClientQuick(false)} clients={clients} />
        </Modal>
      )}
    </div>
  );
}

        <div className="field">
          <label>{f.itens.filter(it=>it.descricao && it.descricao.trim()).length===0 ? '⚠️ O que essa mão de obra inclui (obrigatório quando não tem peça nenhuma)' : 'O que inclui esse serviço (aparece no orçamento pro cliente)'}</label>
          <textarea value={f.observacoes} onChange={e=>set('observacoes',e.target.value)} placeholder={"Ex:\nFormatação completa do sistema operacional, instalação de programas essenciais e drivers, limpeza física do equipamento."} style={{minHeight:100}} />
        </div>
      </div>
      {(()=>{
        const descricoesItens = f.itens.filter(it=>it.descricao && it.descricao.trim()).map(it=>it.descricao.trim().toLowerCase());
        if(descricoesItens.length===0 || !f.observacoes.trim()) return null;
        const linhasObs = f.observacoes.split('\n');
        const linhasRepetidas = linhasObs.filter(linha=>{
          const l = linha.trim().toLowerCase();
          if(!l) return false;
          return descricoesItens.some(desc => desc.length>8 && l.startsWith(desc.slice(0, Math.min(desc.length, 25))));
        });
        if(linhasRepetidas.length===0) return null;
        const limparRepetidas = ()=>{
          const linhasLimpas = linhasObs.filter(linha=>!linhasRepetidas.includes(linha));
          set('observacoes', linhasLimpas.join('\n').replace(/\n{3,}/g,'\n\n').trim());
        };
        return (
          <div style={{fontSize:12.5, color:'#9C7A05', background:'#FFF6DC', padding:'10px 12px', borderRadius:8, marginBottom:14}}>
            ⚠️ Encontrei {linhasRepetidas.length} linha(s) aqui que parecem repetir peças que já estão na lista de itens acima. Quer limpar automaticamente?
            <div style={{marginTop:8}}>
              <button type="button" className="btn btn-gold btn-sm" onClick={limparRepetidas}>🧹 Remover linhas repetidas</button>
            </div>
          </div>
        );
      })()}
      {f.itens.filter(it=>it.descricao && it.descricao.trim()).length===0 && !f.observacoes.trim() && (
        <div style={{fontSize:12, color:'#9C7A05', background:'#FFF6DC', padding:'8px 12px', borderRadius:8, marginBottom:10}}>
          Sem peça nenhuma aqui, o orçamento vai mostrar só um valor de mão de obra sem dizer o que é. Descreva o serviço acima (ex: "Formatação de computador") pra ficar claro pro cliente.
        </div>
      )}

      <div className="section-bar">Frete (opcional)</div>
      <div style={{fontSize:12.5, color:'var(--ink-soft)', marginBottom:10}}>
        Só preenche se o cliente tiver que pagar frete de alguma peça. Se deixar em branco, não aparece em lugar nenhum do orçamento.
      </div>
      <div className="field-row">
        <div className="field">
          <label>Valor do frete R$</label>
          <input type="number" step="0.01" placeholder="Deixe em branco se não tiver frete" value={f.frete} onChange={e=>set('frete',e.target.value)} />
        </div>
      </div>

      <div className="orc-price-split">
        <div className="orc-price-box avista">
          <div className="opb-label">Total à vista</div>
          <div className="opb-value">R$ {formatMoney(totals.totalAVista)}</div>
        </div>
        <div className="orc-price-box parcelado">
          <div className="opb-label">Total parcelado</div>
          <div className="opb-value">R$ {formatMoney(totals.totalParcelado)}</div>
          <div className="opb-sub">até {totals.parcelasMaoDeObra}x de R$ {formatMoney(totals.totalParcelado/totals.parcelasMaoDeObra)}</div>
        </div>
      </div>
      <div style={{fontSize:11.5, color:'var(--ink-soft)', marginBottom:8, marginTop:-6}}>
        O parcelado soma peças (parcelamento do fornecedor, ou à vista se não informado) + mão de obra parcelada na sua maquineta.
      </div>
      <div style={{fontSize:13, color:'var(--navy)', background:'var(--blue-bg)', padding:'8px 12px', borderRadius:8, marginBottom:14, fontWeight:700}}>
        💰 O que é seu de verdade nesse orçamento (mão de obra + peças próprias): R$ {formatMoney(totals.meuGanho)}
        {totals.subtotalPecasTerceiros>0 && <span style={{fontWeight:400, display:'block', fontSize:11.5, marginTop:2}}>Não conta peça de fornecedor externo: R$ {formatMoney(totals.subtotalPecasTerceiros)} (o cliente paga direto pra eles)</span>}
      </div>

      <div style={{display:'flex', justifyContent:'flex-end', gap:10, marginTop:16}}>
        <button className="btn btn-outline" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-gold" disabled={!f.clientId} onClick={()=>onSave(f)}>
          {initial ? 'Salvar alterações' : 'Criar orçamento'}
        </button>
      </div>
    </div>
  );
}

      </div>
      <div className="r-banner">ORÇAMENTO DE SERVIÇO</div>

        <div className="orc-mao-totais-bloco">

          <div className="orc-subtotal-row"><span>Mão de obra — parcelado na maquineta ({totals.parcelasMaoDeObra}x)</span><span>R$ {formatMoney(totals.maoParcelado)}</span></div>

            <div className="orc-subtotal-row"><span>Frete</span><span>R$ {formatMoney(totals.frete)}</span></div>

              <div className="opb-label">Total à vista</div>
              <div className="opb-value">R$ {formatMoney(totals.totalAVista)}</div>

}

function OrcamentosTab({orcamentos, setOrcamentos, clients, setClients, config, setConfig, orders, setOrders, goTo, autoOpenNew}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showClientQuick, setShowClientQuick] = useState(false);
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [statusMsgOrc, setStatusMsgOrc] = useState(null);
  const [osGeradaInfo, setOsGeradaInfo] = useState(null);

  useEffect(()=>{ if(autoOpenNew){ setEditing(null); setShowForm(true); } }, [autoOpenNew]);

  const clientName = (id)=> (clients.find(c=>c.id===id)||{}).nome || 'Cliente não encontrado';
  const filtered = orcamentos.filter(o=> o.numero.toLowerCase().includes(search.toLowerCase()) || clientName(o.clientId).toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=> b.dataISO.localeCompare(a.dataISO));
  const selected = orcamentos.find(o=>o.id===selectedId);
  useDocumentTitle(selected ? `Orçamento ${selected.numero} - ${clientName(selected.clientId)}` : null);

  const saveOrc = (data)=>{
    if(editing){
      setOrcamentos(prev=>prev.map(o=>o.id===editing.id ? {...o, ...data} : o));
      setShowForm(false); setEditing(null);
      setSelectedId(editing.id);
    } else {
      const novoId = uid();
      setConfig(prevConfig=>{
        const counter = (prevConfig.orcCounter||500000)+1;
        const novo = {...data, id:novoId, numero: generateOrcNumber(counter), status:'em_preparo', enviadoEm:null, createdAt:new Date().toISOString()};
        setOrcamentos(prev=>[novo, ...prev]);
        setSelectedId(novoId);
        return {...prevConfig, orcCounter:counter};
      });
      setShowForm(false); setEditing(null);
    }
  };
  const deleteOrc = (id)=>{
    if(confirm('Excluir este orçamento?')){
      setOrcamentos(prev=>prev.filter(o=>o.id!==id));
      if(selectedId===id) setSelectedId(null);
    }
  };
  const quickAddClient = (data)=>{
    const novo = {...data, id:uid(), createdAt:new Date().toISOString(), interacoes:[]};
    setClients(prev=>[novo, ...prev]);
    setShowClientQuick(false);
  };
  const setOrcStatus = (orc, status, extra)=>{
    const atualizado = {...orc, status, ...(extra||{})};
    setOrcamentos(prev=>prev.map(o=>o.id===orc.id ? atualizado : o));
    return atualizado;
  };
  const marcarPreparo = (orc)=> setOrcStatus(orc, 'em_preparo');
  const marcarAnaliseFinal = (orc)=> setOrcStatus(orc, 'analise_final');
  const marcarEnviado = (orc)=>{
    const atualizado = setOrcStatus(orc, 'enviado', {enviadoEm: new Date().toISOString()});
    setStatusMsgOrc(atualizado);
  };
  const marcarAprovado = (orc)=>{
    if(orc.osId){
      // já tem OS vinculada, só atualiza status
      setOrcStatus(orc, 'aprovado');
      return;
    }
    const totals = computeOrcTotals(orc);
    const novoId = uid();
    setConfig(prevConfig=>{
      const counter = (prevConfig.osCounter||1000000)+1;
      const novaOrdem = {
        id: novoId,
        osNumber: generateOsNumber(counter),
        dataISO: todayISO(),
        tecnico: 'Gabriel',
        clientId: orc.clientId,
        equipamento: '',
        numeroSerie: '',
        // Peças e mão de obra vêm separados do orçamento — cada peça mantém se é sua ou de fornecedor externo.
        itens: (orc.itens||[]).filter(it=>it.descricao && it.descricao.trim()).map(it=>({...it})),
        maoDeObra: String(totals.maoAVista),
        frete: orc.frete || '',
        observacoes: orc.observacoes && orc.observacoes.trim() ? orc.observacoes.trim() : '',
        valor: String(totals.totalAVista),
        formaPagamento: '',
        garantiaFisicaDias: 90,
        garantiaSoftwareDias: 7,
        status: 'em_andamento',
        statusHistorico: [{status:'em_andamento', nota:`Gerada a partir do orçamento ${orc.numero}`, data:new Date().toISOString()}],
        orcamentoOrigemId: orc.id,
        createdAt: new Date().toISOString()
      };
      setOrders(prevOrders=>[novaOrdem, ...prevOrders]);
      return {...prevConfig, osCounter:counter};
    });
    setOrcamentos(prev=>prev.map(o=>o.id===orc.id ? {...o, status:'aprovado', osId:novoId} : o));
    setOsGeradaInfo({osId:novoId, orcNumero:orc.numero});
  };
  const marcarRecusado = (orc)=> setOrcStatus(orc, 'recusado');

  // Corrige uma OS já vinculada a esse orçamento que ainda está no formato antigo (sem peças/mão de obra separadas) —
  // acontece quando o orçamento já tinha sido aprovado ANTES da separação existir no sistema.
  const sincronizarPecasNaOS = (orc)=>{
    if(!orc.osId) return;
    const totals = computeOrcTotals(orc);
    setOrders(prev=>prev.map(o=> o.id===orc.osId ? {
      ...o,
      itens: (orc.itens||[]).filter(it=>it.descricao && it.descricao.trim()).map(it=>({...it})),
      maoDeObra: String(totals.maoAVista),
      frete: orc.frete || '',
      valor: String(totals.totalAVista)
    } : o));
  };

  const renderStatusActions = (orc)=>{
    const st = orc.status || 'em_preparo';
    return (
      <React.Fragment>
        <div className="orc-status-note">{STATUS_ORC_DESC[st]}</div>
        {orc.osId && (
          <div style={{marginTop:8}}>
            <button className="btn btn-navy btn-sm" onClick={()=>goTo('recibos', null, null, orc.osId)}>🧾 Ver Ordem de Serviço vinculada</button>
            {(()=>{ const osVinculada = orders.find(o=>o.id===orc.osId); return osVinculada && !orderUsaItens(osVinculada) && (
              <button className="btn btn-outline btn-sm" style={{marginLeft:6}} onClick={()=>sincronizarPecasNaOS(orc)}>🔄 Corrigir peças/mão de obra dessa OS</button>
            ); })()}
          </div>
        )}
        <div style={{display:'flex', gap:6, flexWrap:'wrap', marginTop:8}}>
          {st==='em_preparo' && <button className="btn btn-outline btn-sm" onClick={()=>marcarAnaliseFinal(orc)}>🔎 Marcar análise final</button>}
          {(st==='em_preparo' || st==='analise_final') && <button className="btn btn-gold btn-sm" onClick={()=>marcarEnviado(orc)}>📤 Marcar como enviado</button>}
          {st==='enviado' && (
            <React.Fragment>
              <button className="btn btn-outline btn-sm" onClick={()=>setStatusMsgOrc(orc)}>📋 Gerar mensagem</button>
              <button className="btn btn-gold btn-sm" onClick={()=>marcarAprovado(orc)}>✔ Cliente aprovou</button>
              <button className="btn btn-danger btn-sm" onClick={()=>marcarRecusado(orc)}>✕ Cliente recusou</button>
            </React.Fragment>
          )}
        </div>
      </React.Fragment>
    );
  };

  if(selected){
    const client = clients.find(c=>c.id===selected.clientId);
    const st = selected.status || 'em_preparo';
    const validoAte = st==='enviado' && selected.enviadoEm ? addDays(selected.enviadoEm.slice(0,10), selected.validadeDias||7) : null;
    return (
      <div>
        <div className="receipt-toolbar no-print">
          <button className="btn btn-outline btn-sm" onClick={()=>setSelectedId(null)}>← Voltar para orçamentos</button>
          <div style={{display:'flex', gap:10}}>
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(selected); setShowForm(true);}}>Editar</button>
            <button className="btn btn-gold" onClick={imprimirDocumento}>📄 Salvar / Compartilhar PDF</button>
          </div>
        </div>
        <div className="no-print" style={{maxWidth:720, margin:'0 auto 16px'}}>
          <div className="card">
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8}}>
              <span className={`pill ${STATUS_ORC_PILL[st]}`}>{STATUS_ORC_LABELS[st]}</span>
              {validoAte && <span style={{fontSize:12.5, color:'var(--ink-soft)'}}>Válido até {formatDateBR(validoAte)}</span>}
            </div>
            {renderStatusActions(selected)}
          </div>
        </div>
        <OrcamentoView orc={selected} client={client} />
        {showForm && (
          <Modal title={`Editar orçamento ${editing.numero}`} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
            <OrcamentoForm initial={editing} clients={clients} onSave={saveOrc} onCancel={()=>{setShowForm(false); setEditing(null);}} onQuickAddClient={()=>setShowClientQuick(true)} />
          </Modal>
        )}
        {statusMsgOrc && (
          <CopyTextModal
            title={`Mensagem — ${statusMsgOrc.numero}`}
            text={buildStatusOrcText(statusMsgOrc, clients.find(c=>c.id===statusMsgOrc.clientId))}
            onClose={()=>setStatusMsgOrc(null)}
          />
        )}
        {osGeradaInfo && (
          <Modal title="Orçamento aprovado! ✔" onClose={()=>setOsGeradaInfo(null)} footer={
            <React.Fragment>
              <button className="btn btn-outline" onClick={()=>setOsGeradaInfo(null)}>Fechar</button>
              <button className="btn btn-gold" onClick={()=>{ setOsGeradaInfo(null); goTo('recibos', null, null, osGeradaInfo.osId); }}>🧾 Ver Ordem de Serviço gerada</button>
            </React.Fragment>
          }>
            <p style={{fontSize:13.5, color:'var(--ink-soft)', lineHeight:1.7}}>
              O orçamento <strong>{osGeradaInfo.orcNumero}</strong> foi aprovado e uma Ordem de Serviço já foi criada automaticamente, com as peças, valores e cliente preenchidos — não precisa digitar tudo de novo. Ela começa como <strong>"Em andamento"</strong>; você atualiza o status normalmente conforme for avançando no serviço.
            </p>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Orçamentos</h1>
          <div className="page-sub">{orcamentos.length} orçamento(s) gerado(s)</div>
        </div>
        <button className="btn btn-gold" onClick={()=>{setEditing(null); setShowForm(true);}}>+ Novo orçamento</button>
      </div>
      <div className="search-bar">
        <input placeholder="Buscar por número ou cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      {filtered.length===0 && <div className="empty-state"><div className="ic">💰</div>Nenhum orçamento gerado ainda.</div>}
      {filtered.map(o=>{
        const totals = computeOrcTotals(o);
        const st = o.status || 'em_preparo';
        return (
          <div className="list-item" key={o.id} style={{flexDirection:'column', alignItems:'stretch'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, width:'100%'}}>
              <div className="li-main" onClick={()=>setSelectedId(o.id)} style={{cursor:'pointer'}}>
                <strong>{o.numero} — {clientName(o.clientId)}</strong> <span className={`pill ${STATUS_ORC_PILL[st]}`}>{STATUS_ORC_LABELS[st]}</span>
                <div className="meta">{formatDateBR(o.dataISO)} · à vista R$ {formatMoney(totals.totalAVista)}</div>
              </div>
              <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                <button className="btn btn-outline btn-sm" onClick={(e)=>{e.stopPropagation(); setEditing(o); setShowForm(true);}}>Editar</button>
                <button className="btn btn-danger btn-sm" onClick={(e)=>{e.stopPropagation(); deleteOrc(o.id);}}>Excluir</button>
              </div>
            </div>
            {renderStatusActions(o)}
          </div>
        );
      })}

      {showForm && (
        <Modal title={editing ? `Editar ${editing.numero}` : 'Novo Orçamento'} onClose={()=>{setShowForm(false); setEditing(null);}} wide>
          <OrcamentoForm initial={editing} clients={clients} onSave={saveOrc} onCancel={()=>{setShowForm(false); setEditing(null);}} onQuickAddClient={()=>setShowClientQuick(true)} />
        </Modal>
      )}
      {showClientQuick && (
        <Modal title="Novo cliente" onClose={()=>setShowClientQuick(false)}>
          <ClientForm onSave={quickAddClient} onCancel={()=>setShowClientQuick(false)} clients={clients} />
        </Modal>
      )}
      {statusMsgOrc && (
        <CopyTextModal
          title={`Mensagem — ${statusMsgOrc.numero}`}
          text={buildStatusOrcText(statusMsgOrc, clients.find(c=>c.id===statusMsgOrc.clientId))}
          onClose={()=>setStatusMsgOrc(null)}
        />
      )}
      {osGeradaInfo && (
        <Modal title="Orçamento aprovado! ✔" onClose={()=>setOsGeradaInfo(null)} footer={
          <React.Fragment>
            <button className="btn btn-outline" onClick={()=>setOsGeradaInfo(null)}>Fechar</button>
            <button className="btn btn-gold" onClick={()=>{ setOsGeradaInfo(null); goTo('recibos', null, null, osGeradaInfo.osId); }}>🧾 Ver Ordem de Serviço gerada</button>
          </React.Fragment>
        }>
          <p style={{fontSize:13.5, color:'var(--ink-soft)', lineHeight:1.7}}>
            O orçamento <strong>{osGeradaInfo.orcNumero}</strong> foi aprovado e uma Ordem de Serviço já foi criada automaticamente, com as peças, valores e cliente preenchidos — não precisa digitar tudo de novo. Ela começa como <strong>"Em andamento"</strong>; você atualiza o status normalmente conforme for avançando no serviço.
          </p>
        </Modal>
      )}
    </div>
  );
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const words = (text||'').split(' ');
  let line = '';
  let lines = [];
  for(let n=0;n<words.length;n++){
    const testLine = line + words[n] + ' ';
    const w = ctx.measureText(testLine).width;
    if(w > maxWidth && n>0){
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].replace(/\s*\S*$/, '') + '…';
  }
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
  return lines.length;
}

function drawCircuitPattern(ctx, W, H, color, opacity){
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  const cell = 66;
  const cols = Math.ceil(W/cell)+1;
  const rows = Math.ceil(H/cell)+1;
  for(let cx=0; cx<cols; cx++){
    for(let cy=0; cy<rows; cy++){
      const s = Math.sin(cx*928.371 + cy*123.457)*10000;
      const r = s - Math.floor(s);
      if(r > 0.6) continue;
      const x = cx*cell, y = cy*cell;
      const r2 = ((r*37)%1+1)%1;
      ctx.beginPath();
      if(r2 < 0.28){
        ctx.moveTo(x, y); ctx.lineTo(x+cell, y);
      } else if(r2 < 0.56){
        ctx.moveTo(x, y); ctx.lineTo(x, y+cell);
      } else if(r2 < 0.82){
        ctx.moveTo(x, y); ctx.lineTo(x+cell*0.5, y); ctx.lineTo(x+cell*0.5, y+cell*0.5);
      } else {
        ctx.moveTo(x, y+cell*0.5); ctx.lineTo(x+cell, y+cell*0.5);
      }
      ctx.stroke();
      if(r2 > 0.78){
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
      } else if(r2 < 0.12){
        ctx.fillRect(x-3, y-3, 6, 6);
      }
    }
  }
  ctx.restore();
}

    reader.readAsDataURL(file);
  };
  const removePhoto = ()=>{
    photoImgRef.current = null;
    setPhotoLoaded(false);
    setPhotoDataUrl(null);
  };

  const drawCoverImage = (ctx, img, x, y, w, h, radius)=>{
    const imgRatio = img.width/img.height;
    const boxRatio = w/h;
    let sx, sy, sw, sh;
    if(imgRatio > boxRatio){
      sh = img.height; sw = sh*boxRatio;
      sy = 0; sx = (img.width-sw)/2;
    } else {
      sw = img.width; sh = sw/boxRatio;
      sx = 0; sy = (img.height-sh)/2;
    }
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,radius); else ctx.rect(x,y,w,h);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();
  };

  const draw = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const W = 1080;
    const H = format==='post' ? 1080 : 1920;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // fundo azul mais claro, suave
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, '#2C82C9');
    grad.addColorStop(0.55, '#1B4A73');
    grad.addColorStop(1, '#0F2C48');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // tema circuito, bem suave
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2.5;
    for(let i=0;i<16;i++){
      const seedX = (i*173)%W, seedY = (i*311)%H;
      ctx.beginPath();
      ctx.moveTo(seedX, seedY);
      ctx.lineTo(seedX+70, seedY);
      ctx.lineTo(seedX+70, seedY+70);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(seedX+70, seedY+70, 4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fill();
    }

    let y = format==='post' ? 80 : 110;

    // lontra pequena, no canto/lado

    // LONTRAHELP junto, uma palavra só

    const lontraW = ctx.measureText('LONTRA').width;
    const helpW = ctx.measureText('HELP').width;
    const totalW = lontraW + helpW;
    const startX = W/2 - totalW/2 + 30;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('LONTRA', startX, y+44);
    ctx.fillStyle = '#F4C430';
    ctx.fillText('HELP', startX+lontraW, y+44);
    y += 78;

    ctx.font = '700 22px Inter, sans-serif';
    ctx.fillStyle = '#E8F2FB';
    ctx.textAlign = 'center';
    ctx.fillText('MONTAGEM E FORMATAÇÃO', W/2, y);
    y += 46;

    ctx.fillStyle = '#F4C430';
    ctx.fillRect(W/2-60, y, 120, 5);
    y += 60;

    if(headline && headline.trim()){
      ctx.font = '700 34px Inter, sans-serif';
      ctx.fillStyle = '#F4C430';
      ctx.textAlign = 'center';
      wrapCanvasText(ctx, headline.toUpperCase(), W/2, y, W-160, 42, 2);
      y += 66;
    }

    // foto do produto, se enviada
    if(photoImgRef.current){
      const photoW = W-140;
      const photoH = format==='post' ? 300 : 500;
      drawCoverImage(ctx, photoImgRef.current, 70, y, photoW, photoH, 18);
      ctx.strokeStyle = 'rgba(244,196,48,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(70, y, photoW, photoH, 18); else ctx.rect(70,y,photoW,photoH);
      ctx.stroke();
      y += photoH + 60;
    }

    ctx.font = '800 56px Poppins, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    const titleLines = wrapCanvasText(ctx, title || 'Nome do produto', W/2, y, W-140, 64, 2);
    y += titleLines*64 + 30;

    if(description && description.trim() && !photoImgRef.current){
      ctx.font = '500 27px Inter, sans-serif';
      ctx.fillStyle = '#EAF4FB';
      const descLines = wrapCanvasText(ctx, description, W/2, y, W-220, 36, 2);
      y += descLines*36 + 30;
    } else {
      y += 24;
    }

    const validOptions = priceOptions.filter(o=>o.valor && parseFloat(o.valor)>0);
    validOptions.forEach(opt=>{
      const boxH = 120;
      const boxW = W-180;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(90, y, boxW, boxH, 16) : ctx.rect(90, y, boxW, boxH);
      ctx.fill();
      ctx.strokeStyle = '#F4C430';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(90, y, boxW, boxH, 16) : ctx.rect(90, y, boxW, boxH);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.font = '700 24px Inter, sans-serif';
      ctx.fillStyle = '#F0F8FF';
      ctx.fillText((opt.label || 'Preço').toUpperCase(), W/2, y+42);
      ctx.font = '800 50px Poppins, sans-serif';
      ctx.fillStyle = '#F4C430';
      ctx.fillText('R$ ' + formatMoney(opt.valor), W/2, y+92);
      y += boxH + 20;
    });

    const footerY = H - (format==='post' ? 80 : 130);
    ctx.font = '700 30px Inter, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('📲 Chame no WhatsApp!', W/2, footerY);
    ctx.font = '600 26px Inter, sans-serif';
    ctx.fillStyle = '#DCEBF7';
    ctx.fillText('(81) 9 8623-4860  ·  @lontrahelp', W/2, footerY+40);
  };

  useEffect(()=>{ if(logoLoaded && fontsReady) draw(); }, [logoLoaded, fontsReady, photoLoaded, title, description, headline, format, JSON.stringify(priceOptions)]);

  const downloadImage = ()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const link = document.createElement('a');
    const safeName = (title||'anuncio').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    link.download = `lontrahelp-${safeName||'anuncio'}-${format}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Anúncio</h1>
          <div className="page-sub">Gere posts e stories para divulgar produtos e serviços no Instagram</div>
        </div>
      </div>

      <div className="anuncio-layout">
        <div>
          <div className="format-toggle">
            <button className={format==='post'?'active':''} onClick={()=>setFormat('post')}>⬛ Post (quadrado)</button>
            <button className={format==='story'?'active':''} onClick={()=>setFormat('story')}>📱 Story (vertical)</button>
          </div>

          <div className="field-row">
            <div className="field">
              <label>Produto ou serviço cadastrado</label>
              <select value={selectedProductId} onChange={e=>setSelectedProductId(e.target.value)}>
                <option value="">— Digitar manualmente —</option>
                {products.filter(p=>p.tipo!=='insumo').map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
              </select>
            </div>
          </div>

          {!selectedProduct && (
            <div className="field-row">
              <div className="field">
                <label>Nome do produto/serviço</label>
                <input value={customTitle} onChange={e=>setCustomTitle(e.target.value)} placeholder="Ex: Windows 11 Pro" />
              </div>
            </div>
          )}

          <div className="field-row">
            <div className="field">
              <label>Chamada / destaque (opcional)</label>
              <input value={headline} onChange={e=>setHeadline(e.target.value)} placeholder="Ex: Promoção especial!" />

          </div>

          <div className="section-bar">Foto do produto (opcional)</div>
          {!photoDataUrl ? (
            <label className="btn btn-outline btn-sm" style={{display:'inline-flex', cursor:'pointer'}}>

              <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>handlePhotoUpload(e.target.files[0])} />
            </label>
          ) : (
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
              <img src={photoDataUrl} alt="Foto do produto" style={{width:60, height:60, objectFit:'cover', borderRadius:8, border:'1px solid var(--border)'}} />
              <button className="btn btn-danger btn-sm" onClick={removePhoto}>Remover foto</button>
            </div>
          )}

          <div className="section-bar">Opções de preço</div>
          {priceOptions.map((opt,i)=>(
            <div className="price-opt-row" key={i}>
              <input placeholder="Ex: Apenas o software" value={opt.label} onChange={e=>updatePriceOption(i,'label',e.target.value)} />
              <input type="number" step="0.01" placeholder="Valor R$" value={opt.valor} onChange={e=>updatePriceOption(i,'valor',e.target.value)} />

            </div>
          ))}
          <button type="button" className="btn btn-outline btn-sm" onClick={addPriceOption}>+ Adicionar opção de preço</button>
        </div>

        <div className="anuncio-preview-wrap">
          <canvas ref={canvasRef} className="anuncio-canvas"></canvas>
          <button className="btn btn-gold" onClick={downloadImage}>📥 Baixar imagem PNG</button>
        </div>
      </div>
    </div>
  );

function shadeColor(hex, percent){
  const c = (hex||'#2C82C9').replace('#','');
  const num = parseInt(c,16) || 0x2C82C9;
  let r = (num>>16) + Math.round(2.55*percent);
  let g = ((num>>8)&0xff) + Math.round(2.55*percent);
  let b = (num&0xff) + Math.round(2.55*percent);
  r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}
function isLightColor(hex){
  const c = (hex||'#2C82C9').replace('#','');
  const r = parseInt(c.substr(0,2),16)||0, g = parseInt(c.substr(2,2),16)||0, b = parseInt(c.substr(4,2),16)||0;
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.62;
}
